# Configuration GraphHopper 11.0 pour la génération de boucles vélo (route).
# Le fichier .pbf est passé en ligne de commande : -Ddw.graphhopper.datareader.file=region.osm.pbf
graphhopper:
  datareader.file: ""
  graph.location: graph-cache
  custom_models.directory: config/custom_models

  # road_surface.json (28/09/2026, diagnostic « chemins de terre non signalés ») : pistes agricoles / forestières sans
  # revêtement noté et de qualité autre que 1 (99 % de terre quand le revêtement est noté), et sentiers hors ville sans
  # revêtement noté, fortement évités : l'appli est faite pour le vélo de route. v10 : terre notée (OSM ou ICGC, ajoutée
  # par scripts/icgc_tag.py dans la copie locale de la carte) évitée de la même façon.
  profiles:
    - name: calm
      custom_model_files: [racingbike.json, bike_elevation.json, road_surface.json, loop_calm.json]
    - name: sport
      custom_model_files: [racingbike.json, bike_elevation.json, road_surface.json, loop_sport.json]
    # v17 (relief par allure) : tirages Tranquille qui évitent franchement les côtes (pente moyenne pénalisée)
    - name: calm_flat
      custom_model_files: [racingbike.json, bike_elevation.json, road_surface.json, loop_calm.json, loop_flat.json]
    # repli (v10, choix B) : mêmes profils SANS road_surface.json, utilisés seulement quand aucune boucle propre n'existe
    # (la terre reste limitée par FALLBACK_UNPAVED_* et signalée)
    - name: calm_souple
      custom_model_files: [racingbike.json, bike_elevation.json, loop_calm.json]
    - name: sport_souple
      custom_model_files: [racingbike.json, bike_elevation.json, loop_sport.json]
    # trajet d'approche vers un départ : vélo de route sans préférence de paysage ni évitement de la ville
    - name: approach
      custom_model_files: [racingbike.json, bike_elevation.json, road_surface.json]

  graph.encoded_values: racingbike_priority, racingbike_access, roundabout, racingbike_average_speed, bike_road_access, average_slope, mtb_rating, hike_rating, country, road_class, road_environment, surface, track_type, bike_network, urban_density, osm_way_id

  # % en zone bâtie (rural / résidentiel / ville) calculé à l import
  graph.urban_density.threads: 2

  # Altitude : SRTM 30 m depuis les tuiles publiques AWS (skadi). Lissage pour un D+ réaliste.
  graph.elevation.provider: skadi
  graph.elevation.cache_dir: ./elevation-cache
  graph.elevation.interpolate: bilinear
  graph.elevation.edge_smoothing: moving_average
  graph.elevation.edge_smoothing.moving_average.window_size: 150

  import.osm.ignored_highways: motorway,trunk
  prepare.min_network_size: 200
  graph.dataaccess.default_type: RAM_STORE

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: localhost
  admin_connectors:
    - type: http
      port: 8990
      bind_host: localhost
  request_log:
    appenders: []
logging:
  level: WARN
  appenders:
    - type: console
