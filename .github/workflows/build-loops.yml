name: Générer les boucles vélo

# Lancement manuel : onglet Actions > "Générer les boucles vélo" > Run workflow.
# Les données générées ne sont PAS commitées : elles sont publiées directement sur GitHub Pages (l'historique Git
# ne grossit donc pas à chaque génération). Réglage unique : Settings > Pages > Source = "GitHub Actions".
#
# Modes :
#  - génération normale : starts_mode = names (départs de config/region_barcelona.json) ou planned (plan de couverture)
#  - plan_only = true : calcule seulement le plan de départs et la couverture (rapide, rien n'est publié)
on:
  workflow_dispatch:
    inputs:
      max_starts:
        description: "Nombre maximum de points de départ"
        default: "3"
      durations:
        description: "Durées en heures, séparées par des espaces (ex. 1 1.5 2 3)"
        default: "1 1.5 2 3"
      bbox:
        description: "Emprise lon_min,lat_min,lon_max,lat_max (vide = toute la province de Barcelone)"
        default: "1.65,41.20,2.65,41.85"
      starts_mode:
        description: "Départs : names (liste du fichier de région) ou planned (plan de couverture automatique)"
        type: choice
        options: [names, planned]
        default: names
      dmax_km:
        description: "Plan de couverture : distance maximale visée entre un lieu habité et un départ (km)"
        default: "2"
      plan_only:
        description: "Ne faire que le plan de couverture (rien n'est généré ni publié)"
        type: boolean
        default: false
      workers:
        description: "Départs calculés en parallèle"
        default: "3"

permissions:
  contents: read

concurrency:
  group: build-loops
  cancel-in-progress: true

env:
  GH_VERSION: "11.0"
  REGION_FILE: config/region_barcelona.json

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Ressources de la machine
        run: |
          nproc
          free -g
          df -h . | tail -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Outils (osmium, jq, requests, shapely)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool jq
          pip install -r scripts/requirements.txt

      - name: Cache altitude (tuiles SRTM) et jar GraphHopper
        uses: actions/cache@v4
        with:
          path: |
            elevation-cache
            graphhopper-web.jar
          key: gh-${{ env.GH_VERSION }}-elevation-v1

      - name: Télécharger GraphHopper
        run: |
          [ -f graphhopper-web.jar ] || curl -fL --retry 3 -o graphhopper-web.jar \
            "https://github.com/graphhopper/graphhopper/releases/download/${GH_VERSION}/graphhopper-web-${GH_VERSION}.jar"

      - name: Télécharger l'extrait OSM (Geofabrik) et le découper
        env:
          BBOX_INPUT: ${{ inputs.bbox }}
        run: |
          mkdir -p data
          curl -fL --retry 3 -o data/source.osm.pbf "$(jq -r .geofabrik_url "$REGION_FILE")"
          BBOX="$BBOX_INPUT"
          [ -n "$BBOX" ] || BBOX="$(jq -r '.bbox | map(tostring) | join(",")' "$REGION_FILE")"
          echo "Emprise utilisée : $BBOX"
          osmium extract --bbox "$BBOX" --strategy=smart data/source.osm.pbf -o data/region.osm.pbf --overwrite
          osmium tags-filter data/region.osm.pbf n/place=city,town,village -o data/places.osm.pbf --overwrite
          osmium export data/places.osm.pbf -f geojson -o data/places.geojson --overwrite
          ls -lh data

      - name: Plan de couverture des départs
        if: ${{ inputs.plan_only || inputs.starts_mode == 'planned' }}
        env:
          DMAX_KM: ${{ inputs.dmax_km }}
        run: |
          python scripts/plan_starts.py --pbf data/region.osm.pbf --workdir data \
            --out data/starts_plan.json --report data/coverage.json --dmax-km "$DMAX_KM"

      - name: Publier le plan (départs et couverture)
        if: ${{ inputs.plan_only || inputs.starts_mode == 'planned' }}
        uses: actions/upload-artifact@v4
        with:
          name: plan-departs
          path: |
            data/starts_plan.json
            data/coverage.json
          retention-days: 30

      - name: Démarrer GraphHopper (import OSM + altitude, puis serveur local)
        if: ${{ !inputs.plan_only }}
        run: |
          nohup java -Xmx6g -Ddw.graphhopper.datareader.file=data/region.osm.pbf \
            -jar graphhopper-web.jar server config/graphhopper.yml > gh.log 2>&1 &
          echo $! > gh.pid
          for i in $(seq 1 360); do
            if curl -fs http://localhost:8989/health > /dev/null; then echo "GraphHopper prêt"; exit 0; fi
            if ! kill -0 "$(cat gh.pid)" 2>/dev/null; then echo "GraphHopper s'est arrêté :"; tail -50 gh.log; exit 1; fi
            sleep 10
          done
          echo "Délai dépassé"; tail -50 gh.log; exit 1

      - name: Générer les boucles
        if: ${{ !inputs.plan_only }}
        env:
          MAX_STARTS: ${{ inputs.max_starts }}
          DURATIONS: ${{ inputs.durations }}
          WORKERS: ${{ inputs.workers }}
          STARTS_MODE: ${{ inputs.starts_mode }}
        run: |
          rm -rf web/data
          EXTRA=""
          if [ "$STARTS_MODE" = "planned" ]; then EXTRA="--starts-file data/starts_plan.json"; fi
          python scripts/generate_loops.py \
            --region "$REGION_FILE" \
            --places data/places.geojson \
            --out web/data \
            --max-starts "$MAX_STARTS" \
            --workers "$WORKERS" \
            $EXTRA \
            --durations $DURATIONS

      - name: Archiver les données générées (14 jours)
        if: ${{ !inputs.plan_only }}
        uses: actions/upload-artifact@v4
        with:
          name: loops-data
          path: web/data
          retention-days: 14

      - name: Assembler le site (web app + données fraîches)
        if: ${{ !inputs.plan_only }}
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='/.git' --exclude='/.github' --exclude='/_site' --exclude='/data' --exclude='/config' \
            --exclude='/scripts' --exclude='/graph-cache' --exclude='/elevation-cache' \
            --exclude='/graphhopper-web.jar' --exclude='/gh.log' --exclude='/gh.pid' ./ _site/
          touch _site/.nojekyll
          test -f _site/index.html || echo "ATTENTION : pas d'index.html à la racine du site"
          du -sh _site _site/web/data

      - name: Préparer GitHub Pages
        if: ${{ !inputs.plan_only }}
        uses: actions/configure-pages@v5

      - name: Envoyer le site
        if: ${{ !inputs.plan_only }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: ${{ !inputs.plan_only }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
