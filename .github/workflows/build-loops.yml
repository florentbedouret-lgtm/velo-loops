name: Générer les boucles vélo

# Lancement manuel : onglet Actions > "Générer les boucles vélo" > Run workflow.
# Lancement AUTOMATIQUE : tout push sur main qui touche index.html, mentions.html, gpx.js, profile.js, feedback.js,
# brand/ ou fonts/ republie le
# site tout seul, en mode "site" (sans recalcul, 3 à 5 min) — pas besoin de lancer le workflow à la main après un
# correctif front. Un commit seul, sans ce déclencheur, ne republie JAMAIS le site (Pages = "GitHub Actions" veut
# dire que Pages n'affiche que ce que CE workflow a explicitement déployé, pas l'état du dépôt).
# Les données générées ne sont PAS commitées : elles sont publiées directement sur GitHub Pages (l'historique Git
# ne grossit donc pas à chaque génération). Réglage unique : Settings > Pages > Source = "GitHub Actions".
#
# Modes (champ "mode") :
#  - plan             : plan de départs + mesure de la couverture par zone (scénarios A et B). Rapide, rien n'est publié.
#  - detour           : plan + mesure du détour et de la vitesse d'approche avec GraphHopper. Rien n'est publié.
#  - pilot            : pilote complet (aucun autre réglage à faire) : plan sur la province, environ 35 à 60 départs choisis
#                       (dont 5 ruraux, 2 au nord-ouest, 2 gares, des paires dense/voisin), toutes durées, puis publication.
#  - full             : génération COMPLÈTE des départs DÉJÀ PUBLIÉS (même liste, mêmes clés : pas de nouveau plan, O-13),
#                       toutes durées, puis publication. À ne lancer qu'après accord ; `reuse` coché reprend les départs identiques du site publié.
#                       Budget de calcul : 300 min ; au-delà, plus aucun nouveau départ n'est démarré, le site est publié INCOMPLET et
#                       signalé, et un nouveau lancement avec `reuse` coché termine le travail sans rien recalculer.
#                       Rapport de fin de génération : résumé de l'exécution + artefact `rapport-generation` (à envoyer).
#  - full_replan      : comme full, mais REFAIT le plan des départs sur les données OSM du jour (densification voulue).
#                       Attention : le plan choisit les départs un par un ; une petite évolution d'OSM en déplace des dizaines.
#  - site            : republie le site avec la dernière version des fichiers de la page web (index.html, *.js, ...) et les
#                       données DÉJÀ PUBLIÉES, sans rien recalculer (3 à 5 min). À utiliser après chaque modification de la page.
#  - slope_check      : diagnostic (rien n'est publié) : échantillonne des départs réels du plan (province), calcule leur
#                       pente sur données SRTM réelles à 3 niveaux de lissage (sans lissage / 300 m / 500 m), et teste la
#                       robustesse de plusieurs seuils candidats. Artefact `diagnostic-pente` à envoyer pour analyse.
#  - nature_check     : diagnostic O-12 (rien n'est publié) : pour ~12 départs de centre-ville proches d'un grand espace
#                       vert, compare la meilleure boucle actuelle à des variantes (candidats « vers le vert », côtes non
#                       freinées). Artefact `diagnostic-nature` à envoyer pour analyse. ~30-60 min.
#  - generate_names   : génère les boucles pour les départs nommés de config/region_barcelona.json, puis publie.
#  - generate_planned : génère les boucles pour les départs du plan (scénario choisi), puis publie.
on:
  push:
    branches: [main]
    paths: [index.html, mentions.html, gpx.js, profile.js, feedback.js, 'brand/**', 'fonts/**']
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode : plan, detour, pilot (pilote), full (génération complète), site (republier la page web, sans calcul), slope_check (diagnostic pente/lissage), generate_names ou generate_planned"
        type: choice
        options: [plan, detour, pilot, full, full_replan, site, slope_check, nature_check, generate_names, generate_planned]
        default: plan
      scenario:
        description: "Scénario(s) de départs : A (2/3/4 km), B (3/3/4 km) ou dense,peri,rural en km ; plusieurs séparés par ; (ex. 2,3,3;2,3.5,4). Le premier produit le plan"
        default: "1.75,2.5,2.5"      # scénario en ligne depuis le 23/09/2026 (D16, handoff §3.2)
      max_starts:
        description: "Nombre maximum de points de départ à générer (generate_*)"
        default: "3"
      per_zone:
        description: "generate_planned : pilote avec N départs par zone (dense, peri, rural) ; vide = utiliser max_starts"
        default: ""
      durations:
        description: "Durées en heures, séparées par des espaces (ex. 1 1.5 2 3)"
        default: "0.75 1 1.5 2 3 4"  # durées en ligne depuis le 23/09/2026 (O-3) : ne pas en perdre au prochain full
      bbox:
        description: "Emprise lon_min,lat_min,lon_max,lat_max, ou province. auto = province pour plan et pilot, centre pour les autres modes"
        default: "auto"
      detour_cases:
        description: "Mode detour : trajets à mesurer « Départ A>Départ B » séparés par ; (noms du plan)"
        default: "Barcelona>Montcada i Reixac"
      detour_pairs:
        description: "Mode detour : nombre total de paires lieu habité > départ à router, réparties entre les 3 zones (0 = tous les lieux habités)"
        default: "600"
      reuse:
        description: "generate_* : réutiliser les départs identiques du site déjà publié (même point, mêmes paramètres, moins de 60 jours)"
        type: boolean
        default: false
      workers:
        description: "Départs calculés en parallèle"
        default: "3"

permissions:
  contents: read

concurrency:
  group: build-loops
  cancel-in-progress: false      # un lancement lancé par erreur attend la fin du précédent au lieu de l'interrompre

env:
  GH_VERSION: "11.0"
  REGION_FILE: config/region_barcelona.json

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      mode: ${{ steps.resolve_mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Déterminer le mode effectif
        id: resolve_mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "mode=site" >> "$GITHUB_OUTPUT"
            echo "Déclenché par un push sur main (front modifié) -> republication automatique, mode site"
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ressources de la machine
        run: |
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          nproc
          free -g
          df -h . | tail -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Outils (osmium, jq, requests, shapely)
        if: ${{ steps.resolve_mode.outputs.mode != 'site' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool jq
          pip install -r scripts/requirements.txt

      - name: Cache altitude (tuiles SRTM) et jar GraphHopper
        if: ${{ steps.resolve_mode.outputs.mode != 'site' }}
        uses: actions/cache@v4
        with:
          path: |
            elevation-cache
            graphhopper-web.jar
          key: gh-${{ env.GH_VERSION }}-elevation-v1

      - name: Télécharger GraphHopper
        if: ${{ steps.resolve_mode.outputs.mode != 'site' }}
        run: |
          [ -f graphhopper-web.jar ] || curl -fL --retry 3 -o graphhopper-web.jar \
            "https://github.com/graphhopper/graphhopper/releases/download/${GH_VERSION}/graphhopper-web-${GH_VERSION}.jar"

      - name: Télécharger l'extrait OSM (Geofabrik) et le découper
        if: ${{ steps.resolve_mode.outputs.mode != 'site' }}
        env:
          BBOX_INPUT: ${{ inputs.bbox }}
          MODE: ${{ steps.resolve_mode.outputs.mode }}
        run: |
          mkdir -p data
          curl -fL --retry 3 -o data/source.osm.pbf "$(jq -r .geofabrik_url "$REGION_FILE")"
          BBOX="$BBOX_INPUT"
          if [ -z "$BBOX" ] || [ "$BBOX" = "auto" ]; then
            if [ "$MODE" = "plan" ] || [ "$MODE" = "pilot" ] || [ "${MODE#full}" != "$MODE" ] || [ "$MODE" = "slope_check" ]; then BBOX="province"; else BBOX="1.65,41.20,2.65,41.85"; fi
          fi
          if [ "$BBOX" = "province" ]; then BBOX="$(jq -r '.bbox | map(tostring) | join(",")' "$REGION_FILE")"; fi
          echo "Emprise utilisée : $BBOX"
          osmium extract --bbox "$BBOX" --strategy=smart data/source.osm.pbf -o data/region.osm.pbf --overwrite
          osmium tags-filter data/region.osm.pbf n/place=city,town,village -o data/places.osm.pbf --overwrite
          osmium export data/places.osm.pbf -f geojson -o data/places.geojson --overwrite
          ls -lh data

      - name: Plan de couverture des départs (par zone)
        if: ${{ steps.resolve_mode.outputs.mode != 'generate_names' && steps.resolve_mode.outputs.mode != 'site' }}
        env:
          SCENARIO: ${{ inputs.scenario }}
          MODE: ${{ steps.resolve_mode.outputs.mode }}
          PAIRS: ${{ inputs.detour_pairs }}
        run: |
          SAMPLE=300
          if [ "$MODE" = "detour" ]; then
            if [ "$PAIRS" = "0" ]; then SAMPLE=0; else SAMPLE=$(( PAIRS / 3 + 30 )); [ "$SAMPLE" -lt 300 ] && SAMPLE=300; fi
          fi
          python scripts/plan_starts.py --pbf data/region.osm.pbf --boundaries-pbf data/source.osm.pbf --workdir data \
            --out data/starts_plan.json --report data/coverage.json --demand-out data/demand_sample.json \
            --scenario "$SCENARIO" --sample-per-zone "$SAMPLE"

      - name: Publier le plan (départs, couverture, échantillon)
        if: ${{ steps.resolve_mode.outputs.mode != 'generate_names' && steps.resolve_mode.outputs.mode != 'site' }}
        uses: actions/upload-artifact@v4
        with:
          name: plan-departs
          path: |
            data/starts_plan.json
            data/coverage.json
            data/demand_sample.json
          retention-days: 30

      - name: Démarrer GraphHopper (import OSM + altitude, puis serveur local)
        if: ${{ steps.resolve_mode.outputs.mode != 'plan' && steps.resolve_mode.outputs.mode != 'site' }}
        run: |
          nohup java -Xmx8g -Ddw.graphhopper.datareader.file=data/region.osm.pbf \
            -jar graphhopper-web.jar server config/graphhopper.yml > gh.log 2>&1 &
          echo $! > gh.pid
          for i in $(seq 1 360); do
            if curl -fs http://localhost:8989/health > /dev/null; then echo "GraphHopper prêt"; exit 0; fi
            if ! kill -0 "$(cat gh.pid)" 2>/dev/null; then echo "GraphHopper s'est arrêté :"; tail -50 gh.log; exit 1; fi
            sleep 10
          done
          echo "Délai dépassé"; tail -50 gh.log; exit 1

      - name: Diagnostic pente (sensibilité au lissage, données SRTM réelles)
        if: ${{ steps.resolve_mode.outputs.mode == 'slope_check' }}
        run: |
          python scripts/slope_check.py --gh http://localhost:8989 --starts data/starts_plan.json \
            --n 60 --out data/slope_check.json --out-md data/slope_check.md
          cat data/slope_check.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le diagnostic pente
        if: ${{ steps.resolve_mode.outputs.mode == 'slope_check' }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-pente
          path: |
            data/slope_check.json
            data/slope_check.md
          retention-days: 30

      - name: Diagnostic sortie vers la nature (O-12)
        if: ${{ steps.resolve_mode.outputs.mode == 'nature_check' }}
        run: |
          python scripts/nature_check.py --gh http://localhost:8989 --starts data/starts_plan.json \
            --pbf data/region.osm.pbf --workdir data --names "Gràcia" --n 12 --durations "1 1.5 2" \
            --out data/nature_check.json --out-md data/nature_check.md
          cat data/nature_check.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le diagnostic nature
        if: ${{ always() && steps.resolve_mode.outputs.mode == 'nature_check' }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-nature
          path: |
            data/nature_check.json
            data/nature_check.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Mesurer le détour et la vitesse d'approche
        if: ${{ steps.resolve_mode.outputs.mode == 'detour' }}
        env:
          CASES: ${{ inputs.detour_cases }}
          PAIRS: ${{ inputs.detour_pairs }}
        run: |
          python scripts/measure_detour.py --gh http://localhost:8989 \
            --sample data/demand_sample.json --starts data/starts_plan.json --pbf data/region.osm.pbf \
            --n "$PAIRS" --neighbours 30 --cases "$CASES" --out data/detour.json

      - name: Publier la mesure de détour
        if: ${{ steps.resolve_mode.outputs.mode == 'detour' }}
        uses: actions/upload-artifact@v4
        with:
          name: detour-mesure
          path: |
            data/detour.json
            data/detour_pairs.json
          retention-days: 30

      - name: Générer les boucles
        if: ${{ (startsWith(steps.resolve_mode.outputs.mode, 'generate') || steps.resolve_mode.outputs.mode == 'pilot' || startsWith(steps.resolve_mode.outputs.mode, 'full')) }}
        env:
          MAX_STARTS: ${{ inputs.max_starts }}
          DURATIONS: ${{ inputs.durations }}
          WORKERS: ${{ inputs.workers }}
          MODE: ${{ steps.resolve_mode.outputs.mode }}
          PER_ZONE: ${{ inputs.per_zone }}
          REUSE: ${{ inputs.reuse }}
        run: |
          rm -rf web/data
          EXTRA=""
          if [ "$MODE" = "generate_planned" ] || [ "$MODE" = "pilot" ] || [ "$MODE" = "full_replan" ]; then EXTRA="--starts-file data/starts_plan.json"; fi
          if [ "$MODE" = "full" ]; then                  # O-13 : garder les départs déjà publiés (pas de nouveau plan)
            OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
            python scripts/published_starts.py --site "https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}" --out data/published_starts.json
            EXTRA="--starts-file data/published_starts.json"
          fi
          if [ "${MODE#full}" != "$MODE" ]; then MAX_STARTS=1000; PER_ZONE=""; EXTRA="$EXTRA --time-budget-min 300"; fi
          if [ "$MODE" = "pilot" ] && [ -z "$PER_ZONE" ]; then PER_ZONE=3; fi
          if [ -n "$PER_ZONE" ]; then EXTRA="$EXTRA --per-zone $PER_ZONE --pilot-rural 5 --pilot-box 1.30,41.55,2.60,42.35:2 --neighbour-pilot 20 --neighbour-out data/neighbour_gain.json"; fi
          if [ "$REUSE" = "true" ]; then
            OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
            EXTRA="$EXTRA --reuse-from https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          fi
          python scripts/generate_loops.py \
            --region "$REGION_FILE" \
            --places data/places.geojson \
            --out web/data \
            --max-starts "$MAX_STARTS" \
            --workers "$WORKERS" \
            --timings-out data/timings.json \
            --skipped-out data/skipped.json \
            $EXTRA \
            --durations $DURATIONS

      - name: Publier les mesures du pilote (temps de calcul, gain des départs voisins)
        if: ${{ (startsWith(steps.resolve_mode.outputs.mode, 'generate') || steps.resolve_mode.outputs.mode == 'pilot' || startsWith(steps.resolve_mode.outputs.mode, 'full')) }}
        uses: actions/upload-artifact@v4
        with:
          name: pilote-mesures
          path: |
            data/timings.json
            data/neighbour_gain.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Archiver les données générées (14 jours)
        if: ${{ (startsWith(steps.resolve_mode.outputs.mode, 'generate') || steps.resolve_mode.outputs.mode == 'pilot' || startsWith(steps.resolve_mode.outputs.mode, 'full')) }}
        uses: actions/upload-artifact@v4
        with:
          name: loops-data
          path: web/data
          retention-days: 14

      - name: Récupérer les données déjà publiées (mode site)
        if: ${{ steps.resolve_mode.outputs.mode == 'site' }}
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          python scripts/fetch_published.py --site "https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}" --out web/data

      - name: Assembler le site (web app + données fraîches)
        if: ${{ (startsWith(steps.resolve_mode.outputs.mode, 'generate') || steps.resolve_mode.outputs.mode == 'pilot' || startsWith(steps.resolve_mode.outputs.mode, 'full') || steps.resolve_mode.outputs.mode == 'site') }}
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='/.git' --exclude='/.github' --exclude='/_site' --exclude='/data' --exclude='/config' \
            --exclude='/scripts' --exclude='/graph-cache' --exclude='/elevation-cache' \
            --exclude='/graphhopper-web.jar' --exclude='/gh.log' --exclude='/gh.pid' ./ _site/
          touch _site/.nojekyll
          test -f _site/index.html || echo "ATTENTION : pas d'index.html à la racine du site"
          du -sh _site _site/web/data

      - name: Rapport de génération (critères de réussite)
        if: ${{ (startsWith(steps.resolve_mode.outputs.mode, 'generate') || steps.resolve_mode.outputs.mode == 'pilot' || startsWith(steps.resolve_mode.outputs.mode, 'full')) }}
        run: |
          python scripts/report_generation.py --data web/data --timings data/timings.json --skipped data/skipped.json \
            --plan data/starts_plan.json --site _site --job-seconds "$(( $(date +%s) - JOB_START ))" \
            --out-md data/rapport-generation.md --out-json data/rapport-generation.json \
            --out-csv data/combinaisons-absentes-par-depart.csv
          cat data/rapport-generation.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le rapport de génération
        if: ${{ (startsWith(steps.resolve_mode.outputs.mode, 'generate') || steps.resolve_mode.outputs.mode == 'pilot' || startsWith(steps.resolve_mode.outputs.mode, 'full')) }}
        uses: actions/upload-artifact@v4
        with:
          name: rapport-generation
          path: |
            data/rapport-generation.md
            data/rapport-generation.json
            data/combinaisons-absentes-par-depart.csv
          retention-days: 90

      - name: Préparer GitHub Pages
        if: ${{ (startsWith(steps.resolve_mode.outputs.mode, 'generate') || steps.resolve_mode.outputs.mode == 'pilot' || startsWith(steps.resolve_mode.outputs.mode, 'full') || steps.resolve_mode.outputs.mode == 'site') }}
        uses: actions/configure-pages@v5

      - name: Envoyer le site
        if: ${{ (startsWith(steps.resolve_mode.outputs.mode, 'generate') || steps.resolve_mode.outputs.mode == 'pilot' || startsWith(steps.resolve_mode.outputs.mode, 'full') || steps.resolve_mode.outputs.mode == 'site') }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: ${{ (startsWith(needs.build.outputs.mode, 'generate') || needs.build.outputs.mode == 'pilot' || startsWith(needs.build.outputs.mode, 'full') || needs.build.outputs.mode == 'site') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
