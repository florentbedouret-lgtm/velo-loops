name: Tests

# Tests des règles de calcul (tests/), à chaque envoi qui touche les scripts ou les tests. Workflow séparé : il ne passe
# pas dans la file d'attente des calculs (« build-loops ») et ne publie rien.
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'config/**', '.github/workflows/tests.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5 (version figée, audit 08/10/2026)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6 (version figée, audit 08/10/2026)
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -q -r scripts/requirements.txt pytest   # mêmes versions que le calcul (numpy vient avec shapely)
      - name: Tests
        run: python -m pytest -q tests
