<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oyan</title>
  <meta name="theme-color" content="#F6F4F0">
  <link rel="icon" href="brand/svg/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="brand/png/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="brand/png/apple-touch-icon.png">
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <link href="brand/oyan-tokens.css" rel="stylesheet">
  <link href="fonts/oyan-fonts.css" rel="stylesheet">
  <style>
    /* couleurs : uniquement les variables de brand/oyan-tokens.css ; l'argile est réservée au tracé, au bouton GPX et
       au nom de la boucle choisie (maquette « Oyan App Refonte », étape 5) */
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { font-family: var(--font-sans); background: var(--color-bg); color: var(--color-text); }
    a { color: var(--color-text); }
    b, strong { font-weight: var(--fw-medium); } /* charte : pas de typographie grasse */
    .label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    input, select { font: inherit; font-size: 16px; padding: 8px; color: var(--color-text); background: var(--color-surface);
                    border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
    .btn { font: inherit; font-size: 16px; padding: 8px 12px; border-radius: var(--radius-sm); cursor: pointer;
           background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-text); }
    .btn-accent { background: var(--color-accent); color: var(--color-on-accent); border-color: var(--color-accent); }
    .warn { font-weight: 500; }
    .warn::before { content: '⚠️ '; }

    /* ---------- carte plein écran ; les crédits de la carte restent visibles au-dessus du panneau (--sheet-h) */
    #map { position: fixed; inset: 0; }
    .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { bottom: var(--sheet-h, 0px); transition: bottom .25s ease; }

    /* ---------- réglages : carte flottante en haut, repliée en une barre « Gràcia · Modéré · 2 h 00 » */
    #top { position: fixed; z-index: 3; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px;
           max-width: 520px; margin: 0 auto; background: var(--color-surface); border-radius: 26px;
           box-shadow: 0 6px 24px rgba(36, 34, 31, .12); }
    #top.open { border-radius: var(--radius-sheet); }
    html[data-sheet=high] #top { display: none; }        /* panneau ouvert : la carte ne garde qu'un bandeau (maquette 5d) */
    #pill { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 8px 0 14px; cursor: pointer; }
    #pill .sum { flex: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #pill .sum i { font-style: normal; color: var(--color-text-2); }
    #pill .word { display: none; font-size: 21px; letter-spacing: -.01em; margin: -2px 0 0 -8px; flex: 1; }
    #top.open #pill .sum { display: none; }
    #top.open #pill .word { display: block; }
    .round { width: 36px; height: 36px; border-radius: 18px; border: 0; padding: 0; background: var(--color-bg);
             display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
    #top.open #pill .round svg { transform: rotate(180deg); }
    #settings { display: none; padding: 0 16px 16px; max-height: calc(100dvh - 128px - 90px); overflow-y: auto; }
    #top.open #settings { display: block; }
    #search { display: flex; gap: 6px; }
    #addr { flex: 1; min-width: 0; }
    #results button { display: block; width: 100%; text-align: left; font: inherit; font-size: 15px; padding: 8px; margin-top: 4px;
                      color: var(--color-text); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); }
    #geoattr { display: block; color: var(--color-text-2); padding: 4px 0 0; }
    #controls { display: flex; gap: 8px; padding: 8px 0; }
    #controls select { flex: 1; min-width: 0; }
    #durlabel { color: var(--color-text-2); }
    #totalApproach { padding: 0 0 6px; font-size: 14px; color: var(--color-text-2); }
    #where { padding: 0 0 6px; line-height: 1.4; }
    #where .btn { font-size: 15px; padding: 6px 10px; margin: 4px 6px 0 0; }
    #adv select, #adv input { width: 100%; box-sizing: border-box; margin-top: 6px; }

    /* ---------- panneau coulissant : peek (réglages ouverts), low (replié), mid (mi-hauteur), high (ouvert) */
    #sheet { position: fixed; z-index: 4; left: 0; right: 0; bottom: 0; height: 250px; max-width: 640px; margin: 0 auto;
             background: var(--color-surface); border-radius: 24px 24px 0 0; box-shadow: 0 -6px 24px rgba(36, 34, 31, .10);
             display: flex; flex-direction: column; transition: height .25s ease; }
    #sheet[hidden] { display: none; }
    #grip { flex: none; padding: 10px 20px 12px; touch-action: none; cursor: grab; }
    #sheet[data-state=high] #grip { border-bottom: 1px solid var(--color-border); }
    .handle { width: 36px; height: 4px; border-radius: 2px; background: var(--color-border); margin: 0 auto 12px; }
    .head-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }
    .opt-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-accent); }
    .alts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .alt { font: inherit; font-size: 13px; height: 28px; padding: 0 10px; border: 1px solid var(--color-border); border-radius: 14px;
            background: var(--color-surface); color: var(--color-text); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .alt::before { content: ''; width: 14px; border-top: 2px dashed var(--color-text-2); }
    .sum-line { font-size: 22px; font-weight: var(--fw-light); margin-top: 10px; }
    #sheet[data-state=high] .sum-line { font-size: 16px; font-weight: var(--fw-regular); margin-top: 8px; }
    .figs { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 12px; align-items: end; margin-top: 14px; }
    .figs .k { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-2); }
    .figs .big { font-size: 40px; font-weight: var(--fw-light); line-height: 1; }
    .figs .big span { font-size: 18px; }
    .figs .v { font-size: 24px; font-weight: var(--fw-light); line-height: 1.2; }
    #sheet[data-state=peek] .figs, #sheet[data-state=high] .figs { display: none; }
    #sheet[data-state=low] .sum-line, #sheet[data-state=mid] .sum-line { display: none; }
    #sheetBody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 20px 16px; line-height: 1.5; }
    #sheet[data-state=peek] #sheetBody, #sheet[data-state=peek] #sheetFoot { display: none; }
    #sheetFoot { flex: none; padding: 12px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--color-border); }
    .gpx { width: 100%; height: 52px; border-radius: 14px; font-size: 17px; }
    #sheetBody small, #sheetBody .sub { color: var(--color-text-2); }
    /* barre de terrain (charte §13.2 : couleurs terrain réservées à cette barre) */
    .terrain { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 10px 0 4px; }
    .terrain span { display: block; height: 100%; }
    .terrain-legend { color: var(--color-text-2); margin-bottom: 6px; }
    .terrain-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin: 0 4px 0 0; }
    .pitch { margin: 8px 0; padding-left: 18px; }
    .facts, .climbs { font-size: 14px; }
    .climbs { margin: 6px 0; padding-left: 18px; }
    .badge { display: inline-block; font-size: 13px; background: var(--color-border); color: var(--color-text); padding: 2px 6px; border-radius: 6px; }
    .city { font-size: 14px; margin: 6px 0; }
    .city .btn { font-size: 14px; padding: 4px 8px; }
    .other-dur { font-size: 15px; padding: 6px 10px; margin: 6px 6px 0 0; }
    #legal { padding: 12px 0 0; font-size: 12px; color: var(--color-text-2); }
    #legal a { color: var(--color-text-2); }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="top" class="open">
    <div id="pill" role="button" tabindex="0" aria-expanded="true" aria-controls="settings">
      <svg width="26" height="26" viewBox="0 0 48 48" aria-hidden="true"><path d="M37.86 18.26 A15 15 0 1 1 29.74 10.14" fill="none" stroke="#24221F" stroke-width="5.5" stroke-linecap="round"/><circle cx="29.74" cy="10.14" r="4.5" fill="#A8522F"/></svg>
      <span class="word" aria-label="Oyan">yan</span>
      <span class="sum" id="pillSum"></span>
      <button type="button" class="round" aria-label="Afficher ou masquer les réglages" tabindex="-1">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="#24221F" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="settings">
      <div id="search">
        <input id="addr" type="search" placeholder="Adresse de départ (rue, ville…)" enterkeyhint="search" autocomplete="off">
        <button id="go" class="btn" type="button">Chercher</button>
        <button id="me" class="btn" type="button" title="Utiliser ma position" aria-label="Utiliser ma position">📍</button>
      </div>
      <div id="results"></div>
      <div id="controls">
        <select id="level"></select>
        <select id="duration" aria-label="Durée de la boucle"></select>
      </div>
      <div id="durlabel" class="label">Durée de la boucle</div>
      <div id="totalApproach"></div>
      <div id="where">Tape une adresse, touche la carte ou utilise ta position.</div>
      <details id="adv"><summary>Choisir un départ dans la liste</summary>
        <input id="startFilter" type="search" placeholder="Filtrer : ville, quartier, gare…" aria-label="Filtrer les départs" autocomplete="off">
        <select id="start" aria-label="Départ"></select></details>
    </div>
  </div>
  <div id="sheet" hidden data-state="low">
    <div id="grip">
      <div class="handle"></div>
      <div id="sheetHead"></div>
    </div>
    <div id="sheetBody"></div>
    <div id="sheetFoot">
      <button type="button" class="btn btn-accent gpx" onclick="downloadGpx(startData.start, shown[current], indexData.levels[shown[current].level].label)">Télécharger le GPX</button>
    </div>
  </div>
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="gpx.js"></script>
  <script src="profile.js"></script>
  <script src="feedback.js"></script>
  <script>
    const LABELS = {
      equilibre: 'Équilibrée',
      moins_de_relief: 'Moins de relief',
      plus_de_relief: 'Plus de relief',
      variante: 'Variante'
    };
    const EMPTY = { type: 'FeatureCollection', features: [] };
    // couleurs de la carte, reprises de brand/oyan-tokens.css (MapLibre ne lit pas les variables CSS)
    const ROUTE = { color: '#A8522F', width: 4.5, casing: '#FFFFFF', casingWidth: 8.5,
                    other: '#625D55', otherWidth: 3, start: '#A8522F', user: '#24221F' };

    const startSel = document.getElementById('start');
    const levelSel = document.getElementById('level');
    const durSel = document.getElementById('duration');
    const sheet = document.getElementById('sheet');
    const sheetHead = document.getElementById('sheetHead');
    const sheetBody = document.getElementById('sheetBody');
    const sheetFoot = document.getElementById('sheetFoot');
    const topCard = document.getElementById('top');

    // ---------- panneau coulissant (maquette « Oyan App Refonte », étape 5) : quatre hauteurs
    // peek = réglages ouverts (nom et chiffres seulement) ; low = replié (chiffres + GPX) ; mid = mi-hauteur ; high = ouvert
    function sheetHeights() {
      const H = window.innerHeight;
      return { peek: 128, low: Math.min(250, Math.round(H * 0.45)), mid: Math.min(560, Math.round(H * 0.68)), high: H - 120 };
    }
    function setSheetHeight(h) {
      sheet.style.height = h + 'px';
      document.documentElement.style.setProperty('--sheet-h', (sheet.hidden ? 0 : h) + 'px');
    }
    function setSheet(state) {
      sheet.dataset.state = state;
      document.documentElement.dataset.sheet = state;
      setSheetHeight(sheetHeights()[state]);
      if (state !== 'peek' && topCard.classList.contains('open')) setSettings(false);
      if (state === 'low' || state === 'mid') sheetBody.scrollTop = 0;
    }
    function setSettings(open) {
      topCard.classList.toggle('open', open);
      document.getElementById('pill').setAttribute('aria-expanded', String(open));
      if (open && !sheet.hidden && sheet.dataset.state !== 'peek') setSheet('peek');
      else if (!open && sheet.dataset.state === 'peek') setSheet('low');
    }
    function showSheet() {
      sheet.hidden = false;
      setSheet(topCard.classList.contains('open') ? 'peek' : sheet.dataset.state === 'peek' ? 'low' : sheet.dataset.state);
    }
    // glisser la poignée (ou l'en-tête) : le panneau suit le doigt puis se cale sur la hauteur la plus proche ;
    // un simple toucher fait monter d'un cran (replié -> mi-hauteur -> ouvert -> replié)
    (function bindSheetDrag() {
      const grip = document.getElementById('grip');
      let drag = null, justDragged = false;
      grip.addEventListener('pointerdown', e => {
        if (e.target.closest('button')) return;                // les pastilles restent de simples boutons
        drag = { y: e.clientY, h: sheet.getBoundingClientRect().height, moved: false, t: Date.now() };
        grip.setPointerCapture(e.pointerId);                   // le doigt peut sortir de l'en-tête sans perdre le panneau
      });
      grip.addEventListener('pointermove', e => {
        if (!drag) return;
        const dy = drag.y - e.clientY;
        if (!drag.moved && Math.abs(dy) < 6) return;
        if (!drag.moved) { drag.moved = true; sheet.style.transition = 'none'; }
        const hs = sheetHeights();
        setSheetHeight(Math.max(hs.peek, Math.min(hs.high, drag.h + dy)));
      });
      const end = e => {
        if (!drag) return;
        const d = drag; drag = null;
        sheet.style.transition = '';
        if (!d.moved) return;
        justDragged = true; setTimeout(() => { justDragged = false; }, 0);
        const hs = sheetHeights(), h = sheet.getBoundingClientRect().height;
        const v = (d.y - e.clientY) / Math.max(1, Date.now() - d.t);          // px/ms, positif vers le haut
        const order = ['low', 'mid', 'high'];
        let best = order.reduce((a, b) => Math.abs(hs[b] - h) < Math.abs(hs[a] - h) ? b : a);
        if (Math.abs(v) > 0.5) {                                                 // geste rapide : cran suivant dans ce sens
          best = v > 0 ? (order.find(k => hs[k] > h + 1) || 'high')
                       : ([...order].reverse().find(k => hs[k] < h - 1) || 'low');
        }
        setSheet(best);
        fitRoute();
      };
      grip.addEventListener('pointerup', end);
      grip.addEventListener('pointercancel', end);
      grip.addEventListener('click', e => {
        if (justDragged || e.target.closest('button')) return;
        const next = { peek: 'low', low: 'mid', mid: 'high', high: 'low' }[sheet.dataset.state];
        setSheet(next);
        fitRoute();
      });
      window.addEventListener('resize', () => { if (!sheet.hidden) setSheetHeight(sheetHeights()[sheet.dataset.state]); });
    })();

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [2.19, 41.42],
      zoom: 10
    });

    let startData = null;
    let shown = [];
    let current = 0;
    let marker = null;
    let indexData = null;

    const km = n => n.toFixed(1).replace('.', ',');
    function hm(min) {
      const t = Math.round(min);
      return Math.floor(t / 60) + ' h ' + String(t % 60).padStart(2, '0');
    }
    // neutralise le HTML dans un texte (bonne habitude)
    const esc = s => String(s).replace(/[&<>"]/g,
      c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    // ---------- nom d'un départ : « Commune · lieu » (commune OSM, champ municipality du pipeline, O-10.2) ;
    // sans commune (données plus anciennes) : « Ville la plus proche · lieu » pour les départs intermédiaires
    function startLabel(s) {
      const m = s.municipality;
      if (m && s.kind === 'station') {                 // « Gare Calella » -> « Calella · Gare », « Gare Granollers Centre » -> « Granollers · Gare Centre »
        let rest = s.name.replace(/^Gare\s+/, '');
        if (fold(rest).startsWith(fold(m))) rest = rest.slice(m.length).replace(/^[\s\-–|]+/, '');
        return m + ' · Gare' + (rest ? ' ' + rest : '');
      }
      if (m) return s.name === m || fold(s.name).includes(fold(m)) ? s.name : m + ' · ' + s.name;
      const near = /^Près de (.+)$/.exec(s.display_name || '');
      return near ? near[1] + ' · ' + s.name : (s.display_name || s.name);
    }
    const byName = new Intl.Collator('ca', { sensitivity: 'base', numeric: true }).compare;

    // ---------- gare : mention affichée à côté du nom du départ
    const stationNote = kind => kind === 'station'
      ? ' <span class="badge">🚆 Gare : vérifie les conditions du transporteur.</span>' : '';

    // ---------- pente : catégories qualitatives (jamais de pourcentage affiché)
    function slopeCategory(pct) {
      if (pct < 2.5) return 'Peu de côtes';
      if (pct < 4) return 'Quelques côtes';
      if (pct < 6) return 'Vallonné';
      return 'Très vallonné';
    }

    // ---------- modèle d'approche (repli si le fichier est absent ou d'une version majeure inconnue)
    const MODEL_MAJOR = 2;
    let model = { zones: {
      dense: { detour_ratio_median: 1.56, detour_ratio_p90: 2.55, speed_kmh_110W_median: 16.45 },
      peri:  { detour_ratio_median: 1.58, detour_ratio_p90: 2.52, speed_kmh_110W_median: 19.57 },
      rural: { detour_ratio_median: 1.69, detour_ratio_p90: 3.69, speed_kmh_110W_median: 18.07 } } };
    let modelOk = true; // false si la version majeure du modèle est inconnue : aucun temps chiffré
    const DMAX_KM = { dense: 1.75, peri: 2.5, rural: 2.5 }; // seuil « à portée », par zone (brief UX)

    // ---------- géographie
    const rad = d => d * Math.PI / 180;
    function crowKm(lon1, lat1, lon2, lat2) {
      const a = Math.sin(rad(lat2 - lat1) / 2) ** 2 +
        Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(rad(lon2 - lon1) / 2) ** 2;
      return 2 * 6371 * Math.asin(Math.sqrt(a));
    }
    function nearestStart(lon, lat) {
      let best = null;
      for (const s of indexData.starts) {
        const d = crowKm(lon, lat, s.lon, s.lat);
        if (!best || d < best.km) best = { s, km: d };
      }
      return best;
    }
    // emprise des départs générés (champ coverage_bbox de l'index, sinon calculée ici) : sert uniquement à cadrer la carte
    // et à limiter la recherche Photon, jamais à décider si une adresse est couverte
    function coverageBox(padDeg) {
      let b = indexData.coverage_bbox;
      if (!b) {
        const xs = indexData.starts.map(s => s.lon), ys = indexData.starts.map(s => s.lat);
        b = [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
      }
      return [b[0] - padDeg, b[1] - padDeg, b[2] + padDeg, b[3] + padDeg];
    }

    // ---------- recherche d'adresse : Photon (Komoot), service public à usage raisonnable
    // Règles respectées : une requête au plus par seconde, déclenchée par le bouton ou la touche Entrée (pas d'autocomplétion),
    // 3 caractères au moins, résultats gardés en mémoire, attribution OpenStreetMap affichée, délai maximum de 8 s.
    const GEO = { url: 'https://photon.komoot.io/api/', last: 0, cache: new Map() };
    const photonLabel = p => [p.name, [p.street, p.housenumber].filter(Boolean).join(' '), p.postcode, p.city]
      .filter((v, i, a) => v && a.indexOf(v) === i).join(', ');
    async function geocode(q) {
      const key = q.trim().toLowerCase();
      if (GEO.cache.has(key)) return GEO.cache.get(key);
      const wait = 1100 - (Date.now() - GEO.last);
      if (wait > 0) await new Promise(r => setTimeout(r, wait));
      GEO.last = Date.now();
      const bbox = coverageBox(0.3).map(v => v.toFixed(4)).join(',');
      const res = await fetch(GEO.url + '?q=' + encodeURIComponent(q) + '&limit=5&lang=fr&bbox=' + bbox,
        { signal: AbortSignal.timeout(8000) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const items = (data.features || []).map(f => ({
        lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], label: photonLabel(f.properties || {})
      }));
      GEO.cache.set(key, items);
      return items;
    }

    const addr = document.getElementById('addr');
    const resultsEl = document.getElementById('results');
    const whereEl = document.getElementById('where');
    let userMarker = null;

    async function searchAddress() {
      const q = addr.value.trim();
      if (q.length < 3) { resultsEl.textContent = 'Tape au moins 3 caractères.'; return; }
      resultsEl.textContent = 'Recherche…';
      try {
        const items = await geocode(q);
        if (!items.length) { resultsEl.textContent = 'Aucune adresse trouvée dans la zone couverte.'; return; }
        resultsEl.innerHTML = items.map((it, i) =>
          '<button type="button" data-i="' + i + '">' + esc(it.label) + '</button>').join('') +
          '<small id="geoattr">Adresses : Photon (Komoot) · © contributeurs OpenStreetMap</small>';
        resultsEl.onclick = e => {
          const b = e.target.closest('button');
          if (!b) return;
          const it = items[Number(b.dataset.i)];
          resultsEl.textContent = '';
          addr.value = it.label;
          setPosition(it.lon, it.lat);
        };
      } catch (err) {
        resultsEl.textContent = 'Recherche d\'adresse indisponible pour l\'instant. Touche la carte ou utilise ta position.';
      }
    }

    // ---------- position de l'utilisateur -> départ le plus proche -> temps d'approche
    let approachMin = null; // temps d'approche connu pour le départ actuellement choisi (null si choisi dans la liste)
    function setPosition(lon, lat) {
      if (userMarker) userMarker.remove();
      userMarker = new maplibregl.Marker({ color: ROUTE.user }).setLngLat([lon, lat]).addTo(map);
      const { s, km } = nearestStart(lon, lat);
      const name = esc(startLabel(s)) + stationNote(s.kind);
      pendingStart = s.id;

      if (!modelOk) {
        approachMin = null;
        whereEl.innerHTML = 'Départ : <b>' + name + '</b><br>Temps d\'approche indisponible pour le moment.';
        chooseStart(s.id);
        return;
      }

      const zoneKey = s.zone && model.zones[s.zone] ? s.zone : 'peri';
      const z = model.zones[zoneKey];
      const speed = z.speed_kmh_110W_median;
      const med = Math.round(km * z.detour_ratio_median / speed * 60);
      const hi = Math.round(km * z.detour_ratio_p90 / speed * 60);
      const portee = Math.round(DMAX_KM[zoneKey] * z.detour_ratio_median / speed * 60);
      const range = zoneKey === 'rural' && hi > med + 3 ? ', jusqu\'à ≈ ' + hi + ' min' : '';
      const nav = 'https://www.openstreetmap.org/directions?engine=fossgis_osrm_bike&route=' +
        lat.toFixed(5) + '%2C' + lon.toFixed(5) + '%3B' + s.lat.toFixed(5) + '%2C' + s.lon.toFixed(5);
      approachMin = med;

      if (med > 30) {
        whereEl.innerHTML = '<span class="warn">Trop loin : le départ le plus proche est à ≈ ' + med + ' min à vélo' + range +
          '.</span><br>Départ : <b>' + name + '</b><br><button type="button" class="btn" id="see">Voir quand même</button>' +
          ' <a href="' + nav + '" target="_blank" rel="noopener">Itinéraire</a>';
        document.getElementById('see').onclick = () => chooseStart(s.id);
        map.fitBounds(new maplibregl.LngLatBounds([lon, lat], [s.lon, s.lat]), { padding: 60, duration: 500 });
        return;
      }
      whereEl.innerHTML = 'Départ : <b>' + name + '</b><br>' +
        (med > portee ? '<span class="warn">Un peu loin : </span>' : '') + '≈ ' + med + ' min à vélo pour le rejoindre' + range +
        (med > portee ? ' · <a href="' + nav + '" target="_blank" rel="noopener">Itinéraire</a>' : '');
      chooseStart(s.id);
    }
    let pendingStart = null;
    function chooseStart(id) {
      if (![...startSel.options].some(o => o.value === id)) { startFilter.value = ''; fillStarts(); } // départ masqué par le filtre
      startSel.value = id; loadStart();
    }

    // ---------- liste des départs, filtrée par le texte tapé (sans tenir compte des accents ni des majuscules)
    const startFilter = document.getElementById('startFilter');
    const fold = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    let startItems = []; // [libellé, id, texte de recherche, clé de tri], triés par commune puis par libellé
    function fillStarts() {
      const words = fold(startFilter.value).split(/\s+/).filter(Boolean);
      const keep = startItems.filter(it => words.every(w => it[2].includes(w)));
      const current = startSel.value;
      startSel.textContent = '';
      startSel.add(new Option(keep.length ? keep.length + ' départ' + (keep.length > 1 ? 's' : '') + ' : choisir…'
        : 'Aucun départ ne correspond', ''));
      keep.forEach(([label, id]) => startSel.add(new Option(label, id)));
      startSel.value = keep.some(it => it[1] === current) ? current : '';
    }

    async function init() {
      const [index] = await Promise.all([
        fetch('web/data/index.json').then(r => r.json()),
        new Promise(ok => map.once('load', ok))
      ]);
      indexData = index;
      try {
        const m = await fetch('web/approach_model.json');
        if (m.ok) {
          const data = await m.json();
          const major = Number(String(data.version || '').split('.')[0]);
          if (major === MODEL_MAJOR) model = data;
          else modelOk = false; // version majeure inconnue : on ignore ce fichier, aucun temps chiffré
        }
      } catch (e) { /* réseau indisponible : on garde le repli */ }
      startItems = index.starts.map(s => {
        const label = startLabel(s);
        return [label, s.id, fold((s.municipality || '') + ' ' + label), s.municipality || label];
      }).sort((a, b) => byName(a[3], b[3]) || byName(a[0], b[0]));
      fillStarts();
      startFilter.oninput = fillStarts;
      Object.entries(index.levels).forEach(([k, v]) => levelSel.add(new Option(v.label, k)));
      levelSel.value = 'modere';
      index.durations_h.forEach(h => durSel.add(new Option(hm(h * 60), h)));
      durSel.value = '2';
      durSel.onchange = showLevel;
      updatePill();

      // tracé Oyan : boucle choisie en argile avec liseré blanc, les autres en galet ; le tout sous les noms de lieux
      map.addSource('routes', { type: 'geojson', data: EMPTY });
      const labels = map.getStyle().layers.find(l => l.type === 'symbol');
      const beforeId = labels ? labels.id : undefined;
      const lineLayout = { 'line-cap': 'round', 'line-join': 'round' };
      const isSel = ['get', 'selected'];
      map.addLayer({ id: 'routes-other', type: 'line', source: 'routes', filter: ['!', isSel], layout: lineLayout,
        paint: { 'line-color': ROUTE.other, 'line-width': ROUTE.otherWidth, 'line-opacity': 0.7 } }, beforeId);
      map.addLayer({ id: 'routes-casing', type: 'line', source: 'routes', filter: isSel, layout: lineLayout,
        paint: { 'line-color': ROUTE.casing, 'line-width': ROUTE.casingWidth } }, beforeId);
      map.addLayer({ id: 'routes', type: 'line', source: 'routes', filter: isSel, layout: lineLayout,
        paint: { 'line-color': ROUTE.color, 'line-width': ROUTE.width } }, beforeId);
      // point de la carte qui suit le doigt sur le profil altimétrique
      map.addSource('cursor', { type: 'geojson', data: EMPTY });
      map.addLayer({ id: 'cursor', type: 'circle', source: 'cursor',
        paint: { 'circle-radius': 6, 'circle-color': ROUTE.user, 'circle-stroke-color': ROUTE.casing, 'circle-stroke-width': 2.5 } });

      document.getElementById('pill').onclick = () => setSettings(!topCard.classList.contains('open'));
      document.getElementById('pill').onkeydown = e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSettings(!topCard.classList.contains('open')); }
      };
      startSel.onchange = () => {
        if (!startSel.value) return; // ligne « N départs : choisir… »
        const entry = indexData.starts.find(x => x.id === startSel.value);
        whereEl.innerHTML = 'Départ choisi dans la liste.' + stationNote(entry && entry.kind);
        approachMin = null; loadStart();
      };
      levelSel.onchange = showLevel;
      sheetHead.onclick = e => {                          // pastille d'une autre boucle : elle devient la boucle affichée
        const b = e.target.closest('.alt');
        if (b) select(Number(b.dataset.i));
      };
      document.getElementById('go').onclick = searchAddress;
      addr.onkeydown = e => { if (e.key === 'Enter') searchAddress(); };
      document.getElementById('me').onclick = () => {
        if (!navigator.geolocation) { whereEl.textContent = 'La localisation n\'est pas disponible sur cet appareil.'; return; }
        whereEl.textContent = 'Localisation…';
        navigator.geolocation.getCurrentPosition(
          p => { addr.value = ''; setPosition(p.coords.longitude, p.coords.latitude); },
          () => { whereEl.textContent = 'Localisation refusée. Tape une adresse ou touche la carte.'; },
          { enableHighAccuracy: true, timeout: 15000 });
      };
      map.on('click', e => { addr.value = ''; setPosition(e.lngLat.lng, e.lngLat.lat); });
      const b = coverageBox(0.02);
      map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: 10, duration: 0 });
    }

    // barre repliée des réglages : « Gràcia · Modéré · 2 h 00 »
    function updatePill() {
      const s = startData && indexData.starts.find(x => x.id === startData.start.id);
      const name = s ? (s.kind === 'station' ? startLabel(s) : s.name) : 'Choisir un départ';
      const lvl = levelSel.options[levelSel.selectedIndex];
      document.getElementById('pillSum').innerHTML = esc(name) + ' <i>·</i> ' + esc(lvl ? lvl.text : '') +
        ' <i>·</i> ' + hm(Number(durSel.value) * 60);
    }

    async function loadStart() {
      sheetHead.textContent = '';
      sheetBody.textContent = 'Chargement…';
      showSheet();
      const res = await fetch('web/data/starts/' + startSel.value + '.json');
      if (!res.ok) { sheetBody.textContent = 'Erreur de chargement (' + res.status + ')'; return; }
      startData = await res.json();
      if (marker) marker.remove();
      marker = new maplibregl.Marker({ color: ROUTE.start })
        .setLngLat([startData.start.lon, startData.start.lat]).addTo(map);
      setSettings(false);                                   // départ trouvé : on replie les réglages et on montre la boucle
      showLevel();
    }

    function showLevel() {
      updatePill();
      if (!startData) return;
      shown = startData.options.filter(o => o.level === levelSel.value &&
        (o.duration_target_min == null ||
         Math.round(o.duration_target_min) === Math.round(Number(durSel.value) * 60)));
      if (!shown.length) {
        const avail = [...new Set(startData.options.filter(o => o.level === levelSel.value)
          .map(o => Math.round(o.duration_target_min)))].sort((a, b) => a - b);
        sheetHead.innerHTML = '<div class="head-row"><span class="opt-label">Aucune boucle</span></div>';
        sheetFoot.hidden = true;
        sheetBody.innerHTML = 'Pas de boucle de ' + hm(Number(durSel.value) * 60) + ' en « ' +
          esc(levelSel.options[levelSel.selectedIndex].text) + ' » depuis ce départ.' +
          (avail.length ? '<br>Autre durée possible : ' + avail.map(m =>
            '<button type="button" class="btn other-dur" data-min="' + m + '">' +
            hm(m) + '</button>').join('') : '<br>Essaie un autre niveau.');
        sheetBody.querySelectorAll('button[data-min]').forEach(b => {
          b.onclick = () => { durSel.value = String(Number(b.dataset.min) / 60); showLevel(); };
        });
        map.getSource('routes').setData(EMPTY);
        map.getSource('cursor').setData(EMPTY);
        return;
      }
      const i = shown.findIndex(o => o.label === 'equilibre');
      select(i >= 0 ? i : 0);
    }

    // ---------- O-14 : départ voisin qui sort plus vite de la ville (même durée, même niveau), quand la boucle reste en
    // ville ou n'en sort qu'après 5 km. Critère : km de sortie de la zone dense (bloc compare de index.json), pas le % de
    // bâti, pour rester cohérent avec « Sort de la ville après X km » affiché sur la fiche.
    const NEIGHBOUR_MAX_MIN = 25;      // approche maximale d'un départ à l'autre (l'app juge « trop loin » au-delà de 30)
    const NEIGHBOUR_GAIN_KM = 3;       // la boucle voisine doit sortir de la ville au moins 3 km plus tôt
    const CLIMB_M_PER_H = 400;         // montée à allure d'approche (~110 W, 85 kg) : environ 400 m de dénivelé par heure
    function approachBetween(a, b) {   // même modèle que depuis une adresse (setPosition), plus la montée entre les deux départs
      if (a.alt_m == null || b.alt_m == null) return Infinity;   // altitude inconnue : pas de temps honnête, pas de suggestion
      const z = model.zones[b.zone] || model.zones.peri;
      const flat = crowKm(a.lon, a.lat, b.lon, b.lat) * z.detour_ratio_median / z.speed_kmh_110W_median * 60;
      return Math.max(flat, Math.max(0, b.alt_m - a.alt_m) / CLIMB_M_PER_H * 60);
    }
    function natureNeighbour(o) {
      if (!modelOk || o.duration_target_min == null) return '';
      const cur = indexData.starts.find(s => s.id === startSel.value);
      if (!cur) return '';
      const stays = o.exit_dense_km == null || o.exit_dense_km >= o.distance_km - 0.05;
      if (!stays && o.exit_dense_km <= 5) return '';
      const curExit = stays ? Infinity : o.exit_dense_km;
      const dur = String(Math.round(o.duration_target_min) / 60);   // clés du bloc compare : "0.75", "1", "1.5"…
      let best = null;
      for (const s of indexData.starts) {
        const c = s.compare && s.compare[dur] && s.compare[dur][o.level];
        if (s.id === cur.id || !c || c.exit_dense_km == null || c.exit_dense_km > curExit - NEIGHBOUR_GAIN_KM) continue;
        const min = approachBetween(cur, s);
        if (min > NEIGHBOUR_MAX_MIN) continue;
        if (!best || c.exit_dense_km < best.exit || (c.exit_dense_km === best.exit && min < best.min)) {
          best = { s, min: Math.round(min), exit: c.exit_dense_km };
        }
      }
      if (!best) return '';
      return '<br>Plus vite dans la nature : depuis <b>' + esc(startLabel(best.s)) + '</b>, à ≈ ' + best.min +
        ' min à vélo, la boucle de ' + hm(o.duration_target_min) + (best.exit === 0 ? ' part directement hors de la ville.'
        : ' sort de la ville après ' + km(best.exit) + ' km.') +
        ' <button type="button" class="btn" onclick="goNeighbour(\'' + best.s.id + '\', ' + best.min + ')">Voir ce départ</button>';
    }
    function goNeighbour(id, min) {
      const s = indexData.starts.find(x => x.id === id);
      whereEl.innerHTML = 'Départ voisin : <b>' + esc(startLabel(s)) + '</b>' + stationNote(s.kind) +
        '<br>≈ ' + min + ' min à vélo depuis le départ précédent';
      approachMin = null;                               // la position de l'utilisateur n'est pas connue ici : pas de total chiffré
      chooseStart(id);
    }

    // change pour la durée disponible suivante, sans changer le niveau (bouton "Essayer plus long")
    function nextDuration() {
      const durs = indexData.durations_h.map(Number).sort((a, b) => a - b);
      const next = durs.find(d => d > Number(durSel.value));
      if (next != null) { durSel.value = String(next); showLevel(); }
    }

    // ---------- O-9.5 : pitch au ton Oyan (brand.md §8), construit ici à partir des mêmes mesures que le pitch du
    // pipeline (o.pitch, gardé dans les données) : 3 phrases au plus, tout le reste dans « Tous les chiffres ».
    const pc = f => Math.round(f * 100) + ' %';
    const km1 = n => (Math.round(n * 10) / 10).toFixed(1).replace('.', ',');
    function reliefCategory(per100) {                       // mêmes seuils que relief_category() du pipeline
      return per100 < 500 ? 'plat' : per100 < 1000 ? 'peu vallonné' : per100 < 1600 ? 'vallonné' : 'très vallonné';
    }
    function pitchLines(o) {
      const out = [];
      const ex = o.exit_dense_km;
      if (ex === 0) out.push('Tu pars directement hors de la ville.');
      else if (ex == null || ex >= o.distance_km - 0.05) out.push('Tu restes en ville tout du long.');
      else out.push('Tu sors de la ville après ' + km1(ex) + ' km.');
      const sc = o.scenery;
      if (sc) {                                             // la nature la plus présente, si elle compte vraiment
        const nature = [['protected', 0.15, ' du parcours traverse un parc ou un espace protégé.'],
                        ['forest', 0.15, ' du parcours longe la forêt.'],
                        ['water', 0.05, ' du parcours au bord de l\'eau.']]
          .filter(([k, min]) => sc[k] >= min).sort((a, b) => sc[b[0]] - sc[a[0]]);
        if (nature.length) out.push(pc(sc[nature[0][0]]) + nature[0][2]);
      }
      const sh = o.shares;
      if (sh.main_roads > 0.10) out.push(pc(sh.main_roads) + ' sur des routes principales : reste vigilant.');
      else if (sh.dedicated_cycleway >= 0.20) out.push(pc(sh.dedicated_cycleway) + ' sur pistes cyclables.');
      else if (o.traffic_lights === 0) out.push('Aucun feu tricolore sur le parcours.');
      else if (o.terrain.climbs && o.terrain.climbs.length) {
        const c = o.terrain.climbs[0];
        out.push('Plus longue montée : ' + km1(c.length_km) + ' km (+' + Math.round(c.gain_m) + ' m).');
      }
      return out;
    }
    function allFacts(o) {                                  // tous les chiffres mesurés, sans pourcentage de pente (D17)
      const L = [];
      const per100 = o.ascend_m / Math.max(o.distance_km, 0.1) * 100;
      L.push(km1(o.distance_km) + ' km, D+ ' + Math.round(o.ascend_m) + ' m : profil ' + reliefCategory(per100) +
        ' (' + Math.round(per100) + ' m de D+ pour 100 km).');
      L.push(pc(o.shares.urban.city) + ' en ville (zone urbaine dense).');
      if (o.traffic_lights != null) {
        L.push(o.traffic_lights === 0 ? 'Aucun feu tricolore recensé dans OpenStreetMap.'
          : o.traffic_lights + ' feux tricolores recensés dans OpenStreetMap (' + km1(o.traffic_lights_per_km || 0) + ' par km).');
      }
      const tr = o.terrain;
      L.push(tr.n_climbs ? tr.n_climbs + ' montée' + (tr.n_climbs > 1 ? 's' : '') + ' de plus de 20 m' +
        (tr.avg_climb_grade_pct != null ? ' · ' + slopeCategory(tr.avg_climb_grade_pct) : '') + '.'
        : 'Aucune montée de plus de 20 m d\'un seul tenant.');
      const sc = o.scenery;
      if (sc) {
        if (sc.forest >= 0.05) L.push(pc(sc.forest) + ' dans ou en bordure de forêt.');
        if (sc.protected >= 0.05) L.push(pc(sc.protected) + ' dans un parc ou un espace protégé.');
        if (sc.water >= 0.05) L.push(pc(sc.water) + ' à moins de 100 m d\'un plan d\'eau, d\'une rivière ou de la mer.');
        if (sc.viewpoints >= 1) L.push(sc.viewpoints + ' point' + (sc.viewpoints > 1 ? 's' : '') + ' de vue à moins de 300 m.');
      }
      const sh = o.shares;
      L.push(pc(sh.dedicated_cycleway) + ' sur pistes cyclables ou voies vertes.');
      L.push(sh.main_roads < 0.01 ? 'Aucune route principale.' : pc(sh.main_roads) + ' sur des routes principales.');
      if (sh.unpaved > 0.05) L.push(pc(sh.unpaved) + ' sur revêtement non goudronné.');
      if (o.surface && o.surface.unknown >= 0.3) L.push('Revêtement non renseigné dans OpenStreetMap sur ' + pc(o.surface.unknown) + '.');
      if (o.overlap > 0.10) L.push(pc(o.overlap) + ' de tronçons empruntés deux fois.');
      if (o.u_turns) L.push(o.u_turns + ' demi-tour' + (o.u_turns > 1 ? 's' : '') + ' sur le parcours.');
      return L;
    }

    // ---------- O-9.4 : barre de terrain (répartition ville / eau / forêt / espaces ouverts calculée par le pipeline, 100 %) ;
    // « espaces ouverts » = ni bâti, ni eau, ni forêt (champs, garrigue, mais aussi parcs urbains comme le long du Besòs)
    // affichée seulement si la donnée existe (scenery.landcover, générateur v5 et suivants)
    const TERRAIN = [['city', 'ville', '--oyan-terrain-ville'], ['forest', 'forêt', '--oyan-terrain-foret'],
                     ['water', 'eau', '--oyan-terrain-eau'], ['countryside', 'espaces ouverts', '--oyan-terrain-campagne']];
    // interrupteur de la barre : « ville » mesurée par le bâti (5 bâtiments OSM à moins de ~75 m), données recalculées
    // le 26/09/2026 (mode landcover) ; la v1 (dans une zone bâtie) sortait une boucle 100 % urbaine à 5 % « ville »
    const LANDCOVER_OK = true;
    const cityShare = o => (LANDCOVER_OK && o.scenery && o.scenery.landcover) ? o.scenery.landcover.city : o.shares.urban.city;
    function terrainBar(o) {
      const lc = LANDCOVER_OK && o.scenery && o.scenery.landcover;
      if (!lc) return '';
      const parts = TERRAIN.filter(([k]) => lc[k] > 0);
      return '<div class="terrain" role="img" aria-label="Répartition du terrain : ' +
        parts.map(([k, lab]) => lab + ' ' + pc(lc[k])).join(', ') + '">' +
        parts.map(([k, , v]) => '<span style="width:' + (lc[k] * 100).toFixed(1) + '%;background:var(' + v + ')"></span>').join('') +
        '</div><div class="terrain-legend label">' +
        parts.map(([k, lab, v]) => '<i style="background:var(' + v + ')"></i>' + lab + ' ' + pc(lc[k])).join(' · ') + '</div>';
    }

    // détail affiché sous la carte sélectionnée
    function detailHtml(o) {
      const pitch = pitchLines(o).map(p => '<li>' + esc(p) + '</li>').join('');
      const facts = allFacts(o).map(p => '<li>' + esc(p) + '</li>').join('');
            const climbs = (o.terrain.climbs || []).map(c =>
        '<li>Montée au km ' + km(c.start_km) + ' : ' + km(c.length_km) + ' km, +' + Math.round(c.gain_m) + ' m</li>').join('');
            // ville : uniquement à partir de exit_dense_km, comparé à la distance réelle (pas de null en pratique)
      let cityLine = '';
      if (o.exit_dense_km === 0) {
        // rien à afficher
      } else if (o.exit_dense_km == null || o.exit_dense_km >= o.distance_km - 0.05) {
        const hasLonger = startData.options.some(x => x.level === o.level && x.duration_target_min > o.duration_target_min);
        cityLine = hasLonger ? 'Une sortie plus longue va plus loin. <button type="button" class="btn" onclick="nextDuration()">Essayer plus long</button>' : '';
      }
      cityLine = (cityLine + natureNeighbour(o)).replace(/^<br>/, '');

      // pente : catégorie qualitative + badge à seuil unique, jamais de chiffre
      const steepBadge = o.terrain.max_grade_pct != null && o.terrain.max_grade_pct >= 20;

      return `
        ${terrainBar(o)}
        <ul class="pitch">${pitch}</ul>
        ${steepBadge ? '<p><span class="badge">⚠️ Au moins une rampe très raide</span></p>' : ''}
        ${profileSvg(o)}
        ${cityLine ? '<p class="city">' + cityLine + '</p>' : ''}
        <details class="facts"><summary>Tous les chiffres</summary>
          <ul class="pitch">${facts}</ul>
          ${climbs ? '<ul class="climbs">' + climbs + '</ul>' : ''}
        </details>
        ${feedbackHtml(o)}
        <small>Durées estimées en mouvement, sans pauses. Dénivelé : estimation.</small>
        <div id="legal">Parcours indicatifs, à vérifier avant de partir · <a href="mentions.html" target="_blank" rel="noopener">Mentions légales &amp; confidentialité</a></div>`;
    }

    // en-tête du panneau : nom de la boucle, pastilles des autres boucles, chiffres (colonnes ou ligne selon la hauteur)
    function headHtml(o) {
      const alts = shown.map((x, k) => k === current ? '' :
        '<button type="button" class="alt" data-i="' + k + '">' + esc(LABELS[x.label] || x.label) + '</button>').join('');
      return `<div class="head-row"><span class="opt-label">${esc(LABELS[o.label] || o.label)}</span><span class="alts">${alts}</span></div>
        <div class="sum-line">${km(o.distance_km)} km · D+ ${Math.round(o.ascend_m)} m · ≈ ${hm(o.time_est_min)}</div>
        <div class="figs">
          <div><div class="k">DISTANCE</div><div class="big">${km(o.distance_km)}<span> km</span></div></div>
          <div><div class="k">D+</div><div class="v">${Math.round(o.ascend_m)} m</div></div>
          <div><div class="k">DURÉE</div><div class="v">≈ ${hm(o.time_est_min)}</div></div>
        </div>`;
    }

    function select(i) {
      current = i;
      const o = shown[current];
      const totalEl = document.getElementById('totalApproach');
      totalEl.textContent = approachMin != null
        ? '+ trajet jusqu\'au départ : ≈ ' + hm(o.time_est_min + approachMin) + ' au total, sans pauses'
        : '';
      sheetHead.innerHTML = headHtml(o);
      sheetFoot.hidden = false;
      sheetBody.innerHTML = (LANDCOVER_OK && o.scenery && o.scenery.landcover ? ''
        : '<div class="sub">En ville ' + Math.round(cityShare(o) * 100) + ' %</div>') + detailHtml(o);
      sheetBody.scrollTop = 0;
      map.getSource('cursor').setData(EMPTY);
      const pf = sheetBody.querySelector('svg.pf');
      if (pf) bindProfile(pf, pos => map.getSource('cursor').setData(pos
        ? { type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: pos } } : EMPTY));

      const features = shown
        .map((x, k) => ({
          type: 'Feature',
          properties: { selected: k === current },
          geometry: { type: 'LineString', coordinates: x.coords }
        }))
        .sort((a, b) => a.properties.selected - b.properties.selected);
      map.getSource('routes').setData({ type: 'FeatureCollection', features });
      fitRoute();
    }

    // cadre la boucle dans la partie de la carte laissée libre par les réglages (en haut) et le panneau (en bas)
    function fitRoute() {
      if (!shown.length || !shown[current]) return;
      const bounds = new maplibregl.LngLatBounds();
      shown[current].coords.forEach(c => bounds.extend([c[0], c[1]]));
      const hs = sheetHeights(), H = window.innerHeight;
      let top = topCard.getBoundingClientRect().bottom + 16;
      let bottom = (sheet.dataset.state === 'high' ? hs.low : hs[sheet.dataset.state]) + 16;
      if (top + bottom > H - 80) { const k = (H - 80) / (top + bottom); top *= k; bottom *= k; }  // écran trop petit
      map.fitBounds(bounds, { padding: { top, bottom, left: 30, right: 30 }, duration: 500 });
    }

    init();
  </script>
</body>
</html>
