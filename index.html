      }
      const ex = exitKm(o);
      if (ex === 0) out.push(['0 km', t('k_exit0')]);
      else if (ex == null) out.push(['', t('k_stay'), false, 'city']);
      else out.push([km1(ex) + ' km', t('k_exit'), false, 'exit']);
      const sc = o.scenery;
      if (sc) {                                             // la nature la plus présente, si elle compte vraiment
        const lc = LANDCOVER_OK && sc.landcover;
        const nature = [['protected', sc.protected, 0.15, t('k_protected')],
                        ['forest', lc ? lc.forest : sc.forest, 0.15, lc ? t('k_forest_lc') : t('k_forest')],
                        ['water', lc ? lc.water : sc.water, 0.05, t('k_water')]]
          .filter(([, v, min]) => v >= min).sort((a, b) => b[1] - a[1]);
        if (nature.length) out.push([pc(nature[0][1]), nature[0][3], false,
          nature[0][0] === 'protected' ? (sc.protected_seq ? 'park' : null) : (lc && sc.landcover_seq ? nature[0][0] : null)]);
      }
      const sh = o.shares, rs = !!o.road_seq;
      // chemins de terre (v9) : prévenir AVANT de partir, dès 500 m
      const dirt = dirtKm(o);
      if (dirt != null && (dirt >= 0.5 || o.unpaved_fallback)) out.push([km1(dirt) + ' km',
        t(o.unpaved_fallback ? 'k_dirt_fallback' : 'k_dirt'), true, o.surface_seq ? 'dirt' : null]);
      if (sh.main_roads > 0.10) out.push([pc(sh.main_roads), t('k_main'), true, rs ? 'main' : null]);
      else if (sh.dedicated_cycleway >= 0.20) out.push([pc(sh.dedicated_cycleway), t('k_cycle'), false, rs ? 'cycle' : null]);
      else if (o.traffic_lights === 0) out.push([t('k_nolight_fig'), t('k_nolight')]);
      else if (o.terrain.climbs && o.terrain.climbs.length) {
        const c = o.terrain.climbs[0];
        out.push([km1(c.length_km) + ' km', t('k_climb', { m: Math.round(c.gain_m) }) +
          (c.avg_grade_pct != null ? ' ' + climbLabel(c).charAt(0).toUpperCase() + climbLabel(c).slice(1) + '.' : ''),
          false, 'climb:0']);
      }
      // lieux remarquables (01/10/2026, Florent : Tibidabo) : sommets, belvédères connus traversés
      if (o.remarkable && o.remarkable.length) out.push(['', t('k_remarkable', { list: o.remarkable.map(x => x.n).join(', ') })]);
      if (o.out_and_back) out.push([Math.round(100 * (o.overlap || 0)) + ' %', t('k_outback')]);   // aller-retour sur piste (v15)
      // échappatoires (panel d'utilisateurs) : points d'eau, cafés hors ville, gares de retour
      // brief v3 : une ligne par service, au format des autres (eau ; gares, deux au plus) ; cafés dans « Tous les chiffres »
      const P = o.pois || [], nW = P.filter(x => x.t === 'w').length;
      if (nW) out.push([String(nW), tn('k_water', nW)]);
      const nG = P.filter(x => x.t === 'g').length;       // gares : le nombre ici, le détail dans « Tous les chiffres »
      if (nG) out.push([String(nG), tn('k_stations', nG)]);
      // feux : beaucoup de feux = beaucoup d'arrêts (sortie de Florent, 28/09/2026 : 28 min sur 2 h 23)
      if ((o.traffic_lights_per_km || 0) >= 2.5 && lightsWaitMin(o) >= 5)
        out.push([tn('k_lights_fig', o.traffic_lights), t('k_lights_wait2', { m: lightsWaitMin(o) }), true]);
      // pente : badge à seuil unique, jamais de chiffre (D17)
      if (o.terrain.max_grade_pct != null && o.terrain.max_grade_pct >= 20) out.push(['', t('k_steep'), true]);
      return out;
    }
    const WARN_ICON_ = () => '<svg width="16" height="16" viewBox="0 0 16 16" aria-label="' + t('warn') + '"><path d="M8 2l6.5 11.5h-13z" fill="none" stroke="#A8522F" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6.5v3.2" stroke="#A8522F" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="11.6" r=".8" fill="#A8522F"/></svg>';
    // petit tracé : la ligne a un tronçon sur la carte
    const MAP_ICON = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 11c2-6 4 0 6-5s3-3 4-4" fill="none" stroke="#A8522F" stroke-width="1.6" stroke-linecap="round"/></svg>';
    function keysHtml(o) {
      return keyRowsHtml(keyPoints(o).map(([fig, txt, warn, hl]) => [fig, txt, hl, warn]));
    }
    function keyRowsHtml(rows) {
      return '<div class="keys">' + rows.map(([fig, txt, hl, warn, help]) =>
        '<div' + (warn ? ' class="warn-row"' : '') + (hl ? ' data-hl="' + hl + '" role="button" tabindex="0"' : '') +
        '><span class="fig">' + esc(fig) + '</span><span class="txt">' + esc(txt) +
        '</span>' + (warn ? WARN_ICON_() : '') + (hl ? '<span class="onmap"><span>' + esc(t('on_map')) + '</span>' + MAP_ICON + '</span>' : '') +
        (help ? '<button type="button" class="qm" aria-expanded="false" aria-label="' + esc(t('help_btn')) +
                '" onclick="toggleRowHelp(this)">?</button>' : '') +
        '</div>' + (help ? '<p class="row-help" hidden>' + esc(help) + '</p>' : '')).join('') + '</div>';
    }
    // « Tous les chiffres » (brief v2) : trois blocs, chaque ligne = [repère chiffré, phrase, tronçon à surligner, alerte ?] ;
    // ville, forêt et bord d'eau : mêmes pourcentages que la barre de terrain ; jamais de pourcentage de pente (D17)
    // temps probable perdu aux feux : SIGNAL_DELAY_S (10 s) par feu franchi, comme le calcul de la durée
    const lightsWaitMin = o => Math.round((o.traffic_lights || 0) * 10 / 60);
    function allFacts(o) {
      const R = [], E = [], C = [];
      const per100 = o.ascend_m / Math.max(o.distance_km, 0.1) * 100;
      R.push([Math.max(1, Math.round(per100 / 100)) + ' m/km', t('fr_profile2', { d: Math.round(o.ascend_m),
        km: km1(o.distance_km), relief: reliefCategory(per100) })]);
      const tr = o.terrain;
      const climbs = (tr.climbs || []).map((c, k) => [c, k]).sort((x, y) => x[0].start_km - y[0].start_km);
      if (tr.n_climbs) {
        R.push([String(tr.n_climbs), tn('fr_climbs', tr.n_climbs) + (tr.avg_climb_grade_pct != null ? ', ' + slopeCategory(tr.avg_climb_grade_pct) : '') +
          (climbs.length && climbs.length < tr.n_climbs ? t('fr_biggest', { k: climbs.length }) : '') + '.', null, false,
          climbs.some(([c]) => c.category) ? t('climb_cat_help') : null]);   // échelle des catégories : dépliée par « ? »
        climbs.forEach(([c, k], n) => R.push(['n° ' + (n + 1), (c.name ? c.name + ' · ' : '') + 'km ' + km(c.start_km) + ' → ' +
          km(c.start_km + c.length_km) + ' · +' + Math.round(c.gain_m) + ' m' +
          (c.avg_grade_pct != null ? ' · ' + climbLabel(c) : ''), 'climb:' + k]));   // brief v3 : nom, plage, « · »
      } else R.push(['0', t('fr_noclimb')]);
      const lcF = LANDCOVER_OK && o.scenery && o.scenery.landcover, seq = !!(o.scenery && o.scenery.landcover_seq);
      const sc = o.scenery;
      if (sc) {
        const fo = lcF ? lcF.forest : sc.forest, wa = lcF ? lcF.water : sc.water;
        if (fo >= 0.05) E.push([pc(fo), t('fr_forest'), seq ? 'forest' : null]);
        // part de TOUT le parcours ; « dont 25 % » sous la forêt se lisait « 25 % des 15 % » (Florent, 03/10/2026)
        if (sc.protected >= 0.05) E.push([pc(sc.protected), t('k_protected'), sc.protected_seq ? 'park' : null]);
        if (wa >= 0.05) E.push([pc(wa), t('fr_water'), seq ? 'water' : null]);
        if (sc.viewpoints >= 1) E.push([String(sc.viewpoints), tn('fr_views', sc.viewpoints)]);
      }
      C.push([pc(cityShare(o)), t('fr_city'), seq ? 'town' : null]);
      if (o.traffic_lights != null) C.push(o.traffic_lights === 0 ? ['0', t('fr_nolights')]
        : [String(o.traffic_lights), tn('fr_lights', o.traffic_lights, { x: km1(o.traffic_lights_per_km || 0) }) +
          (lightsWaitMin(o) >= 1 ? ' ' + t('fr_lights_wait', { m: lightsWaitMin(o) }) : ''), null, (o.traffic_lights_per_km || 0) >= 2.5]);
      if (o.scenery && o.scenery.industrial >= 0.05) C.push([pc(o.scenery.industrial), t('fr_industrial'),
        o.scenery.industrial_seq ? 'industrial' : null, o.scenery.industrial >= 0.10]);
      const sh = o.shares;
      const rs = !!o.road_seq, dirt = dirtKm(o);
      C.push([pc(sh.dedicated_cycleway), t('k_cycle'), rs && sh.dedicated_cycleway > 0 ? 'cycle' : null]);
      C.push([pc(sh.main_roads), t('k_main_short') + '.', rs && sh.main_roads > 0 ? 'main' : null, sh.main_roads > 0.10]);
      if (dirt != null) { if (dirt >= 0.1) C.push([km1(dirt) + ' km', t('fr_dirt'), o.surface_seq ? 'dirt' : null, dirt >= 0.5]); }
      else if (sh.unpaved > 0.05) C.push([pc(sh.unpaved), t('fr_unpaved')]);          // données v8 et avant
      // revêtement non renseigné : hors ville seulement, surlignable (Florent, 02/10/2026). L'ancienne ligne (part sur tout le
      // parcours, surtout des rues de ville goudronnées) faisait croire à un danger : retirée, y compris pour les anciennes données
      const unk = seqRanges(o, 'unknown').reduce((s, [a, b]) => s + b - a, 0);
      if (unk >= 0.5) C.push([km1(unk) + ' km', t('fr_surface_rural'), 'unknown']);
      if (o.overlap > 0.10) C.push([pc(o.overlap), t('fr_overlap')]);
      if (o.u_turns) C.push([String(o.u_turns), tn('fr_uturns', o.u_turns)]);
      const W = [], P = o.pois || [], kms = t2 => P.filter(x => x.t === t2).map(x => km1(x.km)).join(' · ');
      const nW = P.filter(x => x.t === 'w').length, nC = P.filter(x => x.t === 'c').length;
      if (nW) W.push([String(nW), tn('fr_water_pts', nW, { list: kms('w') })]);
      if (nC) W.push([String(nC), tn('fr_cafes', nC, { list: kms('c') })]);
      P.filter(x => x.t === 'g').forEach(x => W.push(['km ' + km1(x.km), t('fr_station', { name: x.n || '' })]));
      return [['grp_relief', R], ['grp_env', E], ['grp_road', W], ['grp_circ', C]].filter(([, rows]) => rows.length);
    }
    function factsHtml(o) {
      return allFacts(o).map(([g, rows]) => '<div class="sec-label facts-h">' + esc(t(g)) + '</div>' + keyRowsHtml(rows)).join('');
    }

    // ---------- O-9.4 : barre de terrain (répartition ville / eau / forêt / espaces ouverts calculée par le pipeline, 100 %) ;
    // « espaces ouverts » = ni bâti, ni eau, ni forêt (champs, garrigue, mais aussi parcs urbains comme le long du Besòs)
    // affichée seulement si la donnée existe (scenery.landcover, générateur v5 et suivants)
    const TERRAIN = [['city', 't_city', '--oyan-terrain-ville'], ['forest', 't_forest', '--oyan-terrain-foret'],
                     ['water', 't_water', '--oyan-terrain-eau'], ['countryside', 't_open', '--oyan-terrain-campagne']];
    // interrupteur de la barre : « ville » mesurée par le bâti (5 bâtiments OSM à moins de ~75 m), données recalculées
    // le 26/09/2026 (mode landcover) ; la v1 (dans une zone bâtie) sortait une boucle 100 % urbaine à 5 % « ville »
    const LANDCOVER_OK = true;
    const cityShare = o => (LANDCOVER_OK && o.scenery && o.scenery.landcover) ? o.scenery.landcover.city : o.shares.urban.city;
    function terrainBar(o) {
      const lc = LANDCOVER_OK && o.scenery && o.scenery.landcover;
      if (!lc) return '';
      const parts = TERRAIN.filter(([k]) => lc[k] > 0);
      return '<div class="terrain" role="img" aria-label="' + esc(t('terrain_aria')) +
        parts.map(([k, lab]) => esc(t(lab)) + ' ' + pc(lc[k])).join(', ') + '">' +
        parts.map(([k, , v]) => '<span style="width:' + (lc[k] * 100).toFixed(1) + '%;background:var(' + v + ')"></span>').join('') +
        '</div><div class="terrain-legend">' +
        parts.map(([k, lab, v]) => '<div><i style="background:var(' + v + ')"></i><span>' + esc(t(lab).charAt(0).toUpperCase() + t(lab).slice(1)) +
          '</span><b>' + pc(lc[k]) + '</b></div>').join('') + '</div>';
    }

    // écarts d'une autre boucle par rapport à la boucle affichée : « +3,4 km · −85 m · +11 min »
    function deltas(x, o) {
      const sg = (v, t) => (v > 0 ? '+' : v < 0 ? '−' : '±') + t;
      const dk = Math.round((x.distance_km - o.distance_km) * 10) / 10, dm = Math.round(x.ascend_m - o.ascend_m);
      const dt = Math.round(x.time_est_min - o.time_est_min);
      return sg(dk, km1(Math.abs(dk)) + ' km') + ' · ' + sg(dm, Math.abs(dm) + ' m') + ' · ' + sg(dt, Math.abs(dt) + ' min');
    }

    // contenu du panneau (maquette 5c / 5d) : terrain, points clés, profil, suggestion, dépliants, autres boucles, notes
    function detailHtml(o) {
      const facts = factsHtml(o);
      // boucle qui reste en ville : proposer plus long ; et, si un départ voisin sort plus vite de la ville, le suggérer
      let longer = '';
      if (exitKm(o) == null) {
        const hasLonger = startData.options.some(x => x.level === o.level && x.duration_target_min > o.duration_target_min);
        if (hasLonger) longer = '<div class="tip"><div class="sec-label">' + esc(t('longer_label')) + '</div><p>' + esc(t('longer_txt')) + '</p>' +
          '<button type="button" class="btn" onclick="nextDuration()">' + esc(t('longer_btn')) + '</button></div>';
      }
      const lc = LANDCOVER_OK && o.scenery && o.scenery.landcover;
      const others = shown.map((x, k) => k === current ? '' :
        '<button type="button" class="vcard" data-i="' + k + '"><span class="vc"><span class="sec-label">' +
        esc(optName(x).toUpperCase()) + '</span><span class="vs">' + km(x.distance_km) + ' km · ' +
        esc(t('dplus_inline', { m: Math.round(x.ascend_m) })) + ' · ≈ ' + hm(x.time_est_min) + '</span><span class="vd">' + deltas(x, o) + '</span></span>' +
        '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 3l4 4-4 4" fill="none" stroke="#625D55" stroke-width="1.6" stroke-linecap="round"/></svg></button>').join('');
      const pf = profileSvg(o);

      return `
        ${lc ? terrainBar(o) : '<div class="sub">' + esc(t('city_pct', { p: pctStr(Math.round(cityShare(o) * 100)) })) + '</div>'}
        ${keysHtml(o)}
        ${pf ? '<div class="pf-block"><div class="pf-head"><span class="sec-label">' + esc(t('profile')) + '</span><span id="pfRead">' + (o.terrain.climbs && o.terrain.climbs.length ? esc(tn('pf_climbs', o.terrain.climbs.length)) : '') + '</span></div>' + pf + '</div>' : ''}
        <div class="rows">
          <details><summary>${esc(t('all_figures'))}</summary>
            <div class="facts">${facts}</div>
          </details>
          <details><summary>${esc(t('how_title'))}</summary>
            <div class="how">${[1, 2, 3, 4, 5, 6].map(k => '<p>' + esc(t('how_' + k)) + '</p>').join('')}</div>
          </details>
          ${feedbackHtml(o)}
        </div>
        ${longer}${natureNeighbour(o)}${trainStart(o)}
        ${others}
        <small class="notes">${esc(t('notes'))}</small>
        <div id="legal">${esc(t('legal_line'))} · <a href="mentions.html" target="_blank" rel="noopener">${esc(t('legal_link'))}</a></div>`;
    }

    // écart d'une autre boucle avec la boucle affichée, sous son segment (brief v3) : « −10,2 km · +80 m »
    function segDelta(x, o) {
      const sg = v => (v > 0 ? '+' : v < 0 ? '−' : '±');
      const dk = x.distance_km - o.distance_km, dd = Math.round(x.ascend_m - o.ascend_m);
      return sg(dk) + km(Math.abs(dk)) + ' km · ' + sg(dd) + Math.abs(dd) + ' m';
    }
    // en-tête du panneau : nom de la boucle, pastilles des autres boucles, chiffres (colonnes ou ligne selon la hauteur)
    function headHtml(o) {
      const seg = shown.length > 1 ? '<div class="optseg" role="group">' + shown.map((x, k) =>
        '<button type="button" class="alt" data-i="' + k + '" aria-pressed="' + (k === current) + '"><span class="l1"><i class="sw' +
        (k === current ? ' on' : '') + '"></i><span>' + esc(optName(x)) + '</span></span>' +
        (k === current ? '' : '<small class="dlt">' + esc(segDelta(x, o)) + '</small>') + '</button>').join('') + '</div>' : '';
      return `<div class="head-row${seg ? ' has-seg' : ''}"><span class="opt-label">${esc(optName(o))}</span>${seg}</div>
        <div class="sum-line">${km(o.distance_km)} km · ${esc(t('dplus_inline', { m: Math.round(o.ascend_m) }))} · ≈ ${hm(o.time_est_min)}</div>
        <div class="figs">
          <div class="k">${esc(t('fig_distance'))}</div><div class="k">${esc(t('fig_dplus'))}<button type="button" class="qm" aria-expanded="false" aria-label="${esc(t('dplus_help_btn'))}" onclick="toggleDplusHelp(this)">?</button></div><div class="k">${esc(t('fig_duration'))}</div>
          <div class="big">${km(o.distance_km)}<span> km</span></div><div class="v">${Math.round(o.ascend_m)} m</div><div class="v">≈ ${hm(o.time_est_min)}</div>
          <div class="dplus-help" hidden>${esc(t('dplus_help'))}</div>
        </div>${o.shares.main_roads > 0.10 ? '<div class="roadwarn">' + WARN_ICON_() + '<span><b>' + pc(o.shares.main_roads) +
          '</b> ' + esc(t('k_main_short')) + '</span></div>' : ''}`;
    }

    function select(i) {
      current = i;
      clearHighlight();
      document.getElementById('gpxHelp').hidden = true;
      const o = shown[current];
      const totalEl = document.getElementById('totalApproach');
      totalEl.textContent = approachMin != null
        ? t('total_approach', { t: hm(o.time_est_min + 2 * approachMin) })   // aller ET retour (remarque de Florent)
        : '';
      sheetHead.innerHTML = headHtml(o);
      sheetFoot.hidden = false;
      sheetBody.innerHTML = detailHtml(o);
      sheetBody.scrollTop = 0;
      map.getSource('cursor').setData(EMPTY);
      const pf = sheetBody.querySelector('svg.pf');
      if (pf) bindProfile(pf, pos => map.getSource('cursor').setData(pos
        ? { type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: pos } } : EMPTY),
        document.getElementById('pfRead'));

      const features = shown
        .map((x, k) => ({
          type: 'Feature',
          properties: { selected: k === current, k },
          geometry: { type: 'LineString', coordinates: x.coords }
        }))
        .sort((a, b) => a.properties.selected - b.properties.selected);
      map.getSource('routes').setData({ type: 'FeatureCollection', features });
      altLabels();
      poiMarkers(o);
      fitRoute();
      rememberLoop();
    }

    // points d'intérêt de la boucle affichée (eau, cafés, gares) : petites icônes, nom au survol / toucher long
    const POI_ICON = {
      w: '<path d="M7 1.6c2 2.6 3.7 4.8 3.7 6.7A3.7 3.7 0 0 1 3.3 8.3c0-1.9 1.7-4.1 3.7-6.7z" fill="#3F7391"/>',
      c: '<path d="M3 5h6.2v3.2A2.6 2.6 0 0 1 6.6 10.8H5.6A2.6 2.6 0 0 1 3 8.2zM9.2 6h1a1.3 1.3 0 0 1 0 2.6h-1" fill="none" stroke="#7A5F35" stroke-width="1.5"/>',
      g: '<rect x="3.6" y="2.6" width="6.8" height="7.2" rx="1.6" fill="none" stroke="#24221F" stroke-width="1.3"/><path d="M3.6 6.4h6.8M5 12l1-2.2M9 12l-1-2.2" stroke="#24221F" stroke-width="1.3" stroke-linecap="round"/>'
    };
    function poiMarkers(o) {
      const src = map.getSource('pois');
      if (!src) return;
      src.setData({ type: 'FeatureCollection', features: (o && o.pois || []).map(x => ({ type: 'Feature',
        properties: { t: x.t, label: (x.n ? x.n + ' · ' : '') + t('poi_' + x.t) + ' · km ' + km1(x.km) },
        geometry: { type: 'Point', coordinates: [x.lon, x.lat] } })) });
    }

    // étiquette « Moins de relief · 45,3 km » sur chaque autre boucle ; la toucher échange les deux boucles.
    // Placement calculé à l'écran après chaque cadrage (remarque de Florent, 27/09/2026 : l'étiquette recouvrait la boucle
    // recommandée) : parmi les points de l'autre boucle, on garde celui où le rectangle de l'étiquette, posé à droite ou
    // à gauche du point, reste le plus loin de la boucle affichée et du départ, dans la partie visible de la carte.
    let altMarkers = [];
    function altLabels() {
      altMarkers.forEach(m => m.marker.remove());
      altMarkers = [];
      shown.forEach((x, k) => {
        if (k === current) return;
        const el = document.createElement('div');
        el.className = 'mk-alt';
        el.textContent = optName(x) + ' · ' + km(x.distance_km) + ' km';
        el.onclick = e => { e.stopPropagation(); select(k); };
        const c = x.coords[Math.floor(x.coords.length / 2)];
        altMarkers.push({ x, marker: new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([c[0], c[1]]).addTo(map) });
      });
      placeAltLabels();
    }
    function placeAltLabels() {
      if (!altMarkers.length || !shown[current]) return;
      const cv = map.getCanvas().getBoundingClientRect(), W = cv.width, H = cv.height;
      const top = (getComputedStyle(topCard).display !== 'none' ? topCard.getBoundingClientRect().bottom : 0) + 6;
      const bottom = H - (sheet.hidden ? 0 : sheet.getBoundingClientRect().height)
        - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--attr-h')) || 24) - 6;   // au-dessus du panneau et des crédits
      const avoid = shown[current].coords.filter((_, j) => j % 2 === 0).map(c => map.project([c[0], c[1]]));
      if (startData) avoid.push(map.project([startData.start.lon, startData.start.lat]));
      const taken = [];                                      // étiquettes déjà posées (plusieurs autres boucles)
      const gap = (r, q) => Math.hypot(Math.max(r[0] - q.x, 0, q.x - r[2]), Math.max(r[1] - q.y, 0, q.y - r[3]));
      altMarkers.forEach(({ x, marker }) => {
        const el = marker.getElement(), w = el.offsetWidth || 160, h = el.offsetHeight || 24;
        let best = null;
        for (let j = 0; j < x.coords.length; j += 2) {
          const q = map.project([x.coords[j][0], x.coords[j][1]]);
          for (const side of [1, -1]) {                      // étiquette à droite du point, ou à gauche
            const x0 = side > 0 ? q.x + 8 : q.x - 8 - w;
            const r = [x0, q.y - h / 2, x0 + w, q.y + h / 2];
            if (r[0] < 6 || r[2] > W - 56 || r[1] < top || r[3] > bottom) continue;   // hors de la carte visible (56 : bouton de position)
            let d = Infinity;
            for (const m of avoid) { d = Math.min(d, gap(r, m)); if (d < (best ? best.d : 0)) break; }
            for (const t of taken) d = Math.min(d, Math.max(t[0] - r[2], r[0] - t[2], t[1] - r[3], r[1] - t[3], 0));
            if (!best || d > best.d) best = { d, c: x.coords[j], off: [side * (8 + w / 2), 0], r };
          }
        }
        if (!best) { el.style.visibility = 'hidden'; return; }   // aucune place : pas d'étiquette plutôt qu'une étiquette gênante
        el.style.visibility = '';
        marker.setLngLat([best.c[0], best.c[1]]).setOffset(best.off);
        taken.push(best.r);
      });
    }

    // ---------- surlignage d'un tronçon (maquette 5c) : sortie de ville, forêt ou bord d'eau (bande de terrain), montées
    function hlRanges(o, kind) {                           // tronçons [km début, km fin]
      if (kind === 'exit') return [[0, exitKm(o)]];
      if (kind === 'city') return [[0, o.distance_km]];
      if (kind.startsWith('climb:')) {
        const c = (o.terrain.climbs || [])[Number(kind.slice(6))];
        return c ? [[c.start_km, c.start_km + c.length_km]] : [];
      }
      return seqRanges(o, kind);
    }
    function hlLine(o, a, b) {                             // morceau du tracé entre les km a et b
      const p = profileData(o.coords, o.distance_km), pts = [profilePoint(o.coords, p.dist, a)];
      o.coords.forEach((c, k) => { if (p.dist[k] > a && p.dist[k] < b) pts.push([c[0], c[1]]); });
      pts.push(profilePoint(o.coords, p.dist, b));
      return pts;
    }
    let hlKey = null;
    function clearHighlight() {
      hlKey = null;
      if (map.getSource('hl')) map.getSource('hl').setData(EMPTY);
      if (map.getLayer('routes')) { map.setPaintProperty('routes', 'line-opacity', 1); map.setPaintProperty('routes-casing', 'line-opacity', 1); }
      sheetBody.querySelectorAll('.hl-on').forEach(x => x.classList.remove('hl-on'));
    }
    function toggleHighlight(el) {
      const kind = el.dataset.hl, again = hlKey === kind;
      clearHighlight();
      if (again) return;                                   // second toucher : on efface le surlignage
      const o = shown[current];
      const lines = hlRanges(o, kind).filter(([a, b]) => b > a).map(([a, b]) => hlLine(o, a, b));
      if (!lines.length) return;
      hlKey = kind;
      el.classList.add('hl-on');
      const color = ROUTE.color;
      map.setPaintProperty('routes', 'line-opacity', 0.4);        // boucle atténuée sous le tronçon surligné (brief v2)
      map.setPaintProperty('routes-casing', 'line-opacity', 0.4);
      map.getSource('hl').setData({ type: 'FeatureCollection', features: lines.map(c =>
        ({ type: 'Feature', properties: { color }, geometry: { type: 'LineString', coordinates: c } })) });
      // pas de zoom sur le tronçon (demande de Florent) : toute la boucle reste cadrée pour situer l'endroit exact
      if (sheet.dataset.state === 'high') setSheet('mid');  // laisser voir la carte
      fitRoute();
    }

    // ---------- panel d'utilisateurs (27/09/2026) : lien partageable, mémoire des réglages, explications
    // lien partageable : ?s=<départ>&d=<durée en h>&l=<allure>&o=<option> (bouton Partager)
    function loopUrl() {
      const o = shown[current];
      const q = new URLSearchParams({ s: startSel.value, d: durSel.value, l: levelSel.value });
      if (o && o.label !== 'equilibre') q.set('o', o.label);
      return location.origin + location.pathname + '?' + q.toString();
    }
    const LAST_KEY = 'oyan-last';                          // derniers réglages, sur cet appareil seulement
    function rememberLoop() {
      if (!startData || !shown[current]) return;
      try { localStorage.setItem(LAST_KEY, JSON.stringify({ s: startSel.value, d: durSel.value, l: levelSel.value, o: shown[current].label })); }
      catch (e) { /* stockage bloqué : rien n'est retenu */ }
    }
    let wantedOption = null;                               // option demandée par un lien (appliquée au chargement du départ)
    function restoreLoop() {                               // un lien passe avant les derniers réglages de l'appareil
      const q = new URLSearchParams(location.search);
      let r = q.get('s') ? { s: q.get('s'), d: q.get('d'), l: q.get('l'), o: q.get('o'), link: true } : null;
      if (!r) { try { r = JSON.parse(localStorage.getItem(LAST_KEY) || 'null'); } catch (e) { r = null; } }
      if (!r || !indexData.starts.some(x => x.id === r.s)) return;
      if (r.link) { try { history.replaceState(null, '', location.pathname); } catch (e) { /* adresse inchangée */ } }
      if (r.l && [...levelSel.options].some(o => o.value === r.l)) levelSel.value = r.l;
      if (r.d && [...durSel.options].some(o => o.value === r.d)) durSel.value = r.d;
      wantedOption = r.o || null;
      const s = indexData.starts.find(x => x.id === r.s);
      setWhere(() => startLine(s, esc(t(r.link ? 'from_link' : 'last_start'))));
      approachMin = null;
      chooseStart(r.s);
    }
    // ---------- historique : boucles téléchargées ou partagées, sur cet appareil (20 au plus, la plus récente en premier)
    const HIST_KEY = 'oyan-history';
    function readHistory() { try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch (e) { return []; } }
    function addHistory(action) {
      const o = shown[current];
      if (!o || !startData) return;
      const it = { s: startSel.value, d: durSel.value, l: levelSel.value, o: o.label, km: o.distance_km, up: Math.round(o.ascend_m),
                   a: action, at: new Date().toISOString().slice(0, 10) };
      const list = readHistory().filter(x => !(x.s === it.s && x.d === it.d && x.l === it.l && x.o === it.o));
      list.unshift(it);
      try { localStorage.setItem(HIST_KEY, JSON.stringify(list.slice(0, 20))); } catch (e) { /* stockage bloqué */ }
      renderHistory();
    }
    function renderHistory() {
      const list = readHistory(), box = document.getElementById('history');
      box.hidden = !list.length;
      if (!list.length) return;
      document.getElementById('historySum').textContent = t('history', { n: list.length });
      document.getElementById('historyList').innerHTML = list.map((x, i) => {
        const s = indexData && indexData.starts.find(y => y.id === x.s);
        if (!s) return '';
        return '<div class="h-row"><button type="button" class="h-item" data-h="' + i + '"><span>' + esc(startLabel(s)) + ' · ' + hm(Number(x.d) * 60) + ' · ' +
          esc(t('lvl_' + x.l)) + '</span><span class="h-sub">' + esc(optLabel(x.o)) + ' · ' + km(x.km) + ' km · ' +
          esc(t('dplus_inline', { m: x.up })) + ' · ' + esc(t(x.a === 'share' ? 'h_shared' : 'h_gpx', { date: new Date(x.at + 'T12:00:00').toLocaleDateString(LANG, { day: 'numeric', month: 'short' }) })) + '</span></button>' +
          '<button type="button" class="h-del" data-del="' + i + '" aria-label="' + esc(t('h_remove')) + '" title="' + esc(t('h_remove')) + '">×</button></div>';
      }).join('') + '<button type="button" class="h-clear" data-h="clear">' + esc(t('h_clear')) + '</button>';
    }
    document.getElementById('historyList').addEventListener('click', e => {
      const del = e.target.closest('button[data-del]');   // × : retirer cette seule boucle (annulable 5 s, brief v3)
      if (del) {
        const before = readHistory(), list = before.slice();
        list.splice(Number(del.dataset.del), 1);
        try { localStorage.setItem(HIST_KEY, JSON.stringify(list)); } catch (err) { /* stockage bloqué */ }
        renderHistory();
        showUndo(t('h_removed'), before);
        return;
      }
      const b = e.target.closest('button[data-h]');
      if (!b) return;
      if (b.dataset.h === 'clear') {
        const before = readHistory();
        try { localStorage.removeItem(HIST_KEY); } catch (err) { /* rien */ }
        renderHistory();
        showUndo(t('h_cleared'), before);
        return;
      }
      const x = readHistory()[Number(b.dataset.h)];
      if (!x) return;
      levelSel.value = x.l; durSel.value = x.d; wantedOption = x.o; approachMin = null;
      const s = indexData.starts.find(y => y.id === x.s);
      setWhere(() => startLine(s, esc(t('from_history'))));
      document.getElementById('history').open = false;
      chooseStart(x.s);
    });

    // bandeau « Boucle supprimée · Annuler » pendant 5 s : remet la liste telle qu'elle était
    let undoTimer = null;
    function showUndo(msg, before) {
      let el = document.getElementById('undo');
      if (!el) { el = document.createElement('div'); el.id = 'undo'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
      el.innerHTML = '<span>' + esc(msg) + '</span><button type="button">' + esc(t('undo')) + '</button>';
      el.hidden = false;
      el.querySelector('button').onclick = () => {
        try { localStorage.setItem(HIST_KEY, JSON.stringify(before)); } catch (err) { /* stockage bloqué */ }
        renderHistory();
        el.hidden = true;
      };
      clearTimeout(undoTimer);
      undoTimer = setTimeout(() => { el.hidden = true; }, 5000);
    }

    async function shareLoop() {
      const url = loopUrl(), o = shown[current];
      addHistory('share');
      const title = 'Oyan · ' + optName(o) + ' · ' + km(o.distance_km) + ' km';
      try { if (navigator.share) { await navigator.share({ title, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
      try { await navigator.clipboard.writeText(url); showGpxHelp(esc(t('link_copied'))); }
      catch (e) { showGpxHelp(esc(t('link_here')) + ' <br><input readonly value="' + esc(url) + '" style="width:100%" onfocus="this.select()">'); }
    }
    function showGpxHelp(html) {
      const h = document.getElementById('gpxHelp');
      h.innerHTML = html + '<button type="button" onclick="this.parentNode.hidden = true">' + esc(t('close')) + '</button>';
      h.hidden = false;
    }
    function getGpx() {                                    // téléchargement, puis « comment suivre la boucle ? »
      downloadGpx(startData.start, shown[current], t('lvl_' + shown[current].level));
      addHistory('gpx');
      showGpxHelp(t('gpx_help'));
    }
    function toggleRowHelp(b) {                            // « ? » d'une ligne : explication dépliée sous la ligne
      const h = b.parentNode.nextElementSibling;
      h.hidden = !h.hidden;
      b.setAttribute('aria-expanded', String(!h.hidden));
    }
    function toggleDplusHelp(b) {
      const h = sheetHead.querySelector('.dplus-help');
      h.hidden = !h.hidden;
      b.setAttribute('aria-expanded', String(!h.hidden));
    }
    // allures = FTP (W/kg) et part de FTP tenue, comme scripts/generate_loops.py (LEVELS, level_watts, speed_from_power) :
    // vitesse EN ROULANT sur le plat, seul, sans vent (le temps estimé retranche en plus arrêts et prudence)
    const PACE = { facile: [2.3, 0.65], modere: [3.0, 0.70], soutenu: [3.8, 0.75] };
    function flatKmh(watts) {                              // même physique que le pipeline : 85 kg, CdA 0,40, Crr 0,005
      const target = watts * 0.975, need = v => 0.5 * 1.2 * 0.40 * v ** 3 + 85 * 9.81 * 0.005 * v;
      let lo = 0.3, hi = 25;
      for (let k = 0; k < 50; k++) { const m = (lo + hi) / 2; if (need(m) < target) lo = m; else hi = m; }
      return lo * 3.6;
    }
    function updatePaceHint() {
      const p = PACE[levelSel.value];
      if (!p) return;
      const w = p[0] * 75 * (p[1] - (Number(durSel.value) >= 3 ? 0.05 : 0));
      document.getElementById('paceHint').textContent =
        t('pace_hint', { f: dec(p[0].toFixed(1)), v: Math.round(flatKmh(w)) });
    }

    // cadre la boucle dans la partie de la carte laissée libre par les réglages (en haut) et le panneau (en bas)
    function fitRoute() {
      if (!shown.length || !shown[current]) return;
      const bounds = new maplibregl.LngLatBounds();
      shown.forEach(x => x.coords.forEach(c => bounds.extend([c[0], c[1]])));   // la boucle et ses variantes (maquette 5b)
      if (startData) bounds.extend([startData.start.lon, startData.start.lat]);  // le départ ne passe jamais sous le panneau
      const hs = sheetHeights(), H = window.innerHeight;
      // brief v3 : au cran ouvert, l'ancien calcul réduisait les deux marges dans la même proportion, et la boucle passait
      // en partie sous le panneau. On cadre dans la bande visible ; si elle est très étroite, on rogne la marge du haut.
      const attrH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--attr-h')) || 24;
      let top = (getComputedStyle(topCard).display !== 'none' ? topCard.getBoundingClientRect().bottom : 0) + 16;
      const bottom = (sheet.hidden ? 0 : hs[sheet.dataset.state]) + attrH + 12;
      const MIN_STRIP = 90;                                   // bande minimale pour voir la boucle entière
      if (H - top - bottom < MIN_STRIP) top = Math.max(8, H - bottom - MIN_STRIP);
      map.fitBounds(bounds, { padding: { top, bottom, left: 30, right: shown.length > 1 ? 70 : 30 }, duration: 500 });
    }

    init();
  </script>
