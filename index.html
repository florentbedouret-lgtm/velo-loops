<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oyan</title>
  <meta name="theme-color" content="#F6F4F0">
  <link rel="icon" href="brand/svg/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="brand/png/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="brand/png/apple-touch-icon.png">
  <!-- app installable (PWA, brief v2) : icône officielle, déjà dans la zone sûre des icônes « maskable » -->
  <link rel="manifest" href="brand/oyan.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Oyan">
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <link href="brand/oyan-tokens.css" rel="stylesheet">
  <link href="fonts/oyan-fonts.css" rel="stylesheet">
  <style>
    /* couleurs : uniquement les variables de brand/oyan-tokens.css ; l'argile est réservée au tracé, au bouton GPX et
       au nom de la boucle choisie (maquette « Oyan App Refonte », étape 5) */
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { font-family: var(--font-sans); background: var(--color-bg); color: var(--color-text); }
    a { color: var(--color-text); }
    b, strong { font-weight: var(--fw-medium); } /* charte : pas de typographie grasse */
    .label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    input, select { font: inherit; font-size: 16px; padding: 8px; color: var(--color-text); background: var(--color-surface);
                    border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
    .btn { font: inherit; font-size: 16px; padding: 8px 12px; border-radius: var(--radius-sm); cursor: pointer;
           background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-text); }
    .btn-accent { background: var(--color-accent); color: var(--color-on-accent); border-color: var(--color-accent); }
    .warn { font-weight: 500; }
    .warn::before { content: '⚠️ '; }

    /* ---------- carte plein écran ; les crédits de la carte restent visibles au-dessus du panneau (--sheet-h) */
    #map { position: fixed; inset: 0; }
    .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { bottom: var(--sheet-h, 0px); transition: bottom .25s ease; }
    .maplibregl-ctrl-bottom-left .maplibregl-ctrl-attrib { font-size: 10px; line-height: 1.35; margin: 0; max-width: calc(100vw - 72px); }

    /* marqueurs : départ = point argile du logo ; position = point basalte à halo ; étiquette de l'autre boucle */
    .mk-start { width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; background: var(--color-accent);
                border: 2.5px solid #fff; box-shadow: 0 1px 4px rgba(36, 34, 31, .35); }
    .mk-user { width: 30px; height: 30px; border-radius: 50%; background: rgba(36, 34, 31, .14); display: flex; align-items: center; justify-content: center; }
    .mk-user::after { content: ''; width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: var(--color-text); border: 2px solid #fff; }
    .how p { margin: 0 0 8px; font-size: 14px; line-height: 1.45; color: var(--color-ink-2, #625D55); }
    .mk-alt { font: 12px var(--font-sans); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; cursor: pointer;
              background: #fff; border: 1px solid var(--color-border); border-radius: 12px; padding: 3px 9px; color: var(--color-text);
              box-shadow: 0 1px 4px rgba(36, 34, 31, .15); }
    .mk-alt::before { content: ''; width: 14px; border-top: 2px dashed var(--color-text-2); }
    #locate { position: fixed; z-index: 3; right: 12px; bottom: calc(var(--sheet-h, 0px) + var(--attr-h, 24px) + 12px); width: 44px; height: 44px; border-radius: 22px;
              border: 0; padding: 0; background: var(--color-surface); box-shadow: 0 2px 10px rgba(36, 34, 31, .15); cursor: pointer;
              display: flex; align-items: center; justify-content: center; transition: bottom .25s ease; }
    html:not([data-sheet]) #locate, html[data-sheet=high] #locate, html[data-sheet=mid] #locate, html[data-sheet=peek] #locate { display: none; }

    /* ---------- réglages : carte flottante en haut, repliée en une barre « Gràcia · Modéré · 2 h 00 » */
    #top { position: fixed; z-index: 3; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px;
           max-width: 520px; margin: 0 auto; background: var(--color-surface); border-radius: 26px;
           box-shadow: 0 6px 24px rgba(36, 34, 31, .12); }
    #top.open { border-radius: var(--radius-sheet); }
    html[data-sheet=high] #top { display: none; }        /* panneau ouvert : la carte ne garde qu'un bandeau (maquette 5d) */
    #pill { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 8px 0 14px; cursor: pointer; }
    #pill .sum { flex: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #pill .sum i { font-style: normal; color: var(--color-text-2); }
    #pill .word { display: none; font-size: 21px; letter-spacing: -.01em; margin: -2px 0 0 -8px; flex: 1; }
    #top.open #pill .sum { display: none; }
    #top.open #pill .word { display: block; }
    .round { width: 36px; height: 36px; border-radius: 18px; border: 0; padding: 0; background: var(--color-bg);
             display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
    #top.open #pill .round svg { transform: rotate(180deg); }
    /* menu des langues (dans la barre des réglages, à côté du chevron) */
    .lang-wrap { position: relative; flex: none; }
    .lang-btn { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; height: 32px; padding: 0 8px 0 10px;
                border: 1px solid var(--color-border); border-radius: 16px; background: var(--color-surface); color: var(--color-text);
                display: flex; align-items: center; gap: 5px; cursor: pointer; }
    .lang-menu { position: absolute; right: 0; top: 40px; z-index: 10; min-width: 150px; padding: 4px; background: var(--color-surface);
                 border: 1px solid var(--color-border); border-radius: 12px; box-shadow: 0 6px 24px rgba(36, 34, 31, .12); }
    .lang-menu button { display: block; width: 100%; text-align: left; font: inherit; font-size: 15px; padding: 10px 12px; border: 0;
                        border-radius: 8px; background: none; color: var(--color-text); cursor: pointer; }
    .lang-menu button[aria-checked=true] { background: var(--color-bg); }
    #settings { display: none; padding: 0 16px 16px; max-height: calc(100dvh - 128px - 90px); overflow-y: auto; }
    #top.open #settings { display: block; }
    .k-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; color: var(--color-text-2); margin: 16px 0 8px; }
    #search { display: flex; gap: 8px; }
    .field { flex: 1; min-width: 0; height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 6px;
             padding: 0 4px 0 2px; border: 1px solid var(--color-border); border-radius: 12px; background: var(--color-bg); }
    .field:focus-within { border-color: var(--color-text-2); }
    #addr { flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px 4px; outline: none; }
    .icon-btn { width: 40px; height: 40px; flex: none; border: 0; background: transparent; padding: 0; cursor: pointer;
                display: flex; align-items: center; justify-content: center; border-radius: 10px; }
    #me { width: 48px; height: 48px; border: 1px solid var(--color-border); border-radius: 12px; background: var(--color-surface); }
    /* allure : 3 segments */
    .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; background: var(--color-bg); border-radius: 12px; }
    .seg button { font: inherit; font-size: 15px; height: 40px; border: 0; border-radius: 10px; background: transparent;
                  color: var(--color-text-2); cursor: pointer; padding: 0; }
    .seg button[aria-pressed=true] { background: var(--color-surface); color: var(--color-text); box-shadow: 0 1px 3px rgba(36, 34, 31, .12); }
    /* durée : − 2 h 00 + */
    .stepper { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .stepper button { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--color-border); background: var(--color-surface);
                      color: var(--color-text); font: inherit; font-size: 20px; font-weight: var(--fw-light); cursor: pointer; padding: 0; }
    .stepper button:disabled { opacity: .35; cursor: default; }
    #durVal { font-size: 28px; font-weight: var(--fw-light); }
    /* ligne du départ */
    #startRow { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--color-border); margin-top: 16px; padding-top: 14px; }
    #startRow > svg { flex: none; }
    #startRow.empty .dot-on, #startRow:not(.empty) .dot-off { display: none; }
    #startRow.empty #where { font-size: 15px; color: var(--color-text-2); }
    #change { white-space: nowrap; }
    #top:not(.open) .lang-wrap { display: none; }          /* langue : seulement dans les réglages dépliés (brief v2) */
    #history { margin-top: 12px; border-top: 1px solid var(--color-border); padding-top: 10px; }
    #history summary { cursor: pointer; font-size: 15px; list-style: none; display: flex; align-items: center; min-height: 36px; }
    #history summary::-webkit-details-marker { display: none; }
    #history summary::after { content: ''; margin-left: auto; margin-right: 4px; width: 7px; height: 7px; flex: none;
                              border-right: 1.6px solid var(--color-text-2); border-bottom: 1.6px solid var(--color-text-2);
                              transform: rotate(-45deg); transition: transform .2s; }
    #history[open] summary::after { transform: rotate(45deg); }
    #undo { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(var(--sheet-h, 0px) + 16px);
            background: var(--color-text); color: #fff; border-radius: 12px; padding: 10px 14px; font-size: 14px;
            display: flex; gap: 14px; align-items: center; box-shadow: 0 4px 16px rgba(36, 34, 31, .25); }
    #undo[hidden] { display: none; }
    #undo button { font: inherit; font-size: 14px; color: #fff; background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0; }
    #historyList { display: flex; flex-direction: column; margin-top: 6px; }
    #historyList .h-row { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--color-border); }
    #historyList button.h-item { flex: 1; min-width: 0; font: inherit; text-align: left; background: none; border: 0;
                                 padding: 9px 0; cursor: pointer; color: var(--color-text); display: flex; flex-direction: column; gap: 2px; }
    #historyList .h-del { flex: none; width: 36px; height: 36px; border-radius: 18px; border: 0; background: var(--color-bg);
                          color: var(--color-text-2); font-size: 20px; line-height: 1; cursor: pointer; }
    #historyList .h-sub { font-size: 13px; color: var(--color-text-2); }
    #historyList .h-clear { font: inherit; font-size: 13px; background: none; border: 0; padding: 8px 0 0; color: var(--color-text-2);
                            text-decoration: underline; cursor: pointer; align-self: flex-start; }
    .empty-msg { font-size: 15px; color: var(--color-text-2); padding: 2px 0 6px; }
    #change { font: inherit; font-size: 14px; color: var(--color-accent); background: none; border: 0; padding: 4px 0; cursor: pointer;
              text-decoration: underline; text-underline-offset: 3px; flex: none; }
    #where .w2 { font-size: 13px; color: var(--color-text-2); }
    #results button { display: block; width: 100%; text-align: left; font: inherit; font-size: 15px; padding: 8px; margin-top: 4px;
                      color: var(--color-text); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); }
    #geoattr { display: block; color: var(--color-text-2); padding: 4px 0 0; }
    #totalApproach { padding: 6px 0 0; font-size: 13px; color: var(--color-text-2); text-align: center; }
    #totalApproach:empty { display: none; }
    #where { flex: 1; min-width: 0; font-size: 16px; line-height: 1.4; }
    #where .btn { font-size: 15px; padding: 6px 10px; margin: 4px 6px 0 0; }
    #adv { padding-top: 6px; }
    #adv select, #adv input { width: 100%; box-sizing: border-box; margin-top: 6px; }

    /* ---------- panneau coulissant : peek (réglages ouverts), low (replié), mid (mi-hauteur), high (ouvert) */
    #sheet { position: fixed; z-index: 4; left: 0; right: 0; bottom: 0; height: 250px; max-width: 640px; margin: 0 auto;
             background: var(--color-surface); border-radius: 24px 24px 0 0; box-shadow: 0 -6px 24px rgba(36, 34, 31, .10);
             display: flex; flex-direction: column; transition: height .25s ease; }
    #sheet[hidden] { display: none; }
    #grip { flex: none; padding: 10px 20px 12px; touch-action: none; cursor: grab; position: relative; z-index: 1;
            background: var(--color-surface); border-radius: 24px 24px 0 0; }
    #sheet[data-state=high] #sheetHead { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
    #sheet[data-state=high] .head-row { min-height: 0; flex: none; }
    #sheet[data-state=high] .sum-line { margin-top: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #sheet[data-state=high] #grip { border-bottom: 1px solid var(--color-border); }
    .handle { width: 36px; height: 4px; border-radius: 2px; background: var(--color-border); margin: 0 auto 12px; }
    .head-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }
    .optseg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; width: 100%;
              background: var(--color-bg); border-radius: 12px; }
    .optseg .alt { font: inherit; font-size: 14px; height: 36px; min-width: 0; padding: 0 8px; border: 0; border-radius: 10px;
                   background: transparent; color: var(--color-text-2); display: flex; align-items: center; justify-content: center;
                   gap: 8px; cursor: pointer; }
    .optseg .alt span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .optseg .alt { height: auto; min-height: 36px; flex-direction: column; gap: 1px; padding: 4px 8px; }
    .optseg .alt .l1 { display: flex; align-items: center; gap: 8px; max-width: 100%; }
    .optseg .alt .dlt { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-2); white-space: nowrap;
                        max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .optseg .alt[aria-pressed=true] { background: var(--color-surface); color: var(--color-text); box-shadow: 0 1px 3px rgba(36, 34, 31, .12); }
    .optseg .sw { flex: none; width: 14px; border-top: 2px dashed var(--color-text-2); }
    .optseg .sw.on { border-top: 3px solid var(--color-accent); }
    .head-row.has-seg .opt-label { display: none; }
    #sheet[data-state=high] .head-row.has-seg .opt-label { display: inline; }
    #sheet[data-state=high] .optseg { display: none; }
    .opt-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-accent); }
    .sum-line { font-size: 22px; font-weight: var(--fw-light); margin-top: 10px; }
    #sheet[data-state=high] .sum-line { font-size: 16px; font-weight: var(--fw-regular); margin-top: 8px; }
    .figs { display: grid; grid-template-columns: 1.3fr 1fr 1fr; column-gap: 12px; row-gap: 2px; align-items: baseline; margin-top: 14px; }
    .figs .k { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-2); }
    .figs .big { font-size: 40px; font-weight: var(--fw-light); line-height: 1; }
    .figs .big span { font-size: 18px; }
    .figs .v { font-size: 24px; font-weight: var(--fw-light); line-height: 1.2; }
    #sheet[data-state=peek] .figs, #sheet[data-state=high] .figs { display: none; }
    /* alerte routes principales dès le panneau replié (même seuil que le point clé : 10 %) */
    .roadwarn { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 12px; }
    .roadwarn svg { flex: none; }
    .roadwarn b { font-family: var(--font-mono); font-size: 13px; font-weight: var(--fw-regular); color: var(--color-accent); }
    #sheet[data-state=peek] .roadwarn, #sheet[data-state=high] .roadwarn { display: none; }
    #sheet[data-state=low] .sum-line, #sheet[data-state=mid] .sum-line { display: none; }
    #sheetBody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 20px 16px; line-height: 1.5; }
    #sheet[data-state=peek] #sheetBody, #sheet[data-state=peek] #sheetFoot { display: none; }
    #sheetFoot { flex: none; padding: 12px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--color-border); }
    .foot-row { display: flex; gap: 10px; }
    .gpx { flex: 1; min-width: 0; height: 52px; border-radius: 14px; font-size: 17px; }
    .share { flex: none; width: 52px; height: 52px; border-radius: 14px; border: 1px solid var(--color-border);
             background: var(--color-surface); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .gpx-help { font-size: 14px; line-height: 1.45; background: var(--color-bg); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
    .gpx-help b { font-weight: var(--fw-medium); }
    .gpx-help button { font: inherit; font-size: 13px; background: none; border: 0; padding: 0; margin-left: 6px; color: var(--color-text-2);
                       text-decoration: underline; cursor: pointer; }
    .hint { font-size: 13px; color: var(--color-text-2); margin-top: 6px; text-align: center; }
    .k .qm { font: inherit; font-size: 11px; width: 16px; height: 16px; border-radius: 8px; border: 1px solid var(--color-border);
             background: var(--color-surface); color: var(--color-text-2); padding: 0; margin-left: 4px; cursor: pointer; line-height: 14px; }
    .keys .qm { font: inherit; font-size: 11px; flex: none; width: 22px; height: 22px; border-radius: 11px; padding: 0;
                border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text-2); cursor: pointer; }
    .keys .row-help { margin: 0; padding: 0 0 12px 84px; font-size: 13px; color: var(--color-text-2); line-height: 1.4;
                      border-bottom: 1px solid var(--color-border); }
    .keys div:has(+ .row-help:not([hidden])) { border-bottom: 0; }
    .dplus-help { grid-column: 1 / -1; font-size: 13px; color: var(--color-text-2); margin-top: 6px; }
    #sheetBody small, #sheetBody .sub { color: var(--color-text-2); }
    .badge { display: inline-block; font-size: 13px; background: var(--color-border); color: var(--color-text); padding: 2px 6px; border-radius: 6px; }
    .sec-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; color: var(--color-text-2); }
    /* barre de terrain (charte §13.2 : couleurs terrain réservées à cette barre) et légende en grille 2 × 2 */
    .terrain { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; margin: 8px 0 10px; }
    .terrain span { display: block; height: 100%; min-width: 2px; }
    .terrain-legend { display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; row-gap: 6px; font-size: 14px; }
    .terrain-legend div { display: flex; align-items: center; gap: 8px; }
    .terrain-legend i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
    .terrain-legend span { flex: 1; }
    .terrain-legend b { font-family: var(--font-mono); font-size: 13px; font-weight: var(--fw-regular); }
    /* points clés : repère chiffré à gauche, alerte discrète (triangle argile) pour ce qui demande de la vigilance */
    .keys { border-top: 1px solid var(--color-border); margin-top: 16px; }
    .keys div { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--color-border); font-size: 15px; line-height: 1.35; }
    .keys div:last-child { border-bottom: 0; }
    /* point clé ou montée qui surligne son tronçon sur la carte (maquette 5c) */
    [data-hl] { cursor: pointer; }
    .keys div[data-hl] { margin: 0; }                    /* brief v3 : filet simple, ni coins arrondis ni ombre */
    .keys div.hl-on, .facts li.hl-on { background: var(--color-bg); }
    .keys .onmap { flex: none; font-size: 12px; color: var(--color-text-2); display: flex; align-items: center; gap: 4px; }
    .keys .onmap span { display: none; }
    .keys .hl-on .onmap span { display: inline; }
    .keys .fig { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-2); width: 72px; flex: none; }
    .keys .warn-row .fig { color: var(--color-accent); }
    .keys .txt { flex: 1; }
    .keys svg { flex: none; }
    .pf-block { margin-top: 18px; }
    .pf-head { display: flex; justify-content: space-between; margin-bottom: 6px; }
    #pfRead { font-family: var(--font-mono); font-size: 12px; color: var(--color-text); }
    /* cartes : suggestion (fond chaux) et autres boucles (filet) */
    .tip { background: var(--color-bg); border-radius: 16px; padding: 14px 16px; margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
    .tip p { margin: 0; font-size: 15px; line-height: 1.45; }
    .tip .tip-fig { font-family: var(--font-mono); font-size: 13px; color: var(--color-text); }
    .tip .tip-note { font-size: 13px; color: var(--color-text-2); line-height: 1.4; }
    .tip .btn { align-self: flex-start; font-size: 15px; height: 36px; padding: 0 14px; border-radius: 12px; }
    .vcard { font: inherit; text-align: left; width: 100%; margin-top: 12px; border: 1px solid var(--color-border); border-radius: 16px;
             padding: 14px 16px; display: flex; align-items: center; gap: 12px; background: var(--color-surface); color: var(--color-text); cursor: pointer; }
    .vcard .vc { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .vcard .vs { font-size: 17px; }
    .vcard .vd { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-2); }
    /* dépliants en lignes à chevron */
    .rows { border-top: 1px solid var(--color-border); margin-top: 16px; }
    .rows details { border-bottom: 1px solid var(--color-border); }
    .rows summary { list-style: none; min-height: 48px; display: flex; align-items: center; gap: 12px; font-size: 16px; cursor: pointer; }
    .rows summary::-webkit-details-marker { display: none; }
    .rows summary::after { content: ''; margin-left: auto; margin-right: 4px; width: 7px; height: 7px; flex: none;
                           border-right: 1.6px solid var(--color-text-2); border-bottom: 1.6px solid var(--color-text-2); transform: rotate(-45deg); transition: transform .2s; }
    .rows details[open] summary::after { transform: rotate(45deg); }
    .rows details > :not(summary) { margin-bottom: 12px; }
    .facts { margin: 0 0 8px; }
    .facts .keys { margin-top: 4px; border-top: 0; }
    .facts-h { margin-top: 14px; }
    .facts .climbs { list-style: none; margin: 2px 0 0; padding-left: 0; }   /* détail des montées, sous leur ligne */
    .other-dur { font-size: 15px; padding: 6px 10px; margin: 6px 6px 0 0; }
    .notes { display: block; margin-top: 16px; }
    #legal { padding: 8px 0 0; font-size: 12px; color: var(--color-text-2); }
    #legal a { color: var(--color-text-2); }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="top" class="open">
    <div id="pill" role="button" tabindex="0" aria-expanded="true" aria-controls="settings">
      <svg width="26" height="26" viewBox="0 0 48 48" aria-hidden="true"><path d="M37.86 18.26 A15 15 0 1 1 29.74 10.14" fill="none" stroke="#24221F" stroke-width="5.5" stroke-linecap="round"/><circle cx="29.74" cy="10.14" r="4.5" fill="#A8522F"/></svg>
      <span class="word" aria-label="Oyan">yan</span>
      <span class="sum" id="pillSum"></span>
      <div class="lang-wrap">
        <button type="button" id="langBtn" class="lang-btn" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="lang">
          <span id="langCur"></span><svg width="10" height="10" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="#24221F" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div id="langMenu" class="lang-menu" role="menu" hidden></div>
      </div>
      <button type="button" class="round" aria-label="Afficher ou masquer les réglages" data-i18n-aria="settings_toggle" tabindex="-1">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="#24221F" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="settings">
      <div id="search">
        <div class="field">
          <button id="go" type="button" class="icon-btn" aria-label="Chercher l'adresse" data-i18n-aria="search_btn">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="#625D55" stroke-width="1.5"/><path d="M11 11l3.5 3.5" stroke="#625D55" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <input id="addr" type="search" placeholder="Adresse de départ" enterkeyhint="search" autocomplete="off" aria-label="Adresse de départ" data-i18n-ph="addr_ph" data-i18n-aria="addr_ph">
        </div>
        <button id="me" class="icon-btn" type="button" title="Utiliser ma position" aria-label="Utiliser ma position" data-i18n-title="locate" data-i18n-aria="locate">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="5.5" fill="none" stroke="#24221F" stroke-width="1.5"/><circle cx="10" cy="10" r="2" fill="#24221F"/><path d="M10 1.5v3M10 15.5v3M1.5 10h3M15.5 10h3" stroke="#24221F" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="results"></div>
      <div class="k-label" id="levelLabel" data-i18n="pace">ALLURE</div>
      <div class="seg" id="levelSeg" role="group" aria-labelledby="levelLabel"></div>
      <div id="paceHint" class="hint"></div>
      <div class="k-label" id="durLabel" data-i18n="duration">DURÉE DE LA BOUCLE</div>
      <div class="stepper" role="group" aria-labelledby="durLabel">
        <button type="button" id="durMinus" aria-label="Durée plus courte" data-i18n-aria="dur_minus">−</button>
        <div id="durVal" aria-live="polite"></div>
        <button type="button" id="durPlus" aria-label="Durée plus longue" data-i18n-aria="dur_plus">+</button>
      </div>
      <div id="totalApproach"></div>
      <!-- sélecteurs d'origine, masqués : ils gardent l'état (allure, durée) lu par le reste du code -->
      <select id="level" hidden></select>
      <select id="duration" hidden></select>
      <div id="startRow" class="empty">
        <svg class="dot-on" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="#A8522F" stroke="#FFFFFF" stroke-width="2"/></svg>
        <svg class="dot-off" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="#625D55" stroke-width="1.5" stroke-dasharray="3 3"/></svg>
        <div id="where">Tape une adresse, touche un point sur la carte ou utilise ta position.</div>
        <button type="button" id="change" aria-expanded="false" aria-controls="adv">Choisir dans la liste</button>
      </div>
      <details id="history" hidden><summary id="historySum"></summary><div id="historyList"></div></details>
      <div id="adv" hidden>
        <input id="startFilter" type="search" placeholder="Filtrer : ville, quartier, gare…" aria-label="Filtrer les départs" autocomplete="off" data-i18n-ph="filter_ph" data-i18n-aria="filter_aria">
        <select id="start" aria-label="Départ" data-i18n-aria="start_aria"></select>
      </div>
    </div>
  </div>
  <button type="button" id="locate" aria-label="Utiliser ma position" title="Utiliser ma position" data-i18n-aria="locate" data-i18n-title="locate">
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="5.5" fill="none" stroke="#24221F" stroke-width="1.5"/><circle cx="10" cy="10" r="2" fill="#24221F"/><path d="M10 1.5v3M10 15.5v3M1.5 10h3M15.5 10h3" stroke="#24221F" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
  <div id="sheet" hidden data-state="low">
    <div id="grip">
      <div class="handle"></div>
      <div id="sheetHead"></div>
    </div>
    <div id="sheetBody"></div>
    <div id="sheetFoot">
      <div id="gpxHelp" class="gpx-help" hidden></div>
      <div class="foot-row">
        <button type="button" class="btn btn-accent gpx" data-i18n="gpx" onclick="getGpx()">Télécharger le GPX</button>
        <button type="button" class="share" id="shareBtn" data-i18n-aria="share" data-i18n-title="share" onclick="shareLoop()">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="15" cy="4.5" r="2.2" fill="none" stroke="#24221F" stroke-width="1.5"/><circle cx="15" cy="15.5" r="2.2" fill="none" stroke="#24221F" stroke-width="1.5"/><circle cx="5" cy="10" r="2.2" fill="none" stroke="#24221F" stroke-width="1.5"/><path d="M7 9l6-3.4M7 11l6 3.4" stroke="#24221F" stroke-width="1.5"/></svg>
        </button>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="i18n.js"></script>
  <script src="gpx.js"></script>
  <script src="profile.js"></script>
  <script src="feedback.js"></script>
  <script>
    const optLabel = l => I18N['opt_' + l] ? t('opt_' + l) : l;   // nom d'une option (équilibrée, variante…)
    // brief v2 : jamais « Variante » seul. Nom = différence mesurée la plus nette avec la boucle principale (plus de relief,
    // moins de ville, plus de forêt…), sinon la direction prise (« Par le nord »)
    function optName(o) {
      if (o.label !== 'variante') return optLabel(o.label);
      const m = shown.find(x => x.label === 'equilibre') || shown[0];
      if (!m || m === o) return optLabel(o.label);
      const lc = x => (x.scenery && x.scenery.landcover) || null, a = lc(o), b = lc(m);
      const lpk = x => (x.traffic_lights_per_km == null ? null : x.traffic_lights_per_km);
      const gains = [];                                    // [clé, gain rapporté à son seuil]
      if (a && b) {
        gains.push(['vn_city', (b.city - a.city) / 0.10], ['vn_forest', (a.forest - b.forest) / 0.10],
                   ['vn_water', (a.water - b.water) / 0.08]);
      }
      gains.push(['vn_cycle', (o.shares.dedicated_cycleway - m.shares.dedicated_cycleway) / 0.10],
                 ['vn_main', (m.shares.main_roads - o.shares.main_roads) / 0.10]);
      if (lpk(o) != null && lpk(m) != null) gains.push(['vn_lights', (lpk(m) - lpk(o)) / 0.5]);
      // relief (Florent, 01/10/2026) : souvent la différence qu'on remarque d'abord. Écart de D+ par km rapporté à 3 m/km,
      // et au moins 100 m de D+ d'écart pour ne pas nommer « relief » quelques côtes en plus
      const mpk = x => x.ascend_m / Math.max(1, x.distance_km), dUp = o.ascend_m - m.ascend_m;
      if (Math.abs(dUp) >= 100) gains.push([dUp > 0 ? 'vn_hills' : 'vn_flat', Math.abs(mpk(o) - mpk(m)) / 3]);
      const best = gains.filter(g => g[1] >= 1).sort((x, y) => y[1] - x[1])[0];
      if (best) return t(best[0]);
      // direction : cap du départ vers le centre de la variante, en 8 secteurs
      const c = o.coords, s = c[0];
      const cx = c.reduce((acc, p) => acc + p[0], 0) / c.length, cy = c.reduce((acc, p) => acc + p[1], 0) / c.length;
      const ang = (Math.atan2((cx - s[0]) * Math.cos(s[1] * Math.PI / 180), cy - s[1]) * 180 / Math.PI + 360) % 360;
      const dir = ['nord', 'nord-est', 'est', 'sud-est', 'sud', 'sud-ouest', 'ouest', 'nord-ouest'][Math.round(ang / 45) % 8];
      return t('vd_other', { d: t('dir_' + dir) });
    }
    const EMPTY = { type: 'FeatureCollection', features: [] };
    // couleurs de la carte, reprises de brand/oyan-tokens.css (MapLibre ne lit pas les variables CSS) ;
    // autre boucle = pointillé galet sur liseré blanc, sous la boucle choisie (maquette 5b)
    const ROUTE = { color: '#A8522F', width: 4.5, casing: '#FFFFFF', casingWidth: 8.5,
                    other: '#625D55', otherWidth: 3, start: '#A8522F', user: '#24221F' };

    const BASEMAP_SAT = 0.3;          // part de saturation gardée
    const toGrey = (() => {
      const ctx = document.createElement('canvas').getContext('2d');
      const cache = new Map();
      return str => {
        if (cache.has(str)) return cache.get(str);
        let out = str;
        ctx.fillStyle = '#010203';
        ctx.fillStyle = str;
        const norm = ctx.fillStyle;                      // « #rrggbb » ou « rgba(r, g, b, a) », inchangé si str n'est pas une couleur
        if (norm !== '#010203' || /^#010203$/i.test(str)) {
          let r, g, b, a = 1;
          if (norm[0] === '#') [r, g, b] = [1, 3, 5].map(i => parseInt(norm.slice(i, i + 2), 16));
          else [r, g, b, a] = norm.match(/[\d.]+/g).map(Number);
          const y = 0.299 * r + 0.587 * g + 0.114 * b;      // luminance : on garde la clarté, on retire la couleur
          const m = v => Math.round(y + (v - y) * BASEMAP_SAT);
          out = 'rgba(' + m(r) + ',' + m(g) + ',' + m(b) + ',' + a + ')';
        }
        cache.set(str, out);
        return out;
      };
    })();
    const greyValue = v => typeof v === 'string' ? toGrey(v) : Array.isArray(v) ? v.map(greyValue)
      : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, greyValue(x)])) : v;
    function soberBasemap() {
      const PROPS = { background: ['background-color'], fill: ['fill-color', 'fill-outline-color'], line: ['line-color'],
                      'fill-extrusion': ['fill-extrusion-color'], symbol: ['text-color', 'text-halo-color'], circle: ['circle-color'] };
      for (const l of map.getStyle().layers) {
        for (const prop of PROPS[l.type] || []) {           // une propriété étrangère au type de calque ferait échouer MapLibre
          const v = map.getPaintProperty(l.id, prop);
          if (v != null) map.setPaintProperty(l.id, prop, greyValue(v));
        }
        if (l.type === 'symbol' && l.layout && l.layout['icon-image']) map.setPaintProperty(l.id, 'icon-opacity', 0.55);
      }
    }

    const startSel = document.getElementById('start');
    const levelSel = document.getElementById('level');
    const durSel = document.getElementById('duration');
    const sheet = document.getElementById('sheet');
    const sheetHead = document.getElementById('sheetHead');
    const sheetBody = document.getElementById('sheetBody');
    const sheetFoot = document.getElementById('sheetFoot');
    const topCard = document.getElementById('top');

    // ---------- panneau coulissant (maquette « Oyan App Refonte », étape 5) : quatre hauteurs
    // peek = réglages ouverts (nom et chiffres seulement) ; low = replié (chiffres + GPX) ; mid = mi-hauteur ; high = ouvert
    function sheetHeights() {
      const H = window.innerHeight;
      return { peek: 128, low: Math.min(250, Math.round(H * 0.45)), mid: Math.min(560, Math.round(H * 0.68)), high: H - 120 };
    }
    function setSheetHeight(h) {
      sheet.style.height = h + 'px';
      document.documentElement.style.setProperty('--sheet-h', (sheet.hidden ? 0 : h) + 'px');
    }
    function setSheet(state) {
      sheet.dataset.state = state;
      document.documentElement.dataset.sheet = state;
      setSheetHeight(sheetHeights()[state]);
      if (state !== 'peek' && topCard.classList.contains('open')) setSettings(false);
      if (state === 'low' || state === 'mid') sheetBody.scrollTop = 0;
      fitRoute();                                           // brief v2 : recadrer à chaque changement de cran
    }
    function setSettings(open) {
      topCard.classList.toggle('open', open);
      document.getElementById('pill').setAttribute('aria-expanded', String(open));
      if (open && !sheet.hidden && sheet.dataset.state !== 'peek') setSheet('peek');
      else if (!open && sheet.dataset.state === 'peek') setSheet('low');
    }
    function showSheet() {
      sheet.hidden = false;
      setSheet(topCard.classList.contains('open') ? 'peek' : sheet.dataset.state === 'peek' ? 'low' : sheet.dataset.state);
    }
    // glisser la poignée (ou l'en-tête) : le panneau suit le doigt puis se cale sur la hauteur la plus proche ;
    // un simple toucher fait monter d'un cran (replié -> mi-hauteur -> ouvert -> replié)
    (function bindSheetDrag() {
      const grip = document.getElementById('grip');
      let drag = null, justDragged = false;
      grip.addEventListener('pointerdown', e => {
        if (e.target.closest('button') || !startData) return;  // pastilles = boutons ; sans départ, rien à ouvrir
        drag = { y: e.clientY, h: sheet.getBoundingClientRect().height, moved: false, t: Date.now() };
        grip.setPointerCapture(e.pointerId);                   // le doigt peut sortir de l'en-tête sans perdre le panneau
      });
      grip.addEventListener('pointermove', e => {
        if (!drag) return;
        const dy = drag.y - e.clientY;
        if (!drag.moved && Math.abs(dy) < 6) return;
        if (!drag.moved) { drag.moved = true; sheet.style.transition = 'none'; }
        const hs = sheetHeights();
        setSheetHeight(Math.max(hs.peek, Math.min(hs.high, drag.h + dy)));
      });
      const end = e => {
        if (!drag) return;
        const d = drag; drag = null;
        sheet.style.transition = '';
        if (!d.moved) return;
        justDragged = true; setTimeout(() => { justDragged = false; }, 0);
        const hs = sheetHeights(), h = sheet.getBoundingClientRect().height;
        const v = (d.y - e.clientY) / Math.max(1, Date.now() - d.t);          // px/ms, positif vers le haut
        const order = ['low', 'mid', 'high'];
        let best = order.reduce((a, b) => Math.abs(hs[b] - h) < Math.abs(hs[a] - h) ? b : a);
        if (Math.abs(v) > 0.5) {                                                 // geste rapide : cran suivant dans ce sens
          best = v > 0 ? (order.find(k => hs[k] > h + 1) || 'high')
                       : ([...order].reverse().find(k => hs[k] < h - 1) || 'low');
        }
        setSheet(best);
        fitRoute();
      };
      grip.addEventListener('pointerup', end);
      grip.addEventListener('pointercancel', end);
      grip.addEventListener('click', e => {
        if (justDragged || e.target.closest('button') || !startData) return;
        const next = { peek: 'low', low: 'mid', mid: 'high', high: 'low' }[sheet.dataset.state];
        setSheet(next);
        fitRoute();
      });
      window.addEventListener('resize', () => { if (!sheet.hidden) setSheetHeight(sheetHeights()[sheet.dataset.state]); });
    })();

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [2.19, 41.42],
      zoom: 10,
      attributionControl: false
    });
    // crédits DÉPLIÉS, en bas à gauche (brief v3 : la licence d'OpenStreetMap demande une attribution visible ; repli
    // seulement après l'avis du juriste). Leur hauteur réelle (1 ou 2 lignes selon la largeur) est mesurée : --attr-h
    map.addControl(new maplibregl.AttributionControl({ compact: false }), 'bottom-left');
    function measureAttr() {
      const a = document.querySelector('.maplibregl-ctrl-bottom-left');
      document.documentElement.style.setProperty('--attr-h', (a ? a.offsetHeight : 24) + 'px');
    }
    window.addEventListener('resize', measureAttr);

    let startData = null;
    let shown = [];
    let current = 0;
    let marker = null;
    let indexData = null;

    const km = n => dec(n.toFixed(1));
    function hm(min) {
      const t = Math.round(min);
      return Math.floor(t / 60) + ' h ' + String(t % 60).padStart(2, '0');
    }
    // neutralise le HTML dans un texte (bonne habitude)
    const esc = s => String(s).replace(/[&<>"]/g,
      c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    // ---------- nom d'un départ : « Commune · lieu » (commune OSM, champ municipality du pipeline, O-10.2) ;
    // sans commune (données plus anciennes) : « Ville la plus proche · lieu » pour les départs intermédiaires
    // « (nord) », « (sud-est) »… : suffixes français ajoutés par le pipeline, traduits à l'affichage
    const trName = n => String(n).replace(/\((nord|sud|est|ouest|nord-est|nord-ouest|sud-est|sud-ouest)\)$/, (x, d) => '(' + t('dir_' + d) + ')');
    function startLabel(s) {
      const m = s.municipality;
      if (m && s.kind === 'station') {                 // « Gare Calella » -> « Calella · Gare », « Gare Granollers Centre » -> « Granollers · Gare Centre »
        let rest = s.name.replace(/^Gare\s+/, '');
        if (fold(rest).startsWith(fold(m))) rest = rest.slice(m.length).replace(/^[\s\-–|]+/, '');
        return m + ' · ' + t('station') + (rest ? ' ' + trName(rest) : '');
      }
      if (m) return s.name === m || fold(s.name).includes(fold(m)) ? trName(s.name) : m + ' · ' + trName(s.name);
      const near = /^Près de (.+)$/.exec(s.display_name || '');
      return near ? near[1] + ' · ' + trName(s.name) : trName(s.display_name || s.name);
    }
    const byName = new Intl.Collator('ca', { sensitivity: 'base', numeric: true }).compare;

    // ---------- gare : mention affichée à côté du nom du départ
    const stationNote = kind => kind === 'station'
      ? ' <span class="badge">' + esc(t('station_note')) + '</span>' : '';

    // ---------- pente : catégories qualitatives (jamais de pourcentage affiché)
    // catégorie d'une montée d'après sa pente moyenne (profil lissé à 500 m) ; jamais de pourcentage affiché (D17)
    // raideur d'une montée : selon son kilomètre le plus raide quand le calcul le fournit (générateur 12), sinon sa moyenne
    function climbCategory(c) {
      const pct = c.steepest_km_grade_pct != null ? c.steepest_km_grade_pct : c.avg_grade_pct;
      return t(pct < 3 ? 'climb_soft' : pct < 6 ? 'climb_steady' : 'climb_steep');
    }
    // « catégorie 3, raide » : taille de la montée (catégories des compteurs, générateur 12) puis raideur
    function climbLabel(c) {
      return (c.category ? t('climb_cat_' + c.category) + ', ' : '') + climbCategory(c);
    }
    function slopeCategory(pct) {                          // en minuscules : placée après une virgule
      return t('slope_' + (pct < 2.5 ? 0 : pct < 4 ? 1 : pct < 6 ? 2 : 3));
    }

    // ---------- modèle d'approche (repli si le fichier est absent ou d'une version majeure inconnue)
    const MODEL_MAJOR = 2;
    let model = { zones: {
      dense: { detour_ratio_median: 1.56, detour_ratio_p90: 2.55, speed_kmh_110W_median: 16.45 },
      peri:  { detour_ratio_median: 1.58, detour_ratio_p90: 2.52, speed_kmh_110W_median: 19.57 },
      rural: { detour_ratio_median: 1.69, detour_ratio_p90: 3.69, speed_kmh_110W_median: 18.07 } } };
    let modelOk = true; // false si la version majeure du modèle est inconnue : aucun temps chiffré
    const DMAX_KM = { dense: 1.75, peri: 2.5, rural: 2.5 }; // seuil « à portée », par zone (brief UX)

    // ---------- géographie
    const rad = d => d * Math.PI / 180;
    function crowKm(lon1, lat1, lon2, lat2) {
      const a = Math.sin(rad(lat2 - lat1) / 2) ** 2 +
        Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(rad(lon2 - lon1) / 2) ** 2;
      return 2 * 6371 * Math.asin(Math.sqrt(a));
    }
    function nearestStart(lon, lat) {
      let best = null;
      for (const s of indexData.starts) {
        const d = crowKm(lon, lat, s.lon, s.lat);
        if (!best || d < best.km) best = { s, km: d };
      }
      return best;
    }
    // emprise des départs générés (champ coverage_bbox de l'index, sinon calculée ici) : sert uniquement à cadrer la carte
    // et à limiter la recherche Photon, jamais à décider si une adresse est couverte
    function coverageBox(padDeg) {
      let b = indexData.coverage_bbox;
      if (!b) {
        const xs = indexData.starts.map(s => s.lon), ys = indexData.starts.map(s => s.lat);
        b = [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
      }
      return [b[0] - padDeg, b[1] - padDeg, b[2] + padDeg, b[3] + padDeg];
    }

    // ---------- recherche d'adresse : Photon (Komoot), service public à usage raisonnable
    // Règles respectées : une requête au plus par seconde, déclenchée par le bouton ou la touche Entrée (pas d'autocomplétion),
    // 3 caractères au moins, résultats gardés en mémoire, attribution OpenStreetMap affichée, délai maximum de 8 s.
    const GEO = { url: 'https://photon.komoot.io/api/', last: 0, cache: new Map() };
    const photonLabel = p => [p.name, [p.street, p.housenumber].filter(Boolean).join(' '), p.postcode, p.city]
      .filter((v, i, a) => v && a.indexOf(v) === i).join(', ');
    async function geocode(q) {
      const key = LANG + '|' + q.trim().toLowerCase();
      if (GEO.cache.has(key)) return GEO.cache.get(key);
      const wait = 1100 - (Date.now() - GEO.last);
      if (wait > 0) await new Promise(r => setTimeout(r, wait));
      GEO.last = Date.now();
      const bbox = coverageBox(0.3).map(v => v.toFixed(4)).join(',');
      const res = await fetch(GEO.url + '?q=' + encodeURIComponent(q) + '&limit=5&lang=' + (LANG === 'fr' || LANG === 'en' ? LANG : 'default') + '&bbox=' + bbox,
        { signal: AbortSignal.timeout(8000) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const items = (data.features || []).map(f => ({
        lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], label: photonLabel(f.properties || {})
      }));
      GEO.cache.set(key, items);
      return items;
    }

    const addr = document.getElementById('addr');
    const resultsEl = document.getElementById('results');
    const whereEl = document.getElementById('where');
    let userMarker = null;
    const dotEl = cls => { const d = document.createElement('div'); d.className = cls; return d; };

    async function searchAddress() {
      const q = addr.value.trim();
      if (q.length < 3) { resultsEl.textContent = t('search_min3'); return; }
      resultsEl.textContent = t('searching');
      try {
        const items = await geocode(q);
        if (!items.length) { resultsEl.textContent = t('no_addr'); return; }
        resultsEl.innerHTML = items.map((it, i) =>
          '<button type="button" data-i="' + i + '">' + esc(it.label) + '</button>').join('') +
          '<small id="geoattr">' + esc(t('geo_attr')) + '</small>';
        resultsEl.onclick = e => {
          const b = e.target.closest('button');
          if (!b) return;
          const it = items[Number(b.dataset.i)];
          resultsEl.textContent = '';
          addr.value = it.label;
          setPosition(it.lon, it.lat);
        };
      } catch (err) {
        resultsEl.textContent = t('search_down');
      }
    }

    // ---------- ligne « Départ : … » des réglages : le texte est produit par une fonction, rejouée au changement de langue
    let whereFn = () => esc(t('where_hint')), whereAfter = null;
    function setWhere(fn, after) { whereFn = fn; whereAfter = after || null; renderWhere(); }
    function renderWhere() { whereEl.innerHTML = whereFn(); if (whereAfter) whereAfter(); }
    const startLine = (s, sub) => esc(t('start_prefix')) + ' <b>' + esc(startLabel(s)) + '</b>' + stationNote(s.kind) +
      (sub ? '<div class="w2">' + sub + '</div>' : '');

    // ---------- position de l'utilisateur -> départ le plus proche -> temps d'approche
    let approachMin = null; // temps d'approche connu pour le départ actuellement choisi (null si choisi dans la liste)
    function setPosition(lon, lat) {
      if (userMarker) userMarker.remove();
      userMarker = new maplibregl.Marker({ element: dotEl('mk-user') }).setLngLat([lon, lat]).addTo(map);
      const { s, km } = nearestStart(lon, lat);
      pendingStart = s.id;

      if (!modelOk) {
        approachMin = null;
        setWhere(() => startLine(s, esc(t('approach_na'))));
        chooseStart(s.id);
        return;
      }

      const zoneKey = s.zone && model.zones[s.zone] ? s.zone : 'peri';
      const z = model.zones[zoneKey];
      const speed = z.speed_kmh_110W_median;
      const med = Math.round(km * z.detour_ratio_median / speed * 60);
      const hi = Math.round(km * z.detour_ratio_p90 / speed * 60);
      const portee = Math.round(DMAX_KM[zoneKey] * z.detour_ratio_median / speed * 60);
      const range = () => (zoneKey === 'rural' && hi > med + 3 ? t('range', { hi }) : '');
      const nav = 'https://www.openstreetmap.org/directions?engine=fossgis_osrm_bike&route=' +
        lat.toFixed(5) + '%2C' + lon.toFixed(5) + '%3B' + s.lat.toFixed(5) + '%2C' + s.lon.toFixed(5);
      approachMin = med;

      if (med > 30) {
        setWhere(() => '<span class="warn">' + esc(t('too_far', { min: med, range: range() })) + '</span><br>' + startLine(s) +
          '<br><button type="button" class="btn" id="see">' + esc(t('see_anyway')) + '</button>' +
          ' <a href="' + nav + '" target="_blank" rel="noopener">' + esc(t('route')) + '</a>',
          () => { document.getElementById('see').onclick = () => chooseStart(s.id); });
        map.fitBounds(new maplibregl.LngLatBounds([lon, lat], [s.lon, s.lat]), { padding: 60, duration: 500 });
        return;
      }
      setWhere(() => startLine(s, (med > portee ? '<span class="warn">' + esc(t('bit_far')) + '</span>' : '') +
        esc(t('approach', { min: med, range: range() })) +
        (med > portee ? ' · <a href="' + nav + '" target="_blank" rel="noopener">' + esc(t('route')) + '</a>' : '')));
      chooseStart(s.id);
    }
    let pendingStart = null;
    function chooseStart(id) {
      if (![...startSel.options].some(o => o.value === id)) { startFilter.value = ''; fillStarts(); } // départ masqué par le filtre
      startSel.value = id; loadStart();
    }

    // ---------- liste des départs, filtrée par le texte tapé (sans tenir compte des accents ni des majuscules)
    const startFilter = document.getElementById('startFilter');
    const fold = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    let startItems = []; // [libellé, id, texte de recherche, clé de tri], triés par commune puis par libellé
    function fillStarts() {
      const words = fold(startFilter.value).split(/\s+/).filter(Boolean);
      const keep = startItems.filter(it => words.every(w => it[2].includes(w)));
      const current = startSel.value;
      startSel.textContent = '';
      startSel.add(new Option(keep.length ? tn('starts', keep.length) : t('starts_none'), ''));
      keep.forEach(([label, id]) => startSel.add(new Option(label, id)));
      startSel.value = keep.some(it => it[1] === current) ? current : '';
    }

    async function init() {
      const [index] = await Promise.all([
        fetch('web/data/index.json').then(r => r.json()),
        new Promise(ok => map.once('load', ok))
      ]);
      indexData = index;
      try {
        const m = await fetch('web/approach_model.json');
        if (m.ok) {
          const data = await m.json();
          const major = Number(String(data.version || '').split('.')[0]);
          if (major === MODEL_MAJOR) model = data;
          else modelOk = false; // version majeure inconnue : on ignore ce fichier, aucun temps chiffré
        }
      } catch (e) { /* réseau indisponible : on garde le repli */ }
      buildStartItems();
      startFilter.oninput = fillStarts;
      Object.keys(index.levels).forEach(k => levelSel.add(new Option(t('lvl_' + k), k)));
      levelSel.value = 'modere';
      index.durations_h.forEach(h => durSel.add(new Option(hm(h * 60), h)));
      durSel.value = '2';
      // allure en 3 segments et durée en − / + : ils pilotent les sélecteurs masqués
      const seg = document.getElementById('levelSeg');
      buildLevelSeg();
      seg.onclick = e => {
        const b = e.target.closest('button');
        if (b && b.dataset.v !== levelSel.value) { levelSel.value = b.dataset.v; showLevel(); }
      };
      const stepDur = dir => {
        const i = durSel.selectedIndex + dir;
        if (i >= 0 && i < durSel.options.length) { durSel.selectedIndex = i; showLevel(); }
      };
      document.getElementById('durMinus').onclick = () => stepDur(-1);
      document.getElementById('durPlus').onclick = () => stepDur(1);
      document.getElementById('change').onclick = () => setAdv(document.getElementById('adv').hidden);
      updatePill();

      // tracé Oyan : boucle choisie en argile avec liseré blanc, les autres en galet ; le tout sous les noms de lieux
      map.addSource('routes', { type: 'geojson', data: EMPTY });
      const labels = map.getStyle().layers.find(l => l.type === 'symbol');
      const beforeId = labels ? labels.id : undefined;
      // départs disponibles : points galet à contour blanc (9 px au zoom de quartier), plus petits en vue d'ensemble
      map.addSource('starts', { type: 'geojson', data: { type: 'FeatureCollection', features: index.starts.map(s =>
        ({ type: 'Feature', properties: { id: s.id }, geometry: { type: 'Point', coordinates: [s.lon, s.lat] } })) } });
      map.addLayer({ id: 'starts-pts', type: 'circle', source: 'starts', minzoom: 10, paint: {   // panel : vue large encombrée
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 8, 1.8, 11, 3, 13, 4.5, 16, 6],
        'circle-color': ROUTE.other, 'circle-stroke-color': '#FFFFFF',
        'circle-stroke-width': ['interpolate', ['linear'], ['zoom'], 8, 0.6, 12, 1.5] } }, beforeId);
      const lineLayout = { 'line-cap': 'round', 'line-join': 'round' };
      const isSel = ['get', 'selected'];
      soberBasemap();
      mapLang();
      map.addLayer({ id: 'routes-other-casing', type: 'line', source: 'routes', filter: ['!', isSel], layout: lineLayout,
        paint: { 'line-color': ROUTE.casing, 'line-width': 6 } }, beforeId);
      map.addLayer({ id: 'routes-other', type: 'line', source: 'routes', filter: ['!', isSel], layout: { 'line-join': 'round' },
        paint: { 'line-color': ROUTE.other, 'line-width': ROUTE.otherWidth, 'line-dasharray': [2, 1.7] } }, beforeId);
      map.addLayer({ id: 'routes-casing', type: 'line', source: 'routes', filter: isSel, layout: lineLayout,
        paint: { 'line-color': ROUTE.casing, 'line-width': ROUTE.casingWidth } }, beforeId);
      map.addLayer({ id: 'routes', type: 'line', source: 'routes', filter: isSel, layout: lineLayout,
        paint: { 'line-color': ROUTE.color, 'line-width': ROUTE.width } }, beforeId);
      // services (eau, cafés, gares), brief v3 : couches SOUS le tracé ; points pleins de 10 px sous le zoom 13, pastilles
      // de 22 px à pictogramme au-delà ; marqueurs proches regroupés en une pastille chiffrée galet (la toucher zoome)
      map.addSource('pois', { type: 'geojson', data: EMPTY, cluster: true, clusterRadius: 26, clusterMaxZoom: 15 });
      const unclustered = ['!', ['has', 'point_count']];
      map.addLayer({ id: 'poi-dots', type: 'circle', source: 'pois', filter: unclustered, maxzoom: 13, paint: {
        'circle-radius': 6, 'circle-color': ['match', ['get', 't'], 'w', '#3F7391', 'c', '#9C7A45', '#625D55'],
        'circle-stroke-color': '#FFFFFF', 'circle-stroke-width': 1.5 } }, 'routes-other-casing');
      map.addLayer({ id: 'poi-icons', type: 'symbol', source: 'pois', filter: unclustered, minzoom: 13,
        layout: { 'icon-image': ['concat', 'oyan-poi-', ['get', 't']], 'icon-allow-overlap': true } }, 'routes-other-casing');
      map.addLayer({ id: 'poi-clusters', type: 'circle', source: 'pois', filter: ['has', 'point_count'], paint: {
        'circle-radius': 10, 'circle-color': '#625D55', 'circle-stroke-color': '#FFFFFF', 'circle-stroke-width': 1.5 } }, 'routes-other-casing');
      map.addLayer({ id: 'poi-count', type: 'symbol', source: 'pois', filter: ['has', 'point_count'],
        layout: { 'text-field': ['get', 'point_count_abbreviated'], 'text-font': ['Noto Sans Bold'], 'text-size': 11,
                  'text-allow-overlap': true, 'text-ignore-placement': true },
        paint: { 'text-color': '#FFFFFF' } }, 'routes-other-casing');
      Object.entries(POI_ICON).forEach(([k, svg]) => {         // pastilles 22 px (dessinées en 44 px : écrans haute densité)
        const img = new Image(44, 44);
        img.onload = () => { if (!map.hasImage('oyan-poi-' + k)) map.addImage('oyan-poi-' + k, img, { pixelRatio: 2 }); };
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="44" ' +
          'height="44" viewBox="0 0 22 22"><circle cx="11" cy="11" r="10.4" fill="#FFFFFF" stroke="#E6E2DB" stroke-width="1"/>' +
          '<g transform="translate(4 4)">' + svg + '</g></svg>');
      });
      measureAttr();
      // flèches de sens sur la boucle choisie : chevron argile sur pastille blanche, orienté selon le tracé
      const arrow = document.createElement('canvas');
      arrow.width = arrow.height = 28;
      const ac = arrow.getContext('2d');
      ac.fillStyle = '#FFFFFF'; ac.beginPath(); ac.arc(14, 14, 14, 0, 2 * Math.PI); ac.fill();
      ac.strokeStyle = ROUTE.color; ac.lineWidth = 3.6; ac.lineCap = 'round'; ac.lineJoin = 'round';
      ac.beginPath(); ac.moveTo(11, 8); ac.lineTo(18, 14); ac.lineTo(11, 20); ac.stroke();
      map.addImage('oyan-arrow', ac.getImageData(0, 0, 28, 28), { pixelRatio: 2 });
      // tronçon surligné depuis un point clé : couleur de la barre de terrain (montées : basalte), sur liseré blanc
      map.addSource('hl', { type: 'geojson', data: EMPTY });
      map.addLayer({ id: 'hl-casing', type: 'line', source: 'hl', layout: lineLayout,
        paint: { 'line-color': ROUTE.casing, 'line-width': 13 } });
      map.addLayer({ id: 'hl', type: 'line', source: 'hl', layout: lineLayout,
        paint: { 'line-color': ROUTE.color, 'line-width': 8 } });
      map.addLayer({ id: 'routes-arrows', type: 'symbol', source: 'routes', filter: isSel,
        layout: { 'symbol-placement': 'line', 'symbol-spacing': 160, 'icon-image': 'oyan-arrow',
                  'icon-rotation-alignment': 'map', 'icon-allow-overlap': true, 'icon-ignore-placement': true } });
      // zone de toucher invisible et large sur l'autre boucle : la toucher l'échange avec la boucle affichée
      map.addLayer({ id: 'routes-hit', type: 'line', source: 'routes', filter: ['!', isSel],
        paint: { 'line-color': '#000', 'line-opacity': 0, 'line-width': 22 } });
      // point de la carte qui suit le doigt sur le profil altimétrique
      map.addSource('cursor', { type: 'geojson', data: EMPTY });
      map.addLayer({ id: 'cursor', type: 'circle', source: 'cursor',
        paint: { 'circle-radius': 6, 'circle-color': ROUTE.user, 'circle-stroke-color': ROUTE.casing, 'circle-stroke-width': 2.5 } });

      document.getElementById('pill').onclick = () => setSettings(!topCard.classList.contains('open'));
      document.getElementById('pill').onkeydown = e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSettings(!topCard.classList.contains('open')); }
      };
      startSel.onchange = () => {
        if (!startSel.value) return; // ligne « N départs : choisir… »
        const entry = indexData.starts.find(x => x.id === startSel.value);
        setWhere(() => startLine(entry, esc(t('chosen_list'))));
        setAdv(false);
        approachMin = null; loadStart();
      };
      sheetHead.onclick = e => {                          // pastille d'une autre boucle : elle devient la boucle affichée
        const b = e.target.closest('.alt');
        if (b) select(Number(b.dataset.i));
      };
      sheetBody.addEventListener('click', e => {          // carte d'une autre boucle (bas du panneau) : idem
        const b = e.target.closest('.vcard');
        if (b) select(Number(b.dataset.i));
        const h = e.target.closest('[data-hl]');             // point clé ou montée : surligner le tronçon
        if (h) toggleHighlight(h);
      });
      sheetBody.addEventListener('keydown', e => {
        const h = e.target.closest('[data-hl]');
        if (h && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleHighlight(h); }
      });
      document.getElementById('go').onclick = searchAddress;
      addr.onkeydown = e => { if (e.key === 'Enter') searchAddress(); };
      const locate = () => {
        if (!navigator.geolocation) { setSettings(true); setWhere(() => esc(t('geo_unavail'))); return; }
        setWhere(() => esc(t('locating')));
        navigator.geolocation.getCurrentPosition(
          p => { addr.value = ''; setPosition(p.coords.longitude, p.coords.latitude); },
          () => { setSettings(true); setWhere(() => esc(t('geo_denied'))); },
          { enableHighAccuracy: true, timeout: 15000 });
      };
      document.getElementById('me').onclick = locate;
      document.getElementById('locate').onclick = locate;
      map.on('click', e => {
        if (hlKey) { clearHighlight(); return; }              // premier toucher : efface le tronçon surligné, rien d'autre
        const p = e.point, box = [[p.x - 8, p.y - 8], [p.x + 8, p.y + 8]];
        const cl = map.queryRenderedFeatures(box, { layers: ['poi-clusters'] });
        if (cl.length) {                                      // pastille chiffrée : zoom sur les services regroupés
          map.getSource('pois').getClusterExpansionZoom(cl[0].properties.cluster_id)
            .then(z => map.easeTo({ center: cl[0].geometry.coordinates, zoom: z }));
          return;
        }
        const po = map.queryRenderedFeatures(box, { layers: ['poi-dots', 'poi-icons'] });
        if (po.length) {                                      // un service : son nom et son km
          new maplibregl.Popup({ closeButton: false, offset: 10 }).setLngLat(po[0].geometry.coordinates)
            .setText(po[0].properties.label).addTo(map);
          return;
        }
        const hit = map.queryRenderedFeatures(box, { layers: ['routes-hit'] });
        if (hit.length) { select(hit[0].properties.k); return; }   // toucher l'autre boucle : échange
        const st = map.queryRenderedFeatures(box, { layers: ['starts-pts'] });
        if (st.length) {                                      // toucher un point de départ : il devient le départ
          const s = indexData.starts.find(x => x.id === st[0].properties.id);
          addr.value = ''; approachMin = null;
          setWhere(() => startLine(s, esc(t('chosen_map'))));
          chooseStart(s.id);
          return;
        }
        addr.value = ''; setPosition(e.lngLat.lng, e.lngLat.lat);
      });
      map.on('mouseenter', 'starts-pts', () => { map.getCanvas().style.cursor = 'pointer'; });
      ['poi-dots', 'poi-icons', 'poi-clusters'].forEach(l => {
        map.on('mouseenter', l, () => { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', l, () => { map.getCanvas().style.cursor = ''; });
      });
      map.on('mouseleave', 'starts-pts', () => { map.getCanvas().style.cursor = ''; });
      map.on('moveend', placeAltLabels);                  // étiquettes des autres boucles : recalculées après chaque déplacement
      map.on('mouseenter', 'routes-hit', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'routes-hit', () => { map.getCanvas().style.cursor = ''; });
      const b = coverageBox(0.02);
      map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: 10, duration: 0 });
      showEmptySheet();
      setAdv(false);
      renderHistory();
      restoreLoop();                                        // lien partagé ou derniers réglages de l'appareil
    }
    // panneau sans départ choisi (brief v2) : « Choisis un départ pour voir la boucle. »
    function showEmptySheet() {
      sheetHead.innerHTML = '<div class="empty-msg">' + esc(t('empty_sheet')) + '</div>';
      sheetBody.textContent = '';
      sheetFoot.hidden = true;
      sheet.hidden = false;
      setSheet(topCard.classList.contains('open') ? 'peek' : 'low');
    }

    // libellés triés de la liste des départs (dans la langue choisie)
    function buildStartItems() {
      startItems = indexData.starts.map(s => {
        const label = startLabel(s);
        return [label, s.id, fold((s.municipality || '') + ' ' + label), s.municipality || label];
      }).sort((a, b) => byName(a[3], b[3]) || byName(a[0], b[0]));
      fillStarts();
    }
    function buildLevelSeg() {
      [...levelSel.options].forEach(o => { o.text = t('lvl_' + o.value); });
      document.getElementById('levelSeg').innerHTML = [...levelSel.options].map(o =>
        '<button type="button" data-v="' + o.value + '">' + esc(o.text) + '</button>').join('');
    }

    // ---------- langue : menu dans la barre des réglages ; au changement, tout ce qui est affiché est refait
    function buildLangMenu() {
      document.getElementById('langCur').textContent = LANG.toUpperCase();
      document.getElementById('langMenu').innerHTML = ['ca', 'es', 'fr', 'en'].map(l =>
        '<button type="button" role="menuitemradio" lang="' + l + '" data-l="' + l + '" aria-checked="' + (l === LANG) + '">' +
        LANG_NAMES[l] + '</button>').join('');
    }
    function toggleLangMenu(open) {
      const menu = document.getElementById('langMenu');
      menu.hidden = !open;
      document.getElementById('langBtn').setAttribute('aria-expanded', String(open));
    }
    (function bindLang() {
      const btn = document.getElementById('langBtn'), menu = document.getElementById('langMenu');
      btn.addEventListener('click', e => { e.stopPropagation(); toggleLangMenu(menu.hidden); });
      menu.addEventListener('click', e => {
        e.stopPropagation();
        const b = e.target.closest('button[data-l]');
        if (b) { toggleLangMenu(false); setLang(b.dataset.l); }
      });
      document.addEventListener('click', () => toggleLangMenu(false));
      buildLangMenu();
      applyStaticI18n();
      renderWhere();
    })();
    document.addEventListener('langchange', () => {
      buildLangMenu();
      if (!indexData) return;
      buildLevelSeg();
      buildStartItems();
      renderWhere();
      resultsEl.textContent = '';
      setAdv(!document.getElementById('adv').hidden);
      mapLang();
      renderHistory();
      if (shown.length) select(current); else if (startData) showLevel(); else showEmptySheet();
      updatePill();
    });
    // noms de lieux de la carte dans la langue choisie (OpenStreetMap « name:xx »), sinon le nom local
    let nameLayers = null;
    function mapLang() {
      if (!nameLayers) nameLayers = map.getStyle().layers.filter(l => l.type === 'symbol' && l.layout &&
        JSON.stringify(l.layout['text-field'] || '').includes('name')).map(l => l.id);
      nameLayers.forEach(id => map.setLayoutProperty(id, 'text-field', ['coalesce', ['get', 'name:' + LANG], ['get', 'name']]));
    }

    // liste des départs, dépliée par « Changer »
    function setAdv(open) {
      document.getElementById('adv').hidden = !open;
      document.getElementById('change').setAttribute('aria-expanded', String(open));
      document.getElementById('change').textContent = t(open ? 'close' : startData ? 'change' : 'pick_list');
      document.getElementById('startRow').classList.toggle('empty', !startData);
      if (open) startFilter.focus();
    }

    // barre repliée des réglages : « Gràcia · Modéré · 2 h 00 » ; met aussi à jour les segments et la durée affichée
    function updatePill() {
      updatePaceHint();
      document.querySelectorAll('#levelSeg button').forEach(b =>
        b.setAttribute('aria-pressed', String(b.dataset.v === levelSel.value)));
      document.getElementById('durVal').textContent = hm(Number(durSel.value) * 60);
      document.getElementById('durMinus').disabled = durSel.selectedIndex <= 0;
      document.getElementById('durPlus').disabled = durSel.selectedIndex >= durSel.options.length - 1;
      const s = startData && indexData.starts.find(x => x.id === startData.start.id);
      const name = s ? (s.kind === 'station' ? startLabel(s) : trName(s.name)) : t('choose_start');
      const lvl = levelSel.options[levelSel.selectedIndex];
      document.getElementById('pillSum').innerHTML = esc(name) + ' <i>·</i> ' + esc(lvl ? lvl.text : '') +
        ' <i>·</i> ' + hm(Number(durSel.value) * 60);
    }

    async function loadStart() {
      sheetHead.textContent = '';
      sheetBody.textContent = t('loading');
      showSheet();
      const res = await fetch('web/data/starts/' + startSel.value + '.json');
      if (!res.ok) {                                        // on n'affiche pas la boucle du départ précédent
        sheetBody.textContent = t('load_error', { s: res.status });
        startData = null; shown = []; sheetFoot.hidden = true; updatePill(); setAdv(false);
        map.getSource('routes').setData(EMPTY);
        altMarkers.forEach(m => m.marker.remove()); altMarkers = [];
        poiMarkers(null);
        return;
      }
      startData = await res.json();
      if (marker) marker.remove();
      marker = new maplibregl.Marker({ element: dotEl('mk-start') })
        .setLngLat([startData.start.lon, startData.start.lat]).addTo(map);
      setSettings(false);                                   // départ trouvé : on replie les réglages et on montre la boucle
      setAdv(false);
      showLevel();
    }

    function showLevel() {
      updatePill();
      if (!startData) return;
      shown = startData.options.filter(o => o.level === levelSel.value &&
        (o.duration_target_min == null ||
         Math.round(o.duration_target_min) === Math.round(Number(durSel.value) * 60)));
      // option secondaire trop faible (note < 70 % de la boucle recommandée) : masquée (Gràcia 2 h modéré, 30/09/2026 :
      // « Plus de pistes » notée 22 contre 52, proposée pour ses pistes cyclables malgré feux, ville et zone portuaire)
      if (shown.length > 1 && shown[0].score != null)
        shown = shown.filter((o, k) => k === 0 || o.score == null || o.score >= 0.7 * shown[0].score);
      if (!shown.length) {
        const avail = [...new Set(startData.options.filter(o => o.level === levelSel.value)
          .map(o => Math.round(o.duration_target_min)))].sort((a, b) => a - b);
        sheetHead.innerHTML = '<div class="head-row"><span class="opt-label">' + esc(t('no_loop_label')) + '</span></div>';
        sheetFoot.hidden = true;
        sheetBody.innerHTML = esc(t('no_loop', { d: hm(Number(durSel.value) * 60), lvl: levelSel.options[levelSel.selectedIndex].text })) +
          (avail.length ? '<br>' + esc(t('other_dur')) + avail.map(m =>
            '<button type="button" class="btn other-dur" data-min="' + m + '">' +
            hm(m) + '</button>').join('') : '<br>' + esc(t('try_level')));
        sheetBody.querySelectorAll('button[data-min]').forEach(b => {
          b.onclick = () => { durSel.value = String(Number(b.dataset.min) / 60); showLevel(); };
        });
        map.getSource('routes').setData(EMPTY);
        map.getSource('cursor').setData(EMPTY);
        altMarkers.forEach(m => m.marker.remove()); altMarkers = [];
        poiMarkers(null);
        clearHighlight();
        return;
      }
      const w = wantedOption ? shown.findIndex(o => o.label === wantedOption) : -1;   // option demandée par un lien
      wantedOption = null;
      const i = w >= 0 ? w : shown.findIndex(o => o.label === 'equilibre');
      select(i >= 0 ? i : 0);
    }

    // ---------- O-14 : départ voisin qui sort plus vite de la ville (même durée, même niveau), quand la boucle reste en
    // ville ou n'en sort qu'après 5 km. Critère : km de sortie de la zone dense (bloc compare de index.json), pas le % de
    // bâti, pour rester cohérent avec « Sort de la ville après X km » affiché sur la fiche.
    const NEIGHBOUR_MAX_MIN = 25;      // approche maximale d'un départ à l'autre (l'app juge « trop loin » au-delà de 30)
    const NEIGHBOUR_GAIN_KM = 3;       // la boucle voisine doit sortir de la ville au moins 3 km plus tôt
    const CLIMB_M_PER_H = 400;         // montée à allure d'approche (~110 W, 85 kg) : environ 400 m de dénivelé par heure
    function approachBetween(a, b) {   // même modèle que depuis une adresse (setPosition), plus la montée entre les deux départs
      if (a.alt_m == null || b.alt_m == null) return Infinity;   // altitude inconnue : pas de temps honnête, pas de suggestion
      const z = model.zones[b.zone] || model.zones.peri;
      const flat = crowKm(a.lon, a.lat, b.lon, b.lat) * z.detour_ratio_median / z.speed_kmh_110W_median * 60;
      return Math.max(flat, Math.max(0, b.alt_m - a.alt_m) / CLIMB_M_PER_H * 60);
    }
    // sortie de ville d'une boucle, en km (null = reste en ville) : mesurée par le bâti comme la barre de terrain
    // (exit_city_km, premier tronçon d'au moins 1 km sans bâti dense) ; données plus anciennes : densité GraphHopper
    function exitKm(o) {
      if ('exit_city_km' in o) return o.exit_city_km;
      const ex = o.exit_dense_km;
      return ex == null || ex >= o.distance_km - 0.05 ? null : ex;
    }
    const compareExit = c => 'exit_city_km' in c ? c.exit_city_km : c.exit_dense_km;   // bloc compare : null = reste en ville
    function natureNeighbour(o) {
      lastNeighbourId = null;
      if (!modelOk || o.duration_target_min == null) return '';
      const cur = indexData.starts.find(s => s.id === startSel.value);
      if (!cur) return '';
      const ex = exitKm(o), stays = ex == null;
      if (!stays && ex <= 5) return '';
      const curExit = stays ? Infinity : ex;
      const dur = String(Math.round(o.duration_target_min) / 60);   // clés du bloc compare : "0.75", "1", "1.5"…
      let best = null;
      for (const s of indexData.starts) {
        const c = s.compare && s.compare[dur] && s.compare[dur][o.level];
        const cx = c ? compareExit(c) : null;
        if (s.id === cur.id || cx == null || cx > curExit - NEIGHBOUR_GAIN_KM) continue;
        const min = approachBetween(cur, s);
        if (min > NEIGHBOUR_MAX_MIN) continue;
        if (!best || cx < best.exit || (cx === best.exit && min < best.min)) {
          best = { s, min: Math.round(min), exit: cx };
        }
      }
      lastNeighbourId = best ? best.s.id : null;
      if (!best) return '';
      return '<div class="tip"><div class="sec-label">' + esc(t('tip_nature')) + '</div><p>' +
        t('tip_nature_txt', { name: esc(startLabel(best.s)), min: best.min, dur: hm(o.duration_target_min),
          exit: esc(best.exit === 0 ? t('exit0') : t('exitX', { km: km(best.exit) })) }) +
        '</p><button type="button" class="btn" onclick="goNeighbour(\'' + best.s.id + '\', ' + best.min + ')">' +
        esc(t('go_from', { name: trName(best.s.name) })) + '</button></div>';
    }
    // ---------- panel 30/09/2026 : depuis le centre-ville, suggérer un départ en gare (on y va en train, vélo compris) dont
    // la boucle de même durée et même allure est nettement meilleure (note, feux, sortie de ville : bloc compare de l'index)
    const TRAIN_MAX_KM = 30;             // gare à 30 km au plus (à vol d'oiseau) du départ actuel
    const TRAIN_SCORE_GAIN = 10;         // boucle notée au moins 10 points de plus
    function trainStart(o) {
      if (o.duration_target_min == null || !indexData) return '';
      const cur = indexData.starts.find(s => s.id === startSel.value);
      if (!cur || cur.kind === 'station') return '';
      const ex = exitKm(o), lights = o.traffic_lights_per_km || 0;
      if (cur.zone !== 'dense' && ex != null && ex <= 5 && lights < 2.5) return '';   // départ déjà hors de la ville
      const dur = String(Math.round(o.duration_target_min) / 60);
      let best = null;
      for (const s of indexData.starts) {
        if (s.kind !== 'station' || s.id === cur.id || s.id === lastNeighbourId) continue;
        const c = s.compare && s.compare[dur] && s.compare[dur][o.level];
        if (!c || c.score == null || o.score == null || c.score < o.score + TRAIN_SCORE_GAIN) continue;
        if ((c.lights_per_km || 0) > lights) continue;
        const d = crowKm(cur.lon, cur.lat, s.lon, s.lat);
        if (d > TRAIN_MAX_KM) continue;
        if (!best || c.score > best.c.score || (c.score === best.c.score && d < best.d)) best = { s, c, d };
      }
      if (!best) return '';
      const cx = compareExit(best.c);                    // brief v3 : chiffres en mono, phrase courte, note en galet
      return '<div class="tip"><div class="sec-label">' + esc(t('tip_train')) + '</div>' +
        '<div class="tip-fig">' + esc(t('tip_train_fig', { km: km(best.d), l1: km1(best.c.lights_per_km || 0), l0: km1(lights),
          exit: cx == null ? t('train_stays') : cx === 0 ? t('train_exit0') : t('train_exit', { km: km(cx) }) })) + '</div>' +
        '<p>' + t('tip_train_txt2', { name: esc(startLabel(best.s)), dur: hm(o.duration_target_min) }) + '</p>' +
        '<small class="tip-note">' + esc(t('tip_train_note')) + '</small>' +
        '<button type="button" class="btn" onclick="goTrain(\'' + best.s.id + '\')">' + esc(t('go_from', { name: trName(best.s.name) })) +
        '</button></div>';
    }
    function goTrain(id) {
      const s = indexData.starts.find(x => x.id === id);
      setWhere(() => startLine(s, esc(t('train_where'))));
      approachMin = null;                               // trajet en train : pas de temps d'approche chiffré
      chooseStart(id);
    }
    let lastNeighbourId = null;                          // départ déjà proposé par natureNeighbour (pas de doublon)
    function goNeighbour(id, min) {
      const s = indexData.starts.find(x => x.id === id);
      setWhere(() => startLine(s, esc(t('neighbour_where', { min }))));
      approachMin = null;                               // la position de l'utilisateur n'est pas connue ici : pas de total chiffré
      chooseStart(id);
    }

    // change pour la durée disponible suivante, sans changer le niveau (bouton "Essayer plus long")
    function nextDuration() {
      const durs = indexData.durations_h.map(Number).sort((a, b) => a - b);
      const next = durs.find(d => d > Number(durSel.value));
      if (next != null) { durSel.value = String(next); showLevel(); }
    }

    // ---------- O-9.5 : pitch au ton Oyan (brand.md §8), construit ici à partir des mêmes mesures que le pitch du
    // pipeline (o.pitch, gardé dans les données) : 3 phrases au plus, tout le reste dans « Tous les chiffres ».
    const pc = f => pctStr(Math.round(f * 100));
    const km1 = n => dec((Math.round(n * 10) / 10).toFixed(1));
    function reliefCategory(per100) {                       // mêmes seuils que relief_category() du pipeline
      return t('relief_' + (per100 < 500 ? 0 : per100 < 1000 ? 1 : per100 < 1600 ? 2 : 3));
    }
    // points clés : [repère chiffré, phrase, alerte ?] ; forêt et eau reprennent les pourcentages de la barre de terrain
    // (même mesure), pour que la barre et les phrases ne se contredisent pas (maquette 5c)
    function keyPoints(o) {
      const out = [];
      if (o.same_as) {                                     // O-18 : aucune autre boucle que celle de l'allure inférieure
        const name = t('lvl_' + o.same_as.level).toLowerCase();
        out.push(['', (o.same_as.km_more >= 0.5 ? t('same_as_more', { lvl: name, km: km1(o.same_as.km_more) })
          : t('same_as', { lvl: name })) + t('same_as_tail')]);
