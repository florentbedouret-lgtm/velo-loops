<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>velo-loops</title>
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <link href="brand/oyan-tokens.css" rel="stylesheet">
  <style>
    /* couleurs : uniquement les variables de brand/oyan-tokens.css ; l'argile est réservée au tracé et au bouton GPX */
    html, body { margin: 0; }
    body { height: 100dvh; display: flex; flex-direction: column; font-family: var(--font-sans);
           background: var(--color-bg); color: var(--color-text); }
    a { color: var(--color-text); }
    input, select { font: inherit; font-size: 16px; padding: 8px; color: var(--color-text); background: var(--color-surface);
                    border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
    .btn { font: inherit; font-size: 16px; padding: 8px 12px; border-radius: var(--radius-sm); cursor: pointer;
           background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-text); }
    .btn-accent { background: var(--color-accent); color: var(--color-on-accent); border-color: var(--color-accent); }
    #search { display: flex; gap: 6px; padding: 8px 8px 0; }
    #addr { flex: 1; min-width: 0; }
    #results { padding: 0 8px; }
    #results button { display: block; width: 100%; text-align: left; font: inherit; font-size: 15px; padding: 8px; margin-top: 4px;
                      color: var(--color-text); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); }
    #geoattr { display: block; color: var(--color-text-2); padding: 4px 8px 0; }
    #controls { display: flex; gap: 8px; padding: 8px; }
    #controls select { flex: 1; min-width: 0; }
    #durlabel { padding: 0 8px; font-size: 13px; color: var(--color-text-2); }
    #totalApproach { padding: 0 8px 6px; font-size: 14px; color: var(--color-text-2); }
    #where { padding: 0 8px 6px; line-height: 1.4; }
    #where .btn { font-size: 15px; padding: 6px 10px; margin: 4px 6px 0 0; }
    .warn { font-weight: 500; }
    .warn::before { content: '⚠️ '; }
    #adv { padding: 0 8px 6px; }
    #adv select { width: 100%; margin-top: 6px; }
    #map { flex: 0 0 38%; }
    #list { flex: 1; overflow: auto; padding: 8px; }
    .card { background: var(--color-surface); border: 2px solid var(--color-border); border-radius: var(--radius-md);
            padding: 10px; margin-bottom: 8px; line-height: 1.5; }
    .card.active { border-color: var(--color-text); }
    .card small { color: var(--color-text-2); }
    .pitch { margin: 8px 0; padding-left: 18px; }
    .facts, .climbs { font-size: 14px; }
    .climbs { margin: 6px 0; padding-left: 18px; }
    .badge { display: inline-block; font-size: 13px; background: var(--color-border); color: var(--color-text); padding: 2px 6px; border-radius: 6px; }
    .city { font-size: 14px; margin: 6px 0; }
    .city .btn { font-size: 14px; padding: 4px 8px; }
    .other-dur { font-size: 15px; padding: 6px 10px; margin: 6px 6px 0 0; }
    .gpx { margin: 8px 0; padding: 10px 14px; }
    #legal { padding: 0 8px 4px; font-size: 12px; color: var(--color-text-2); }
    #legal a { color: var(--color-text-2); }
  </style>
</head>
<body>
  <div id="search">
    <input id="addr" type="search" placeholder="Adresse de départ (rue, ville…)" enterkeyhint="search" autocomplete="off">
    <button id="go" class="btn" type="button">Chercher</button>
    <button id="me" class="btn" type="button" title="Utiliser ma position" aria-label="Utiliser ma position">📍</button>
  </div>
  <div id="results"></div>
  <div id="controls">
    <select id="level"></select>
    <select id="duration" aria-label="Durée de la boucle"></select>
  </div>
  <div id="durlabel">Durée de la boucle</div>
  <div id="totalApproach"></div>
  <div id="where">Saisissez une adresse, touchez la carte ou utilisez votre position.</div>
  <details id="adv"><summary>Choisir un départ dans la liste</summary><select id="start"></select></details>
  <div id="legal">Parcours indicatifs, à vérifier avant de partir · <a href="mentions.html" target="_blank" rel="noopener">Mentions légales &amp; confidentialité</a></div>
  <div id="map"></div>
  <div id="list"></div>
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="gpx.js"></script>
  <script src="profile.js"></script>
  <script src="feedback.js"></script>
  <script>
    const LABELS = {
      equilibre: 'Équilibrée',
      moins_de_relief: 'Moins de relief',
      plus_de_relief: 'Plus de relief',
      variante: 'Variante'
    };
    const EMPTY = { type: 'FeatureCollection', features: [] };
    // couleurs de la carte, reprises de brand/oyan-tokens.css (MapLibre ne lit pas les variables CSS)
    const ROUTE = { color: '#A8522F', width: 4.5, casing: '#FFFFFF', casingWidth: 8.5,
                    other: '#625D55', otherWidth: 3, start: '#A8522F', user: '#24221F' };

    const startSel = document.getElementById('start');
    const levelSel = document.getElementById('level');
    const durSel = document.getElementById('duration');
    const list = document.getElementById('list');

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [2.19, 41.42],
      zoom: 10
    });

    let startData = null;
    let shown = [];
    let current = 0;
    let marker = null;
    let indexData = null;

    const km = n => n.toFixed(1).replace('.', ',');
    function hm(min) {
      const t = Math.round(min);
      return Math.floor(t / 60) + ' h ' + String(t % 60).padStart(2, '0');
    }
    // neutralise le HTML dans un texte (bonne habitude)
    const esc = s => String(s).replace(/[&<>"]/g,
      c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    // ---------- gare : mention affichée à côté du nom du départ
    const stationNote = kind => kind === 'station'
      ? ' <span class="badge">🚆 Gare : vérifie les conditions du transporteur.</span>' : '';

    // ---------- pente : catégories qualitatives (jamais de pourcentage affiché)
    function slopeCategory(pct) {
      if (pct < 2.5) return 'Peu de côtes';
      if (pct < 4) return 'Quelques côtes';
      if (pct < 6) return 'Vallonné';
      return 'Très vallonné';
    }

    // ---------- modèle d'approche (repli si le fichier est absent ou d'une version majeure inconnue)
    const MODEL_MAJOR = 2;
    let model = { zones: {
      dense: { detour_ratio_median: 1.56, detour_ratio_p90: 2.55, speed_kmh_110W_median: 16.45 },
      peri:  { detour_ratio_median: 1.58, detour_ratio_p90: 2.52, speed_kmh_110W_median: 19.57 },
      rural: { detour_ratio_median: 1.69, detour_ratio_p90: 3.69, speed_kmh_110W_median: 18.07 } } };
    let modelOk = true; // false si la version majeure du modèle est inconnue : aucun temps chiffré
    const DMAX_KM = { dense: 1.75, peri: 2.5, rural: 2.5 }; // seuil « à portée », par zone (brief UX)

    // ---------- géographie
    const rad = d => d * Math.PI / 180;
    function crowKm(lon1, lat1, lon2, lat2) {
      const a = Math.sin(rad(lat2 - lat1) / 2) ** 2 +
        Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(rad(lon2 - lon1) / 2) ** 2;
      return 2 * 6371 * Math.asin(Math.sqrt(a));
    }
    function nearestStart(lon, lat) {
      let best = null;
      for (const s of indexData.starts) {
        const d = crowKm(lon, lat, s.lon, s.lat);
        if (!best || d < best.km) best = { s, km: d };
      }
      return best;
    }
    // emprise des départs générés (champ coverage_bbox de l'index, sinon calculée ici) : sert uniquement à cadrer la carte
    // et à limiter la recherche Photon, jamais à décider si une adresse est couverte
    function coverageBox(padDeg) {
      let b = indexData.coverage_bbox;
      if (!b) {
        const xs = indexData.starts.map(s => s.lon), ys = indexData.starts.map(s => s.lat);
        b = [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
      }
      return [b[0] - padDeg, b[1] - padDeg, b[2] + padDeg, b[3] + padDeg];
    }

    // ---------- recherche d'adresse : Photon (Komoot), service public à usage raisonnable
    // Règles respectées : une requête au plus par seconde, déclenchée par le bouton ou la touche Entrée (pas d'autocomplétion),
    // 3 caractères au moins, résultats gardés en mémoire, attribution OpenStreetMap affichée, délai maximum de 8 s.
    const GEO = { url: 'https://photon.komoot.io/api/', last: 0, cache: new Map() };
    const photonLabel = p => [p.name, [p.street, p.housenumber].filter(Boolean).join(' '), p.postcode, p.city]
      .filter((v, i, a) => v && a.indexOf(v) === i).join(', ');
    async function geocode(q) {
      const key = q.trim().toLowerCase();
      if (GEO.cache.has(key)) return GEO.cache.get(key);
      const wait = 1100 - (Date.now() - GEO.last);
      if (wait > 0) await new Promise(r => setTimeout(r, wait));
      GEO.last = Date.now();
      const bbox = coverageBox(0.3).map(v => v.toFixed(4)).join(',');
      const res = await fetch(GEO.url + '?q=' + encodeURIComponent(q) + '&limit=5&lang=fr&bbox=' + bbox,
        { signal: AbortSignal.timeout(8000) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const items = (data.features || []).map(f => ({
        lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], label: photonLabel(f.properties || {})
      }));
      GEO.cache.set(key, items);
      return items;
    }

    const addr = document.getElementById('addr');
    const resultsEl = document.getElementById('results');
    const whereEl = document.getElementById('where');
    let userMarker = null;

    async function searchAddress() {
      const q = addr.value.trim();
      if (q.length < 3) { resultsEl.textContent = 'Saisissez au moins 3 caractères.'; return; }
      resultsEl.textContent = 'Recherche…';
      try {
        const items = await geocode(q);
        if (!items.length) { resultsEl.textContent = 'Aucune adresse trouvée dans la zone couverte.'; return; }
        resultsEl.innerHTML = items.map((it, i) =>
          '<button type="button" data-i="' + i + '">' + esc(it.label) + '</button>').join('') +
          '<small id="geoattr">Adresses : Photon (Komoot) · © contributeurs OpenStreetMap</small>';
        resultsEl.onclick = e => {
          const b = e.target.closest('button');
          if (!b) return;
          const it = items[Number(b.dataset.i)];
          resultsEl.textContent = '';
          addr.value = it.label;
          setPosition(it.lon, it.lat);
        };
      } catch (err) {
        resultsEl.textContent = 'La recherche d\'adresse est indisponible pour le moment (délai dépassé ou réseau). Touchez la carte ou utilisez votre position.';
      }
    }

    // ---------- position de l'utilisateur -> départ le plus proche -> temps d'approche
    let approachMin = null; // temps d'approche connu pour le départ actuellement choisi (null si choisi dans la liste)
    function setPosition(lon, lat) {
      if (userMarker) userMarker.remove();
      userMarker = new maplibregl.Marker({ color: ROUTE.user }).setLngLat([lon, lat]).addTo(map);
      const { s, km } = nearestStart(lon, lat);
      const name = esc(s.display_name || s.name) + stationNote(s.kind);
      pendingStart = s.id;

      if (!modelOk) {
        approachMin = null;
        whereEl.innerHTML = 'Départ : <b>' + name + '</b><br>Temps d\'approche indisponible pour le moment.';
        chooseStart(s.id);
        return;
      }

      const zoneKey = s.zone && model.zones[s.zone] ? s.zone : 'peri';
      const z = model.zones[zoneKey];
      const speed = z.speed_kmh_110W_median;
      const med = Math.round(km * z.detour_ratio_median / speed * 60);
      const hi = Math.round(km * z.detour_ratio_p90 / speed * 60);
      const portee = Math.round(DMAX_KM[zoneKey] * z.detour_ratio_median / speed * 60);
      const range = zoneKey === 'rural' && hi > med + 3 ? ', jusqu\'à ≈ ' + hi + ' min' : '';
      const nav = 'https://www.openstreetmap.org/directions?engine=fossgis_osrm_bike&route=' +
        lat.toFixed(5) + '%2C' + lon.toFixed(5) + '%3B' + s.lat.toFixed(5) + '%2C' + s.lon.toFixed(5);
      approachMin = med;

      if (med > 30) {
        whereEl.innerHTML = '<span class="warn">Trop loin : le départ le plus proche est à ≈ ' + med + ' min à vélo' + range +
          '.</span><br>Départ : <b>' + name + '</b><br><button type="button" class="btn" id="see">Voir quand même</button>' +
          ' <a href="' + nav + '" target="_blank" rel="noopener">Itinéraire</a>';
        document.getElementById('see').onclick = () => chooseStart(s.id);
        map.fitBounds(new maplibregl.LngLatBounds([lon, lat], [s.lon, s.lat]), { padding: 60, duration: 500 });
        return;
      }
      whereEl.innerHTML = 'Départ : <b>' + name + '</b><br>' +
        (med > portee ? '<span class="warn">Un peu loin : </span>' : '') + '≈ ' + med + ' min à vélo pour le rejoindre' + range +
        (med > portee ? ' · <a href="' + nav + '" target="_blank" rel="noopener">Itinéraire</a>' : '');
      chooseStart(s.id);
    }
    let pendingStart = null;
    function chooseStart(id) { startSel.value = id; loadStart(); }

    async function init() {
      const [index] = await Promise.all([
        fetch('web/data/index.json').then(r => r.json()),
        new Promise(ok => map.once('load', ok))
      ]);
      indexData = index;
      try {
        const m = await fetch('web/approach_model.json');
        if (m.ok) {
          const data = await m.json();
          const major = Number(String(data.version || '').split('.')[0]);
          if (major === MODEL_MAJOR) model = data;
          else modelOk = false; // version majeure inconnue : on ignore ce fichier, aucun temps chiffré
        }
      } catch (e) { /* réseau indisponible : on garde le repli */ }
      index.starts.forEach(s => startSel.add(new Option(s.display_name || s.name, s.id)));
      startSel.selectedIndex = -1;
      Object.entries(index.levels).forEach(([k, v]) => levelSel.add(new Option(v.label, k)));
      levelSel.value = 'modere';
      index.durations_h.forEach(h => durSel.add(new Option(hm(h * 60), h)));
      durSel.value = '2';
      durSel.onchange = showLevel;

      // tracé Oyan : boucle choisie en argile avec liseré blanc, les autres en galet ; le tout sous les noms de lieux
      map.addSource('routes', { type: 'geojson', data: EMPTY });
      const labels = map.getStyle().layers.find(l => l.type === 'symbol');
      const beforeId = labels ? labels.id : undefined;
      const lineLayout = { 'line-cap': 'round', 'line-join': 'round' };
      const isSel = ['get', 'selected'];
      map.addLayer({ id: 'routes-other', type: 'line', source: 'routes', filter: ['!', isSel], layout: lineLayout,
        paint: { 'line-color': ROUTE.other, 'line-width': ROUTE.otherWidth, 'line-opacity': 0.7 } }, beforeId);
      map.addLayer({ id: 'routes-casing', type: 'line', source: 'routes', filter: isSel, layout: lineLayout,
        paint: { 'line-color': ROUTE.casing, 'line-width': ROUTE.casingWidth } }, beforeId);
      map.addLayer({ id: 'routes', type: 'line', source: 'routes', filter: isSel, layout: lineLayout,
        paint: { 'line-color': ROUTE.color, 'line-width': ROUTE.width } }, beforeId);

      startSel.onchange = () => {
        const entry = indexData.starts.find(x => x.id === startSel.value);
        whereEl.innerHTML = 'Départ choisi dans la liste.' + stationNote(entry && entry.kind);
        approachMin = null; loadStart();
      };
      levelSel.onchange = showLevel;
      list.onclick = e => {
        const card = e.target.closest('.card');
        if (card && Number(card.dataset.i) !== current) select(Number(card.dataset.i));
      };
      document.getElementById('go').onclick = searchAddress;
      addr.onkeydown = e => { if (e.key === 'Enter') searchAddress(); };
      document.getElementById('me').onclick = () => {
        if (!navigator.geolocation) { whereEl.textContent = 'La localisation n\'est pas disponible sur cet appareil.'; return; }
        whereEl.textContent = 'Localisation…';
        navigator.geolocation.getCurrentPosition(
          p => { addr.value = ''; setPosition(p.coords.longitude, p.coords.latitude); },
          () => { whereEl.textContent = 'Localisation refusée. Saisissez une adresse ou touchez la carte.'; },
          { enableHighAccuracy: true, timeout: 15000 });
      };
      map.on('click', e => { addr.value = ''; setPosition(e.lngLat.lng, e.lngLat.lat); });
      const b = coverageBox(0.02);
      map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: 10, duration: 0 });
    }

    async function loadStart() {
      list.textContent = 'Chargement…';
      const res = await fetch('web/data/starts/' + startSel.value + '.json');
      if (!res.ok) { list.textContent = 'Erreur de chargement (' + res.status + ')'; return; }
      startData = await res.json();
      if (marker) marker.remove();
      marker = new maplibregl.Marker({ color: ROUTE.start })
        .setLngLat([startData.start.lon, startData.start.lat]).addTo(map);
      showLevel();
    }

    function showLevel() {
      if (!startData) return;
      shown = startData.options.filter(o => o.level === levelSel.value &&
        (o.duration_target_min == null ||
         Math.round(o.duration_target_min) === Math.round(Number(durSel.value) * 60)));
      if (!shown.length) {
        const avail = [...new Set(startData.options.filter(o => o.level === levelSel.value)
          .map(o => Math.round(o.duration_target_min)))].sort((a, b) => a - b);
        list.innerHTML = 'Non disponible : pas de trajet de ' + hm(Number(durSel.value) * 60) + ' (' +
          esc(levelSel.options[levelSel.selectedIndex].text) + ') depuis ce départ.' +
          (avail.length ? '<br>Autre durée possible : ' + avail.map(m =>
            '<button type="button" class="btn other-dur" data-min="' + m + '">' +
            hm(m) + '</button>').join('') : '<br>Essayez un autre niveau.');
        list.querySelectorAll('button[data-min]').forEach(b => {
          b.onclick = () => { durSel.value = String(Number(b.dataset.min) / 60); showLevel(); };
        });
        map.getSource('routes').setData(EMPTY);
        return;
      }
      const i = shown.findIndex(o => o.label === 'equilibre');
      select(i >= 0 ? i : 0);
    }

    // change pour la durée disponible suivante, sans changer le niveau (bouton "Essayer plus long")
    function nextDuration() {
      const durs = indexData.durations_h.map(Number).sort((a, b) => a - b);
      const next = durs.find(d => d > Number(durSel.value));
      if (next != null) { durSel.value = String(next); showLevel(); }
    }

    // détail affiché sous la carte sélectionnée
    function detailHtml(o) {
      const pct = f => Math.round(f * 100) + ' %';
      const pitch = (o.pitch || []).map(p => '<li>' + esc(p) + '</li>').join('');
            const climbs = (o.terrain.climbs || []).map(c =>
        '<li>km ' + km(c.start_km) + ' : ' + km(c.length_km) + ' km, +' + Math.round(c.gain_m) + ' m</li>').join('');
            // ville : uniquement à partir de exit_dense_km, comparé à la distance réelle (pas de null en pratique)
      let cityLine = '';
      if (o.exit_dense_km === 0) {
        // rien à afficher
      } else if (o.exit_dense_km == null || o.exit_dense_km >= o.distance_km - 0.05) {
        const hasLonger = startData.options.some(x => x.level === o.level && x.duration_target_min > o.duration_target_min);
        cityLine = 'Depuis ici, une sortie de ' + hm(o.time_est_min) + ' reste en ville.' +
          (hasLonger ? ' <button type="button" class="btn" onclick="nextDuration()">Essayer plus long</button>' : '');
      } else {
        cityLine = 'Sort de la ville après ' + km(o.exit_dense_km) + ' km.';
      }

      // pente : catégorie qualitative + badge à seuil unique, jamais de chiffre
      const slopeCat = o.terrain.avg_climb_grade_pct != null ? slopeCategory(o.terrain.avg_climb_grade_pct) : null;
      const steepBadge = o.terrain.max_grade_pct != null && o.terrain.max_grade_pct >= 20;

      return `
        <ul class="pitch">${pitch}</ul>
        ${profileSvg(o)}
        ${cityLine ? '<p class="city">' + cityLine + '</p>' : ''}
        <div class="facts">
          Pistes cyclables : ${pct(o.shares.dedicated_cycleway)}<br>
          Routes principales : ${pct(o.shares.main_roads)}<br>
          ${o.traffic_lights != null ? 'Feux recensés dans OSM : ' + o.traffic_lights + '<br>' : ''}
          Montées : ${o.terrain.n_climbs}${slopeCat ? ' · ' + slopeCat : ''}
          ${steepBadge ? '<br><span class="badge">⚠️ Au moins une rampe très raide</span>' : ''}
        </div>
        <ul class="climbs">${climbs}</ul>
        <button type="button" class="btn btn-accent gpx" onclick="downloadGpx(startData.start, shown[current], indexData.levels[shown[current].level].label)">Télécharger le GPX</button><br>
        ${feedbackHtml(o)}
        <small>Durées estimées en mouvement, sans pauses. Dénivelé : estimation.</small>`;
    }

    function select(i) {
      current = i;
      const totalEl = document.getElementById('totalApproach');
      totalEl.textContent = approachMin != null
        ? '+ trajet jusqu\'au départ : ≈ ' + hm(shown[current].time_est_min + approachMin) + ' au total, sans pauses'
        : '';
      list.innerHTML = shown.map((o, k) => `
        <div class="card ${k === current ? 'active' : ''}" data-i="${k}">
          <b>${LABELS[o.label] || o.label}</b><br>
          ${km(o.distance_km)} km · D+ ${Math.round(o.ascend_m)} m<br>
          <small>≈ ${hm(o.time_est_min)} · ${km(o.distance_km / (o.time_est_min / 60))} km/h · en ville ${Math.round(o.shares.urban.city * 100)} %</small>
          ${k === current ? detailHtml(o) : ''}
        </div>`).join('');
      list.querySelector('.card.active').scrollIntoView({ block: 'nearest' });

      const features = shown
        .map((o, k) => ({
          type: 'Feature',
          properties: { selected: k === current },
          geometry: { type: 'LineString', coordinates: o.coords }
        }))
        .sort((a, b) => a.properties.selected - b.properties.selected);
      map.getSource('routes').setData({ type: 'FeatureCollection', features });

      const bounds = new maplibregl.LngLatBounds();
      shown[current].coords.forEach(c => bounds.extend([c[0], c[1]]));
      map.fitBounds(bounds, { padding: 40, duration: 500 });
    }

    init();
  </script>
</body>
</html>
